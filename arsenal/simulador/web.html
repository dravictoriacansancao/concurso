amento": "Res. CFM 2.217/2018 (CEM), art. 93", "pegadinha": "Condicionantes falsas ('desde que concorde', 'apenas na judicial').", "prob_tema": 0.04, "verificar": false}, {"id": "PER-019", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CEM – laudo sem exame pessoal", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Por sobrecarga de agenda, um perito pretende assinar laudos elaborados por médico residente que examinou os periciandos, sem reexaminá-los. Considerando o Código de Ética Médica, assinale a afirmativa CORRETA.", "alternativas": {"A": "É permitido ao médico assinar laudos periciais elaborados por terceiro, desde que este seja médico regularmente inscrito no CRM.", "B": "É vedado ao médico assinar laudos periciais quando não tenha realizado pessoalmente o exame.", "C": "É permitido ao médico assinar laudos periciais sem exame pessoal quando houver documentação médica suficiente nos autos.", "D": "É vedado ao médico assinar laudos periciais sem exame pessoal apenas nas perícias criminais de corpo de delito.", "E": "É permitido ao médico assinar laudos periciais sem exame pessoal, desde que a autoridade requisitante autorize por escrito."}, "gabarito": "B", "comentario_correta": "Art. 92: é vedado ao médico assinar laudos periciais, auditoriais ou de verificação médico-legal caso não tenha realizado pessoalmente o exame.", "por_que_cada_errada": {"A": "O art. 92 exige exame pessoal de quem assina.", "B": "Esta é a alternativa a ser marcada.", "C": "Documentos não substituem o exame pessoal para quem assina o laudo.", "D": "A vedação alcança laudos periciais, auditoriais e de verificação médico-legal em geral.", "E": "A autorização da autoridade não afasta a vedação ética."}, "fundamento": "Res. CFM 2.217/2018 (CEM), art. 92", "pegadinha": "'Desde que' legitimando conduta vedada.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-020", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CEM – modificar tratamento", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Durante perícia, a perita constata que o periciando usa dose de lítio potencialmente tóxica, com tremor grosseiro e confusão mental. Considerando o Código de Ética Médica, assinale a afirmativa CORRETA.", "alternativas": {"A": "Em regra é vedado ao perito modificar o tratamento, mas pode fazê-lo em urgência, dispensada a comunicação ao médico assistente.", "B": "É sempre vedado ao perito modificar o tratamento, devendo limitar-se a registrar o achado no laudo, sem outra providência.", "C": "Em regra é vedado ao perito modificar o tratamento, salvo urgência, comunicando o fato por escrito ao médico assistente.", "D": "É vedado ao perito modificar o tratamento, mas pode suspender o benefício até que o periciando ajuste a medicação.", "E": "É permitido ao perito modificar livremente o tratamento, pois sua função inclui a correção de condutas do médico assistente."}, "gabarito": "C", "comentario_correta": "Art. 97: é vedado ao médico autorizar, vetar, bem como modificar, quando na função de auditor ou de perito, procedimentos propedêuticos ou terapêuticos instituídos, salvo, no último caso, em situações de urgência, emergência ou iminente perigo de morte do paciente, comunicando, por escrito, o fato ao médico assistente.", "por_que_cada_errada": {"A": "A comunicação por escrito ao médico assistente é exigida.", "B": "O art. 97 ressalva urgência, emergência e iminente perigo de morte.", "C": "Esta é a alternativa a ser marcada.", "D": "Não há base para suspender o benefício nesse contexto; o caso é de urgência clínica.", "E": "A regra é a vedação; a exceção é a urgência."}, "fundamento": "Res. CFM 2.217/2018 (CEM), art. 97", "pegadinha": "Absoluto ('sempre vedado') e supressão do dever de comunicar.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-021", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CEM – conduta durante o exame", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "INCORRETA", "texto": null, "enunciado": "Considerando as vedações do Capítulo XI (Auditoria e Perícia Médica) do Código de Ética Médica, assinale a afirmativa INCORRETA.", "alternativas": {"A": "É permitido ao perito comentar, diante do examinado, erros do médico assistente.", "B": "É vedado ao perito receber remuneração vinculada ao sucesso da causa.", "C": "É vedado ao perito ultrapassar os limites de suas atribuições e de sua competência.", "D": "É vedado ao perito assinar laudo sem ter realizado pessoalmente o exame.", "E": "É vedado ao perito deixar de atuar com absoluta isenção quando designado para a função."}, "gabarito": "A", "comentario_correta": "Art. 94: é vedado ao médico intervir, quando em função de auditor, assistente técnico ou perito, nos atos profissionais de outro médico, ou fazer qualquer apreciação em presença do examinado, reservando suas observações para o relatório.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Correta: art. 96.", "C": "Correta: art. 98.", "D": "Correta: art. 92.", "E": "Correta: art. 98."}, "fundamento": "Res. CFM 2.217/2018 (CEM), arts. 92, 94, 96 e 98", "pegadinha": "Comando INCORRETA: as demais são literalidade do CEM.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-022", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CPC – assistente técnico", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em perícia judicial previdenciária, o assistente técnico do INSS foi indicado e a parte autora alegou que ele seria suspeito por ser servidor da autarquia. Considerando o CPC, assinale a afirmativa CORRETA.", "alternativas": {"A": "Os assistentes técnicos sujeitam-se às mesmas causas de impedimento e suspeição do perito, devendo ser substituídos no caso.", "B": "Os assistentes técnicos são de confiança da parte e não se sujeitam a impedimento ou suspeição.", "C": "Os assistentes técnicos são de confiança do juízo e, por isso, devem ser escolhidos entre peritos cadastrados no tribunal.", "D": "Os assistentes técnicos são de confiança da parte, mas o perito pode realizar as diligências sem lhes dar ciência prévia.", "E": "Os assistentes técnicos são de confiança da parte e assinam o laudo em conjunto com o perito, que o subscreve como revisor."}, "gabarito": "B", "comentario_correta": "Art. 466, § 1º: os assistentes técnicos são de confiança da parte e não estão sujeitos a impedimento ou suspeição. § 2º: o perito deve assegurar aos assistentes o acesso e o acompanhamento das diligências, com prévia comunicação, comprovada nos autos, com antecedência mínima de 5 dias.", "por_que_cada_errada": {"A": "O art. 466, § 1º, afasta impedimento e suspeição dos assistentes.", "B": "Esta é a alternativa a ser marcada.", "C": "São de confiança da parte.", "D": "O art. 466, § 2º, exige comunicação prévia com antecedência mínima de 5 dias.", "E": "O assistente apresenta parecer próprio; o laudo é do perito."}, "fundamento": "CPC, art. 466, §§ 1º e 2º", "pegadinha": "Estender ao assistente regras do perito.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-023", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CPC – limites do laudo", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "No laudo de perícia judicial sobre incapacidade, a perita acrescentou opinião sobre a 'má-fé' do autor e sugeriu ao juiz a improcedência do pedido. Considerando o art. 473 do CPC, assinale a afirmativa CORRETA.", "alternativas": {"A": "É permitido ao perito ampliar o objeto da perícia quando identificar fatos relevantes, dispensando autorização do juízo.", "B": "É dever do perito indicar ao juiz a solução jurídica do pedido, por ser o profissional com conhecimento técnico do caso.", "C": "É permitido ao perito emitir opiniões pessoais sobre a conduta das partes, desde que fundamente em linguagem simples.", "D": "É vedado ao perito responder a quesitos das partes, devendo limitar-se aos quesitos formulados pelo juiz.", "E": "É vedado ao perito ultrapassar os limites da designação e emitir opiniões pessoais alheias ao exame técnico."}, "gabarito": "E", "comentario_correta": "Art. 473, § 2º: é vedado ao perito ultrapassar os limites de sua designação, bem como emitir opiniões pessoais que excedam o exame técnico ou científico do objeto da perícia. Inciso IV: resposta conclusiva a todos os quesitos apresentados pelo juiz, pelas partes e pelo MP.", "por_que_cada_errada": {"A": "Ultrapassar os limites da designação é vedado.", "B": "A solução jurídica cabe ao juiz; o perito responde ao objeto técnico.", "C": "O § 2º veda opiniões pessoais que excedam o exame técnico.", "D": "O laudo deve responder conclusivamente a todos os quesitos (art. 473, IV).", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "CPC, art. 473, IV e § 2º", "pegadinha": "Confundir conclusão técnica com conclusão jurídica.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-024", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CPC – valoração do laudo", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando a valoração da prova pericial pelo juiz, conforme o CPC, assinale a afirmativa CORRETA.", "alternativas": {"A": "O juiz não está adstrito ao laudo, mas é vedada a determinação de nova perícia sobre a mesma matéria.", "B": "O juiz está vinculado ao laudo quando não houver impugnação das partes no prazo legal.", "C": "O juiz não está adstrito ao laudo, mas deve fundamentar por que acolhe ou afasta suas conclusões.", "D": "O juiz está vinculado às conclusões do laudo, só podendo afastá-las mediante a realização de nova perícia.", "E": "O juiz não está adstrito ao laudo e pode afastá-lo sem fundamentação, em razão do livre convencimento."}, "gabarito": "C", "comentario_correta": "Art. 479: o juiz apreciará a prova pericial de acordo com o art. 371, indicando na sentença os motivos que o levaram a considerar ou a deixar de considerar as conclusões do laudo. Art. 480: nova perícia quando a matéria não estiver suficientemente esclarecida.", "por_que_cada_errada": {"A": "O art. 480 admite nova perícia quando a matéria não estiver suficientemente esclarecida.", "B": "A ausência de impugnação não vincula o juiz.", "C": "Esta é a alternativa a ser marcada.", "D": "O juiz aprecia a prova livremente, com fundamentação (art. 479).", "E": "O art. 479 exige indicação dos motivos."}, "fundamento": "CPC, arts. 371, 479 e 480", "pegadinha": "Vinculação × livre convencimento sem motivação.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-025", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CPC – escusa do perito", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Médica nomeada perita judicial constatou que é vizinha e amiga íntima do autor. Considerando o CPC, assinale a afirmativa CORRETA.", "alternativas": {"A": "A escusa deve ser apresentada em 15 dias da intimação ou da suspeição superveniente, sob pena de renúncia.", "B": "A escusa é dispensada, pois amizade íntima com a parte não configura suspeição aplicável ao perito.", "C": "A escusa deve ser apresentada no prazo de 5 dias, contado da entrega do laudo, sob pena de nulidade da perícia realizada.", "D": "A escusa deve ser apresentada no prazo de 15 dias, mas somente nos casos de impedimento, sendo vedada por suspeição.", "E": "A escusa pode ser apresentada a qualquer tempo, inclusive após a entrega do laudo, sem consequência processual."}, "gabarito": "A", "comentario_correta": "Art. 157, § 1º: a escusa será apresentada no prazo de 15 dias, contado da intimação, da suspeição ou do impedimento supervenientes, sob pena de renúncia ao direito a alegá-la. Art. 148, II, e art. 145, I: amizade íntima é causa de suspeição aplicável ao perito.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "As causas de suspeição do juiz aplicam-se ao perito (art. 148, II), incluindo amizade íntima.", "C": "O prazo é de 15 dias, contado da intimação, da suspeição ou do impedimento supervenientes.", "D": "Cabe escusa por impedimento ou suspeição.", "E": "Há prazo, sob pena de renúncia."}, "fundamento": "CPC, arts. 145, 148, II, e 157, § 1º", "pegadinha": "Troca de prazo e de termo inicial.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-026", "disciplina": "Perícia", "tema": "Exame clínico direcionado à perícia médica", "subtema": "Sinais de Waddell", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Periciando com lombalgia crônica apresenta dor à compressão axial do crânio, à rotação simulada do tronco, Lasègue positivo deitado e negativo sentado, e reação exagerada ao exame. Considerando os sinais de Waddell, assinale a afirmativa CORRETA.", "alternativas": {"A": "A positividade dos sinais deve ser desconsiderada, pois sua aplicação é vedada na perícia previdenciária.", "B": "A positividade de três ou mais categorias indica radiculopatia orgânica, devendo ser confirmada por eletroneuromiografia.", "C": "A positividade de qualquer um dos sinais basta para afastar doença orgânica da coluna lombar.", "D": "A positividade de três ou mais categorias comprova simulação, autorizando a conclusão de capacidade plena no laudo.", "E": "A positividade de três ou mais categorias sugere componente não orgânico, mas não comprova simulação por si só."}, "gabarito": "E", "comentario_correta": "Os sinais de Waddell (sensibilidade, simulação, distração, distúrbios regionais e reação exagerada) indicam componente não orgânico quando positivos em três ou mais das cinco categorias; não diferenciam simulação de fatores psicossociais.", "por_que_cada_errada": {"A": "Não há essa vedação; são ferramenta semiológica auxiliar.", "B": "Os sinais de Waddell não indicam radiculopatia.", "C": "Um sinal isolado tem baixo valor; a interpretação considera três ou mais categorias.", "D": "Os sinais indicam componente não orgânico/comportamental; não diagnosticam simulação.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Waddell et al., Spine 1980 – semiologia pericial", "pegadinha": "Equiparar 'não orgânico' a 'simulação'.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-027", "disciplina": "Perícia", "tema": "Exame clínico direcionado à perícia médica", "subtema": "Sinal de Hoover", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Periciando refere paresia do membro inferior direito. Ao fletir ativamente o quadril esquerdo contra resistência, a perita sente extensão vigorosa do quadril direito, que antes parecia sem força. Considerando a semiologia pericial, assinale a afirmativa CORRETA.", "alternativas": {"A": "O achado corresponde ao sinal de Babinski, sugestivo de lesão do neurônio motor superior no membro referido.", "B": "O achado corresponde ao sinal de Hoover positivo, sugestivo de fraqueza funcional do membro referido.", "C": "O achado corresponde ao sinal de Hoover negativo, confirmando a paresia orgânica do membro referido.", "D": "O achado corresponde ao sinal de Hoover positivo, indicativo de lesão radicular L5 no membro referido.", "E": "O achado corresponde ao sinal de Romberg, sugestivo de comprometimento da sensibilidade proprioceptiva."}, "gabarito": "B", "comentario_correta": "No teste de Hoover, a flexão do quadril contralateral contra resistência provoca extensão involuntária do quadril 'parético'. Força presente nessa manobra, ausente no teste direto, sugere fraqueza funcional.", "por_que_cada_errada": {"A": "Babinski é reflexo cutâneo-plantar; o achado descrito é o teste de Hoover.", "B": "Esta é a alternativa a ser marcada.", "C": "A extensão involuntária presente torna o sinal positivo para componente funcional.", "D": "Hoover positivo sugere componente funcional, não radiculopatia.", "E": "Romberg avalia equilíbrio com olhos fechados."}, "fundamento": "Semiologia neurológica aplicada à perícia", "pegadinha": "Troca de epônimos e de interpretação (positivo × negativo).", "prob_tema": 0.04, "verificar": false}, {"id": "PER-028", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças psiquiátricas", "subtema": "Diagnóstico × incapacidade", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Professora com episódio depressivo moderado (CID-10 F32.1), em tratamento há três semanas, apresenta lentificação, prejuízo de concentração e insônia, com ideação passiva de morte. Considerando a avaliação pericial psiquiátrica, assinale a afirmativa CORRETA.", "alternativas": {"A": "A incapacidade decorre da repercussão funcional dos sintomas sobre a atividade, e não do diagnóstico isolado.", "B": "A incapacidade deve ser considerada permanente, pois transtornos depressivos têm curso crônico e recorrente.", "C": "A incapacidade deve ser negada, pois o tratamento iniciado há três semanas indica boa adesão e controle dos sintomas.", "D": "A incapacidade decorre da gravidade do CID informado no atestado, que vincula a conclusão do perito.", "E": "A incapacidade decorre do diagnóstico de episódio depressivo, que por si só gera afastamento de no mínimo um ano."}, "gabarito": "A", "comentario_correta": "Na perícia, a incapacidade é inferida da repercussão funcional (sintomas, exame psíquico, gravidade, adesão e tempo de tratamento) frente às exigências da atividade; o diagnóstico isolado não define incapacidade nem sua duração.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Episódio moderado em tratamento inicial tem prognóstico de recuperação: temporária.", "C": "Três semanas é tempo inicial; o quadro descrito tem repercussão funcional relevante.", "D": "O atestado do assistente não vincula o perito.", "E": "Diagnóstico não equivale a incapacidade; não há prazo mínimo legal."}, "fundamento": "Diretrizes de perícia médica (INSS) – transtornos mentais", "pegadinha": "'Por si só' e 'vincula'.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-029", "disciplina": "Perícia", "tema": "Classificação Internacional de Doenças (CID-10/CID-11)", "subtema": "Burnout na CID-11", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "A síndrome de burnout tem sido frequentemente alegada em perícias de servidores. Considerando sua classificação na CID-11, assinale a afirmativa CORRETA.", "alternativas": {"A": "Na CID-11, o burnout é descrito como fenômeno ocupacional aplicável a qualquer contexto de vida, inclusive o familiar.", "B": "Na CID-11, o burnout é classificado como transtorno de ansiedade, exigindo exclusão de causas orgânicas para o diagnóstico.", "C": "Na CID-11, o burnout foi excluído da classificação, por ausência de critérios diagnósticos operacionais.", "D": "Na CID-11, o burnout é classificado como transtorno depressivo, no capítulo de transtornos mentais, com código iniciado por 6A.", "E": "Na CID-11, o burnout (QD85) é fenômeno ocupacional, no capítulo de fatores que influenciam a saúde, e não transtorno mental."}, "gabarito": "E", "comentario_correta": "Na CID-11 (vigente na OMS desde 01/01/2022), 'burn-out' (QD85) integra o capítulo 'Fatores que influenciam o estado de saúde ou o contato com serviços de saúde', definido como fenômeno ocupacional resultante de estresse crônico no trabalho não gerenciado com sucesso.", "por_que_cada_errada": {"A": "A definição restringe-se ao contexto ocupacional.", "B": "Não é classificado como transtorno de ansiedade.", "C": "Consta como QD85.", "D": "O burnout não está no capítulo 06; o código é QD85.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "OMS – CID-11, QD85", "pegadinha": "Classificar como transtorno mental ou ampliar para contextos não ocupacionais.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-030", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças osteomusculares", "subtema": "Túnel do carpo", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Digitadora relata parestesias noturnas em polegar, indicador e médio da mão direita; Phalen e Tinel no punho são positivos e há hipotrofia tenar discreta. Considerando a avaliação pericial, assinale a afirmativa CORRETA.", "alternativas": {"A": "O quadro sugere síndrome do túnel do carpo, sendo o diagnóstico pericial dispensável de correlação com exames complementares.", "B": "O quadro sugere síndrome do túnel do carpo, cuja hipotrofia tenar indica fase inicial e reversível sem tratamento.", "C": "O quadro sugere síndrome do túnel cubital, cuja confirmação se faz pela radiografia simples do cotovelo direito.", "D": "O quadro sugere radiculopatia C8, cuja confirmação se faz pela ressonância magnética da coluna cervical.", "E": "O quadro sugere síndrome do túnel do carpo, cuja confirmação e graduação se fazem pela eletroneuromiografia."}, "gabarito": "E", "comentario_correta": "Parestesias no território do mediano, Phalen e Tinel no punho e hipotrofia tenar sugerem STC; a eletroneuromiografia confirma e gradua o comprometimento.", "por_que_cada_errada": {"A": "A ENMG confirma e gradua; a correlação clínico-complementar é recomendada.", "B": "Hipotrofia tenar indica comprometimento mais avançado (axonal).", "C": "A distribuição é mediana (polegar, indicador e médio) e os testes são no punho.", "D": "C8 acomete 4º e 5º dedos; o quadro é do nervo mediano.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Semiologia ortopédica/neurológica; DORT", "pegadinha": "Troca de território nervoso e de estadiamento.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-031", "disciplina": "Perícia", "tema": "Doenças ocupacionais e relacionadas ao trabalho", "subtema": "PAIR", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando as características da perda auditiva induzida por ruído (PAIR) ocupacional, assinale a afirmativa CORRETA.", "alternativas": {"A": "A PAIR é mista, em geral assimétrica, com reversão completa em até seis meses de afastamento do ruído.", "B": "A PAIR é neurossensorial, em geral bilateral e simétrica, mas continua progredindo indefinidamente após cessar a exposição.", "C": "A PAIR é condutiva, em geral unilateral, reversível, com predomínio nas frequências graves, e progride após cessar a exposição.", "D": "A PAIR é neurossensorial, bilateral e simétrica, irreversível, com entalhe em 3, 4 ou 6 kHz, e não progride sem exposição.", "E": "A PAIR é neurossensorial, em geral bilateral, com entalhe nas frequências de 250 e 500 Hz, poupando as frequências agudas."}, "gabarito": "D", "comentario_correta": "PAIR: perda neurossensorial, quase sempre bilateral e simétrica, irreversível, com entalhe em 3, 4 ou 6 kHz e recuperação em 8 kHz; não progride após cessada a exposição; raramente ultrapassa 40 dB nas frequências baixas e 75 dB nas altas.", "por_que_cada_errada": {"A": "É neurossensorial e irreversível.", "B": "Cessada a exposição, a PAIR não progride.", "C": "É neurossensorial, bilateral, irreversível, com predomínio em agudos; não progride sem exposição.", "D": "Esta é a alternativa a ser marcada.", "E": "O entalhe típico ocorre em 3, 4 ou 6 kHz."}, "fundamento": "Ministério da Saúde – Perda Auditiva Induzida por Ruído (Protocolo); NR-7", "pegadinha": "Troca condutiva × neurossensorial; progressão sem exposição.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-032", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças respiratórias", "subtema": "Espirometria", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em perícia de ex-marmorista, a espirometria mostra CVF de 62% do previsto e VEF1/CVF de 0,86. Considerando a interpretação funcional respiratória, assinale a afirmativa CORRETA.", "alternativas": {"A": "O padrão confirma distúrbio obstrutivo grave, pois a relação VEF1/CVF elevada indica limitação ao fluxo aéreo.", "B": "O padrão é normal, pois a relação VEF1/CVF acima de 0,70 afasta qualquer distúrbio ventilatório.", "C": "O padrão sugere distúrbio restritivo, a ser confirmado pela medida da capacidade pulmonar total.", "D": "O padrão confirma distúrbio restritivo, sendo dispensável a medida da capacidade pulmonar total.", "E": "O padrão sugere distúrbio misto, pois a CVF reduzida associada à relação elevada define obstrução e restrição."}, "gabarito": "C", "comentario_correta": "CVF reduzida com VEF1/CVF normal ou elevada sugere distúrbio ventilatório restritivo, que deve ser confirmado pela redução da capacidade pulmonar total (pletismografia ou diluição de gases). Contexto compatível com silicose.", "por_que_cada_errada": {"A": "Obstrução se caracteriza por VEF1/CVF REDUZIDA.", "B": "Relação normal não afasta restrição com CVF reduzida.", "C": "Esta é a alternativa a ser marcada.", "D": "A espirometria sugere; a CPT confirma a restrição.", "E": "Distúrbio misto exige relação reduzida com CVF reduzida e restrição confirmada."}, "fundamento": "Diretrizes SBPT para testes de função pulmonar", "pegadinha": "Interpretar relação elevada como obstrução; 'dispensável'.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-033", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças cardiovasculares", "subtema": "Cardiopatia grave", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Segurado com cardiopatia isquêmica, fração de ejeção de 30% e dispneia aos pequenos esforços (classe funcional III da NYHA) requer benefício com isenção de carência. Considerando a avaliação pericial, assinale a afirmativa CORRETA.", "alternativas": {"A": "A caracterização de cardiopatia grave exige cirurgia cardíaca prévia, sem a qual não há enquadramento para isenção.", "B": "A caracterização de cardiopatia grave apoia-se em critérios funcionais e prognósticos, e não no diagnóstico isolado.", "C": "A caracterização de cardiopatia grave decorre do diagnóstico de doença isquêmica, independentemente da repercussão funcional.", "D": "A caracterização de cardiopatia grave depende apenas da idade do segurado, aplicando-se a partir dos 60 anos.", "E": "A caracterização de cardiopatia grave é atribuição do cardiologista assistente, cujo atestado vincula o perito."}, "gabarito": "B", "comentario_correta": "Cardiopatia grave é conceito médico-pericial baseado em limitação funcional (ex.: NYHA III–IV), disfunção ventricular (ex.: FE reduzida), isquemia, arritmias graves e prognóstico — não no rótulo diagnóstico.", "por_que_cada_errada": {"A": "Não há essa exigência.", "B": "Esta é a alternativa a ser marcada.", "C": "O diagnóstico isolado não define gravidade.", "D": "Idade não é critério de gravidade cardíaca.", "E": "A caracterização é pericial; o atestado não vincula."}, "fundamento": "Lei 8.213/1991, art. 151; consenso de cardiopatia grave (SBC) – critérios funcionais", "pegadinha": "Diagnóstico ou atestado tratados como suficientes.", "prob_tema": 0.04, "verificar": true}, {"id": "PER-034", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças infecciosas", "subtema": "HIV – estigma (Súmula 78 TNU)", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Segurado com HIV, assintomático, carga viral indetectável, trabalhava como cozinheiro em pequena cidade, onde relata discriminação após a revelação do diagnóstico. Considerando a avaliação de incapacidade no âmbito judicial, assinale a afirmativa CORRETA.", "alternativas": {"A": "Além da condição clínica, deve ser considerada apenas a escolaridade, sendo o estigma social matéria estranha à perícia.", "B": "Além da condição clínica, devem ser consideradas as condições pessoais, sociais, econômicas e culturais do segurado.", "C": "A ausência de sintomas e a carga viral indetectável afastam qualquer análise de incapacidade, sendo irrelevante o contexto social.", "D": "O diagnóstico de HIV gera presunção absoluta de incapacidade total e permanente, dispensando o exame pericial.", "E": "A ocupação de cozinheiro é incompatível com o HIV por risco de transmissão alimentar, gerando incapacidade técnica."}, "gabarito": "B", "comentario_correta": "Súmula 78 da TNU: comprovado que o requerente é portador do HIV, cabe ao julgador verificar as condições pessoais, sociais, econômicas e culturais, de forma a analisar a incapacidade em sentido amplo, em face da elevada estigmatização social da doença.", "por_que_cada_errada": {"A": "A análise ampla inclui o estigma, conforme a súmula.", "B": "Esta é a alternativa a ser marcada.", "C": "A Súmula 78 da TNU manda considerar o contexto social em face do estigma.", "D": "Não há presunção absoluta; a análise é individual.", "E": "Não há transmissão do HIV por manipulação de alimentos."}, "fundamento": "TNU, Súmula 78", "pegadinha": "Restringir a análise ao quadro clínico; mito de transmissão alimentar.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-035", "disciplina": "Perícia", "tema": "Medicina baseada em evidências", "subtema": "Valor preditivo positivo", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Um teste de rastreio tem sensibilidade de 90% e especificidade de 80% e foi aplicado em população com prevalência de 10% da doença. Considerando os conceitos de epidemiologia clínica, assinale a afirmativa CORRETA.", "alternativas": {"A": "O valor preditivo positivo é de aproximadamente 33%, e aumentaria caso a prevalência da doença fosse menor.", "B": "O valor preditivo positivo é de 90%, pois corresponde à sensibilidade do teste, independentemente da prevalência.", "C": "O valor preditivo positivo é de aproximadamente 67%, pois resulta da média entre sensibilidade e especificidade.", "D": "O valor preditivo positivo é de 80%, pois corresponde à especificidade do teste na população estudada.", "E": "O valor preditivo positivo é de aproximadamente 33%, pois depende também da prevalência da doença."}, "gabarito": "E", "comentario_correta": "Em 1.000 pessoas: 100 doentes → 90 VP; 900 sadios → 180 FP (20%). VPP = 90 ÷ (90 + 180) ≈ 33%. O VPP cai quando a prevalência cai.", "por_que_cada_errada": {"A": "Com prevalência menor, o VPP diminui.", "B": "Sensibilidade ≠ VPP; VPP = 0,09 ÷ (0,09 + 0,18) ≈ 33%.", "C": "Não se calcula por média.", "D": "Especificidade ≠ VPP.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Epidemiologia clínica – testes diagnósticos", "pegadinha": "Confundir sensibilidade/especificidade com valores preditivos.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-036", "disciplina": "Perícia", "tema": "Epidemiologia clínica aplicada à perícia", "subtema": "Medidas de associação", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Em estudo de caso-controle sobre exposição ocupacional à sílica e câncer de pulmão, os pesquisadores precisam estimar a associação. Considerando os desenhos epidemiológicos, assinale a afirmativa CORRETA.", "alternativas": {"A": "No estudo de caso-controle, a medida de associação adequada é a razão de chances, pois não se calcula a incidência.", "B": "No estudo de caso-controle, a medida de associação adequada é o risco relativo, calculado a partir da incidência nos expostos.", "C": "No estudo de caso-controle, a medida de associação adequada é a razão de chances, que sempre equivale exatamente ao risco relativo.", "D": "No estudo de caso-controle, a medida de associação adequada é a prevalência, obtida em um único momento no tempo.", "E": "No estudo de caso-controle, a medida de associação adequada é o número necessário para tratar, derivado da redução de risco."}, "gabarito": "A", "comentario_correta": "Caso-controle seleciona por desfecho; estima-se a OR. Em doenças raras a OR aproxima-se do RR. Coortes permitem incidência e RR.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "O caso-controle parte do desfecho; não permite calcular incidência.", "C": "Aproxima-se do RR apenas quando a doença é rara.", "D": "Prevalência é medida de frequência, típica de estudo transversal.", "E": "NNT deriva de ensaios/coortes."}, "fundamento": "Epidemiologia clínica – desenhos de estudo", "pegadinha": "'Sempre equivale' e troca de medidas.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-037", "disciplina": "Perícia", "tema": "Medicina baseada em evidências", "subtema": "Hierarquia de evidências", "dificuldade": 1, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando a hierarquia de níveis de evidência em medicina baseada em evidências para questões de terapêutica, assinale a afirmativa CORRETA.", "alternativas": {"A": "Opiniões de especialistas ocupam o topo da hierarquia de evidências terapêuticas, por refletirem a prática clínica.", "B": "Estudos transversais ocupam o topo da hierarquia de evidências terapêuticas, por avaliarem grande número de pessoas.", "C": "Revisões sistemáticas de ensaios clínicos randomizados de boa qualidade ocupam o topo da hierarquia de evidências terapêuticas.", "D": "Estudos de caso-controle ocupam o topo da hierarquia de evidências terapêuticas, por permitirem estudar desfechos raros.", "E": "Relatos e séries de casos ocupam o topo da hierarquia de evidências terapêuticas, por descreverem pacientes reais."}, "gabarito": "C", "comentario_correta": "Para terapêutica, o maior nível de evidência é a revisão sistemática (com ou sem metanálise) de ECR homogêneos e de boa qualidade.", "por_que_cada_errada": {"A": "Opinião de especialista é o nível mais baixo.", "B": "Transversais não estabelecem temporalidade.", "C": "Esta é a alternativa a ser marcada.", "D": "Úteis para desfechos raros, mas abaixo de ECR e revisões.", "E": "Séries de casos têm baixo nível de evidência."}, "fundamento": "Oxford CEBM – níveis de evidência", "pegadinha": "Confundir tamanho amostral ou experiência com nível de evidência.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-038", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças dermatológicas", "subtema": "Dermatose ocupacional", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Auxiliar de enfermagem desenvolve eczema nas mãos que melhora nas férias e piora ao retornar; suspeita-se de alergia à borracha das luvas. Considerando a investigação de dermatoses ocupacionais, assinale a afirmativa CORRETA.", "alternativas": {"A": "A suspeita de dermatite de contato alérgica dispensa investigação, pois a profissão de saúde basta para o nexo.", "B": "A suspeita de dermatite de contato alérgica é confirmada pela biópsia, sendo o teste de contato contraindicado em trabalhadores.", "C": "A suspeita de dermatite de contato alérgica é investigada pelo teste de contato, e a melhora nas férias reforça o nexo.", "D": "A melhora nas férias afasta relação com o trabalho, pois dermatoses ocupacionais persistem mesmo sem exposição.", "E": "A suspeita de dermatite de contato irritativa é investigada pelo teste de contato, que é positivo na maioria desses casos."}, "gabarito": "C", "comentario_correta": "Na dermatite de contato alérgica ocupacional, o teste de contato identifica o alérgeno; a melhora com o afastamento e a piora no retorno reforçam o nexo.", "por_que_cada_errada": {"A": "A profissão não basta; o nexo exige investigação.", "B": "O teste de contato (patch test) é o exame de escolha para a alérgica.", "C": "Esta é a alternativa a ser marcada.", "D": "A melhora no afastamento sugere relação ocupacional.", "E": "O teste de contato investiga sensibilização alérgica; na irritativa é negativo."}, "fundamento": "Dermatoses ocupacionais – Ministério da Saúde", "pegadinha": "Troca irritativa × alérgica.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-039", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças neurológicas", "subtema": "Prognóstico funcional pós-AVC", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Servidor de 52 anos teve AVC isquêmico há dois meses, com hemiparesia leve, marcha independente e afasia de expressão em melhora com fonoterapia. Exerce função administrativa. Considerando o prognóstico funcional, assinale a afirmativa CORRETA.", "alternativas": {"A": "A recuperação neurológica é mais intensa nos primeiros meses, justificando incapacidade temporária com reavaliação.", "B": "A recuperação neurológica se encerra nas primeiras semanas, justificando a conclusão definitiva de incapacidade permanente.", "C": "A recuperação neurológica é imprevisível, impondo aposentadoria imediata a todo servidor com sequela de AVC.", "D": "A recuperação neurológica é irrelevante para a perícia, que deve concluir pela capacidade diante da marcha independente.", "E": "A recuperação neurológica depende apenas da extensão da lesão na imagem, dispensando a avaliação funcional atual."}, "gabarito": "A", "comentario_correta": "Após AVC, a recuperação é mais acentuada nos primeiros 3 a 6 meses; em fase de reabilitação ativa, a conclusão adequada costuma ser incapacidade temporária com reavaliação, considerando a função exercida.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "A maior parte da recuperação ocorre nos primeiros 3–6 meses; é cedo para concluir.", "C": "A conclusão depende da repercussão funcional e da evolução.", "D": "A afasia repercute em função administrativa; o prognóstico é central.", "E": "A avaliação funcional é indispensável."}, "fundamento": "Neurologia – prognóstico funcional pós-AVC", "pegadinha": "Conclusões definitivas precoces.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-040", "disciplina": "Perícia", "tema": "Avaliação pericial em doenças endócrinas e metabólicas", "subtema": "Diabetes e atividade de risco", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Motorista de ônibus com diabetes tipo 1 apresenta hipoglicemias graves recorrentes, com dois episódios de perda de consciência no último mês. Considerando a avaliação pericial da capacidade, assinale a afirmativa CORRETA.", "alternativas": {"A": "As hipoglicemias graves recorrentes geram incapacidade para a atividade de risco enquanto não houver controle.", "B": "O diagnóstico de diabetes tipo 1 é incompatível com a habilitação profissional, impondo cassação definitiva da CNH.", "C": "O diagnóstico de diabetes tipo 1 gera, por si só, incapacidade permanente para qualquer atividade profissional.", "D": "As hipoglicemias graves recorrentes geram incapacidade apenas para atividades administrativas, não para a direção.", "E": "As hipoglicemias graves recorrentes são irrelevantes para a perícia quando a hemoglobina glicada está dentro da meta."}, "gabarito": "A", "comentario_correta": "Na perícia, o que define incapacidade é o risco e a repercussão funcional (hipoglicemias graves recorrentes) frente às exigências da atividade, sobretudo atividades de risco a si e a terceiros.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "A aptidão é avaliada caso a caso.", "C": "O diagnóstico não define incapacidade.", "D": "O risco é maior justamente na direção profissional.", "E": "Hipoglicemia com perda de consciência é risco à atividade, mesmo com HbA1c na meta."}, "fundamento": "Perícia médica – endocrinopatias e atividades de risco", "pegadinha": "Diagnóstico como critério isolado.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-041", "disciplina": "Perícia", "tema": "Classificação Internacional de Doenças (CID-10/CID-11)", "subtema": "Estrutura da CID-10", "dificuldade": 1, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Na emissão de laudos periciais, o correto uso da CID-10 é essencial. Considerando a estrutura dos capítulos da CID-10, assinale a afirmativa CORRETA.", "alternativas": {"A": "Os transtornos mentais e comportamentais são codificados no capítulo V, com códigos iniciados pela letra F.", "B": "As doenças do aparelho respiratório são codificadas no capítulo X, com códigos iniciados pela letra R.", "C": "As doenças do aparelho circulatório são codificadas no capítulo IX, com códigos iniciados pela letra C.", "D": "Os transtornos mentais são codificados no capítulo VI, com códigos iniciados pela letra G.", "E": "As doenças do sistema osteomuscular são codificadas no capítulo XIII, com códigos iniciados pela letra S."}, "gabarito": "A", "comentario_correta": "CID-10: cap. V – F (transtornos mentais); VI – G (sistema nervoso); IX – I (circulatório); X – J (respiratório); XIII – M (osteomuscular); XIX – S/T (lesões).", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Respiratório usa a letra J; R são sintomas e sinais.", "C": "Circulatório usa a letra I; C corresponde a neoplasias malignas.", "D": "A letra G corresponde às doenças do sistema nervoso (capítulo VI).", "E": "Osteomusculares usam a letra M; S/T são lesões e envenenamentos."}, "fundamento": "OMS – CID-10", "pegadinha": "Letras vizinhas e confundíveis (F/G, M/S, I/C, J/R).", "prob_tema": 0.04, "verificar": false}, {"id": "POR-001", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Ideia principal", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": "T1", "enunciado": "Leia o texto 'O laudo que ninguém lê' para responder. Considerando a ideia central defendida pelo autor, assinale a afirmativa CORRETA.", "alternativas": {"A": "O texto sustenta que a clareza da escrita exige a eliminação de termos técnicos, pois o laudo se destina a leitores leigos.", "B": "O texto sustenta que o laudo pericial é documento essencialmente burocrático, destinado sobretudo ao arquivamento.", "C": "O texto sustenta que a clareza da escrita integra o ato pericial, pois o laudo orienta decisões sobre terceiros.", "D": "O texto sustenta que a responsabilidade pela compreensão do laudo cabe principalmente ao juiz e ao advogado.", "E": "O texto sustenta que a qualidade do exame clínico compensa eventuais falhas na redação do laudo pericial."}, "gabarito": "C", "comentario_correta": "A tese aparece no último parágrafo ('a escrita também é parte do ato pericial') e é preparada pela ideia de que o laudo orienta decisões que mudam vidas.", "por_que_cada_errada": {"A": "O 3º parágrafo diz que um laudo claro NÃO dispensa termos técnicos.", "B": "O texto afirma que o laudo 'carrega uma ambição maior' que o arquivamento.", "C": "Esta é a alternativa a ser marcada.", "D": "O texto atribui ao perito a responsabilidade pela clareza.", "E": "A última frase afirma o contrário."}, "fundamento": "Interpretação de texto – ideia principal", "pegadinha": "Distrator que absolutiza ('eliminação de termos técnicos').", "prob_tema": 0.4412, "verificar": false}, {"id": "POR-002", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Coesão – conectivo", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": "T1", "enunciado": "No trecho 'Escrever com clareza, contudo, não significa simplificar o que é complexo', do texto 'O laudo que ninguém lê', o conectivo destacado pode ser substituído, sem alteração de sentido, por:", "alternativas": {"A": "no entanto, pois o conectivo estabelece relação de oposição com o que foi dito.", "B": "portanto, pois o conectivo estabelece relação de conclusão com a ideia anterior.", "C": "assim, pois o conectivo estabelece relação de consequência com a ideia anterior.", "D": "além disso, pois o conectivo estabelece relação de adição com a ideia anterior.", "E": "porque, pois o conectivo es licam protocolos padronizados.", "B": "O território deve ser compreendido como produto de relações sociais, econômicas e culturais, não só como recorte.", "C": "O território deve ser compreendido a partir do cadastro das famílias, que esgota o conhecimento necessário à equipe.", "D": "O território deve ser compreendido pelos sistemas de informação, que antecipam o que os agentes comunitários percebem.", "E": "O território deve ser compreendido apenas como recorte geográfico, útil para distribuir responsabilidades entre equipes."}, "gabarito": "B", "comentario_correta": "O 2º parágrafo define território vivo como produto das relações sociais, econômicas e culturais.", "por_que_cada_errada": {"A": "O texto nega que o espaço seja cenário neutro.", "B": "Esta é a alternativa a ser marcada.", "C": "O 3º parágrafo afirma que conhecer o território não se resume a cadastrar famílias.", "D": "O texto afirma o oposto: o agente percebe antes do sistema.", "E": "O texto critica essa visão por ser insuficiente."}, "fundamento": "Interpretação de texto – ideia principal", "pegadinha": "Inversão do ponto de vista do autor.", "prob_tema": 0.4412, "verificar": false}, {"id": "POR-006", "disciplina": "Português", "tema": "Semântica", "subtema": "Sentido contextual", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": "T2", "enunciado": "No trecho 'compõem uma paisagem que a equipe de saúde precisa conhecer', do texto 'Território vivo', a palavra 'paisagem' é empregada em sentido:", "alternativas": {"A": "denotativo, referindo-se ao mapa físico elaborado pela equipe para delimitar as microáreas.", "B": "conotativo, referindo-se à beleza dos bairros visitados pelos agentes comunitários de saúde.", "C": "denotativo, referindo-se à vista natural observada pela equipe durante as visitas domiciliares.", "D": "conotativo, referindo-se ao conjunto de condições sociais que caracterizam o território.", "E": "técnico, referindo-se ao conceito de paisagem urbana adotado pelo planejamento municipal."}, "gabarito": "D", "comentario_correta": "'Paisagem' é usada em sentido figurado (conotativo) para designar o conjunto formado por saneamento, violência, distância da escola e oferta de trabalho.", "por_que_cada_errada": {"A": "O texto não se refere ao mapa físico.", "B": "O sentido não é estético.", "C": "No contexto, 'paisagem' não designa vista natural.", "D": "Esta é a alternativa a ser marcada.", "E": "Não há uso técnico do termo."}, "fundamento": "Semântica – denotação e conotação", "pegadinha": "Tomar o sentido figurado como literal.", "prob_tema": 0.0294, "verificar": false}, {"id": "POR-007", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Coesão – referência", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": "T2", "enunciado": "No trecho 'Nele, o espaço não é cenário neutro', do 2º parágrafo do texto 'Território vivo', o termo 'Nele' retoma:", "alternativas": {"A": "o conceito de território vivo, apresentado no período imediatamente anterior.", "B": "o sistema de informação, apresentado como fonte dos indicadores de saúde.", "C": "o quarteirão onde vivem as pessoas, mencionado ao final do primeiro parágrafo.", "D": "o mapa das equipes, mencionado como instrumento de distribuição de responsabilidades.", "E": "o recorte geográfico, apresentado no primeiro parágrafo como visão tradicional."}, "gabarito": "A", "comentario_correta": "'Nele' (em + ele) é elemento coesivo anafórico que retoma 'o conceito de território vivo'.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "O sistema de informação só aparece no 3º parágrafo.", "C": "Não retoma 'quarteirões'.", "D": "Não há referência a esse termo.", "E": "O antecedente imediato é 'O conceito de território vivo'."}, "fundamento": "Coesão textual – referenciação", "pegadinha": "Antecedentes plausíveis, mas distantes.", "prob_tema": 0.4412, "verificar": false}, {"id": "POR-008", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Pontuação", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": "T2", "enunciado": "Considere o trecho do texto 'Território vivo': 'Conhecer o território, entretanto, não se resume a cadastrar famílias.' Assinale a afirmativa CORRETA sobre a pontuação.", "alternativas": {"A": "As vírgulas são facultativas, podendo ser retiradas sem prejuízo à norma-padrão.", "B": "As vírgulas separam o sujeito do verbo, uso permitido sempre que o sujeito for oracional.", "C": "As vírgulas isolam um vocativo dirigido ao leitor do texto.", "D": "As vírgulas isolam um aposto explicativo que define o termo 'território'.", "E": "As vírgulas isolam a conjunção deslocada 'entretanto', sendo, por isso, obrigatórias."}, "gabarito": "E", "comentario_correta": "Conjunção coordenativa deslocada para o meio da oração ('entretanto', 'porém', 'contudo') deve ser isolada por vírgulas.", "por_que_cada_errada": {"A": "Conjunção intercalada deve vir entre vírgulas.", "B": "É vedado separar sujeito e verbo por uma única vírgula; aqui as vírgulas isolam a conjunção intercalada.", "C": "Não há vocativo.", "D": "'Entretanto' é conjunção, não aposto.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Gramática normativa – pontuação", "pegadinha": "Confundir conjunção intercalada com aposto ou separação sujeito/verbo.", "prob_tema": 0.3235, "verificar": false}, {"id": "POR-009", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Crase", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Assinale a alternativa em que o uso do acento indicativo de crase está de acordo com a norma-padrão.", "alternativas": {"A": "O perito referiu-se à um laudo anterior durante a audiência.", "B": "O perito referiu-se à conclusão do laudo durante a audiência.", "C": "O perito dirigiu-se à Vossa Excelência durante a audiência.", "D": "O perito começou à examinar o periciando na audiência.", "E": "O perito chegou à pé ao local da audiência."}, "gabarito": "B", "comentario_correta": "'Referir-se a' + 'a conclusão' (artigo feminino) = 'à conclusão'. Não há crase antes de verbo, de palavra masculina, de artigo indefinido e da maioria dos pronomes de tratamento.", "por_que_cada_errada": {"A": "Não há crase antes de artigo indefinido 'um'.", "B": "Esta é a alternativa a ser marcada.", "C": "Não há crase antes de pronome de tratamento (exceto senhora/senhorita/dona).", "D": "Não há crase antes de verbo.", "E": "Não há crase antes de palavra masculina."}, "fundamento": "Gramática normativa – crase", "pegadinha": "Casos clássicos de proibição de crase.", "prob_tema": 0.3235, "verificar": false}, {"id": "POR-010", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Regência verbal", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Assinale a alternativa em que a regência verbal está de acordo com a norma-padrão.", "alternativas": {"A": "A perita assistiu o vídeo da audiência antes de concluir o laudo.", "B": "A perita preferia mais revisar o laudo do que entregá-lo às pressas.", "C": "A perita assistiu ao vídeo da audiência antes de concluir o laudo.", "D": "A perita visava o cargo de coordenação desde o concurso.", "E": "A perita obedeceu o protocolo estabelecido pelo instituto."}, "gabarito": "C", "comentario_correta": "Assistir (ver) → assistir a; preferir algo a algo; obedecer a; visar (almejar) → visar a.", "por_que_cada_errada": {"A": "No sentido de ver, 'assistir' é transitivo indireto: 'assistiu ao'.", "B": "'Preferir' rege 'a', sem 'mais' e sem 'do que': preferia revisar a entregar.", "C": "Esta é a alternativa a ser marcada.", "D": "'Visar' no sentido de almejar rege 'a': visava ao cargo.", "E": "'Obedecer' é transitivo indireto: obedeceu ao protocolo."}, "fundamento": "Gramática normativa – regência verbal", "pegadinha": "Regências que divergem do uso coloquial.", "prob_tema": 0.3235, "verificar": false}, {"id": "POR-011", "disciplina": "Português", "tema": "Fonologia", "subtema": "Acentuação (Acordo Ortográfico)", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando as regras de acentuação gráfica vigentes após o Acordo Ortográfico, assinale a alternativa em que todas as palavras estão corretamente grafadas.", "alternativas": {"A": "idéia, heróico, vôo, crêem", "B": "idéia, heroico, vôo, creem", "C": "ideia, heróico, voo, creem", "D": "ideia, heroico, vôo, crêem", "E": "ideia, heroico, voo, creem"}, "gabarito": "E", "comentario_correta": "Pelo Acordo, perderam o acento os ditongos abertos 'ei' e 'oi' em paroxítonas (ideia, heroico) e os hiatos 'oo' e 'ee' (voo, creem).", "por_que_cada_errada": {"A": "Grafias anteriores ao Acordo; perderam o acento.", "B": "'Ideia' e 'voo' perderam o acento.", "C": "Paroxítona com ditongo aberto 'oi' perdeu o acento: heroico.", "D": "'Voo' e 'creem' perderam o acento.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Acordo Ortográfico de 1990 (vigente desde 2016)", "pegadinha": "Grafias antigas misturadas às novas.", "prob_tema": 0.1176, "verificar": false}, {"id": "POR-012", "disciplina": "Português", "tema": "Redação Oficial", "subtema": "Pronomes de tratamento e fecho", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "A perita municipal precisa encaminhar ofício ao Juiz de Direito da comarca. Considerando o Manual de Redação da Presidência da República (3ª ed.), assinale a afirmativa CORRETA.", "alternativas": {"A": "Deve usar o tratamento Vossa Excelência, com concordância na segunda pessoa do plural, e o fecho 'Cordialmente'.", "B": "Deve usar o tratamento Vossa Senhoria, com concordância na segunda pessoa, e o fecho 'Atenciosamente'.", "C": "Deve usar o tratamento Vossa Magnificência, com concordância na terceira pessoa, e o fecho 'Respeitosamente'.", "D": "Deve usar o tratamento Vossa Excelência, com concordância na terceira pessoa, e o fecho 'Respeitosamente'.", "E": "Deve usar o vocativo 'Digníssimo Senhor Juiz' e o fecho 'Atenciosamente', por ser autoridade de mesma hierarquia."}, "gabarito": "D", "comentario_correta": "O Manual prevê Vossa Excelência para juízes, com concordância em 3ª pessoa ('Vossa Excelência está'), e o fecho 'Respeitosamente' para autoridades de hierarquia superior; 'Atenciosamente' para mesma hierarquia ou inferior.", "por_que_cada_errada": {"A": "A concordância é em 3ª pessoa; 'Cordialmente' não é fecho previsto.", "B": "Juízes recebem Vossa Excelência; a concordância é em 3ª pessoa.", "C": "Vossa Magnificência é para reitores.", "D": "Esta é a alternativa a ser marcada.", "E": "'Digníssimo' foi abolido; o juiz é autoridade superior para fins de fecho."}, "fundamento": "Manual de Redação da Presidência da República, 3ª ed. (2018)", "pegadinha": "Troca de tratamento e de fecho.", "prob_tema": 0.0294, "verificar": true}, {"id": "POR-013", "disciplina": "Português", "tema": "Morfologia", "subtema": "Formação de palavras", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Assinale a alternativa em que a palavra foi formada por derivação parassintética.", "alternativas": {"A": "entardecer", "B": "planalto", "C": "combate", "D": "girassol", "E": "infelizmente"}, "gabarito": "A", "comentario_correta": "Na parassíntese, prefixo e sufixo entram simultaneamente: não existem 'entarde' nem 'tardecer'. Em 'infelizmente', existem as formas intermediárias.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Composição por aglutinação.", "C": "Derivação regressiva (de 'combater').", "D": "Composição por justaposição.", "E": "Derivação prefixal e sufixal (existe 'infeliz' e existe 'felizmente')."}, "fundamento": "Gramática normativa – formação de palavras", "pegadinha": "Confundir parassíntese com prefixação + sufixação.", "prob_tema": 0.0588, "verificar": false}, {"id": "SUS-001", "disciplina": "SUS", "tema": "CF/88 arts. 196 a 200", "subtema": "Art. 196 – saúde como direito", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Durante reunião do Conselho Municipal de Saúde, um conselheiro defendeu que, por ser a saúde um 'direito de todos', a obrigação do município se esgotaria na oferta de consultas e exames na rede própria. Considerando o art. 196 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "A saúde deve ser garantida com acesso universal, mas o acesso igualitário restringe-se aos usuários previamente cadastrados na atenção primária.", "B": "A saúde deve ser garantida exclusivamente pelo Estado, sendo vedada a participação da iniciativa privada na execução das ações e serviços.", "C": "A saúde deve ser garantida por políticas sociais e econômicas que reduzam o risco de doença e assegurem acesso universal e igualitário.", "D": "A saúde deve ser garantida prioritariamente pela oferta assistencial, cabendo às políticas econômicas papel apenas acessório e eventual no setor.", "E": "A saúde deve ser garantida por ações de recuperação, cabendo a promoção e a proteção exclusivamente à política de assistência social."}, "gabarito": "C", "comentario_correta": "Literalidade do art. 196: direito de todos e dever do Estado, garantido mediante políticas sociais e econômicas que visem à redução do risco de doença e de outros agravos e ao acesso universal e igualitário às ações e serviços para sua promoção, proteção e recuperação.", "por_que_cada_errada": {"A": "O acesso é universal e igualitário, sem restrição a cadastro prévio.", "B": "O art. 197 admite execução por terceiros e o art. 199 declara a assistência livre à iniciativa privada.", "C": "Esta é a alternativa a ser marcada.", "D": "O art. 196 coloca as políticas sociais E econômicas como meio de garantia do direito; não são acessórias.", "E": "O art. 196 abrange promoção, proteção e recuperação como finalidades das ações de saúde."}, "fundamento": "CF/88, art. 196", "pegadinha": "Distratores com 'prioritariamente', 'exclusivamente' e 'restringe-se' que reduzem o alcance do direito.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-002", "disciplina": "SUS", "tema": "CF/88 arts. 196 a 200", "subtema": "Art. 197 – relevância pública", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Um município contratou clínica privada para realizar exames de imagem para usuários do SUS. Um vereador sustentou que, sendo privada a executora, o serviço deixaria de se submeter ao controle do Poder Público. Considerando o art. 197 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "As ações e serviços de saúde são de relevância pública, cabendo ao Poder Público regulamentá-los, fiscalizá-los e controlá-los.", "B": "As ações e serviços de saúde passam a ser de interesse privado quando executados por terceiros, afastando a fiscalização do Poder Público.", "C": "As ações e serviços de saúde são de relevância pública, mas sua regulamentação compete apenas à União, vedada a atuação municipal.", "D": "As ações e serviços de saúde são de relevância pública somente quando prestados gratuitamente, dispensando-se o controle nos demais casos.", "E": "As ações e serviços de saúde são de relevância pública, razão pela qual sua execução deve ocorrer exclusivamente pela administração direta."}, "gabarito": "A", "comentario_correta": "O art. 197 declara as ações e serviços de saúde de relevância pública e admite execução direta ou por terceiros, mantendo com o Poder Público a regulamentação, a fiscalização e o controle.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "A relevância pública independe de quem executa; a fiscalização permanece.", "C": "O texto atribui ao 'Poder Público' a regulamentação, fiscalização e controle, nos termos da lei, sem exclusividade da União.", "D": "A relevância pública não depende de gratuidade.", "E": "O art. 197 permite execução diretamente ou através de terceiros, inclusive pessoa física ou jurídica de direito privado."}, "fundamento": "CF/88, art. 197", "pegadinha": "Confundir 'relevância pública' com 'execução exclusivamente pública'.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-003", "disciplina": "SUS", "tema": "CF/88 arts. 196 a 200", "subtema": "Art. 198 – diretrizes", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "As ações e serviços públicos de saúde integram uma rede regionalizada e hierarquizada e constituem um sistema único, organizado de acordo com diretrizes constitucionais. Considerando o art. 198 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "O SUS organiza-se com descentralização, mantendo direção compartilhada entre as esferas dentro de cada nível de governo.", "B": "O SUS organiza-se em rede centralizada e hierarquizada, com o comando operacional das ações exercido pela União.", "C": "O SUS organiza-se com participação da comunidade, de natureza apenas consultiva nas instâncias colegiadas de gestão.", "D": "O SUS organiza-se com atendimento integral, priorizando os serviços assistenciais em detrimento das atividades preventivas.", "E": "O SUS organiza-se com atendimento integral, priorizando atividades preventivas, sem prejuízo dos serviços assistenciais."}, "gabarito": "E", "comentario_correta": "Diretrizes do art. 198: I – descentralização, com direção única em cada esfera de governo; II – atendimento integral, com prioridade para as atividades preventivas, sem prejuízo dos serviços assistenciais; III – participação da comunidade.", "por_que_cada_errada": {"A": "A diretriz é descentralização com direção ÚNICA em cada esfera de governo.", "B": "A rede é regionalizada e o sistema é descentralizado.", "C": "A participação da comunidade é diretriz; os Conselhos têm caráter deliberativo (Lei 8.142/1990).", "D": "A prioridade constitucional é das atividades preventivas, sem prejuízo das assistenciais — a alternativa inverte.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "CF/88, art. 198, I a III", "pegadinha": "Inversão de prioridade (preventivo × assistencial) e troca de 'direção única' por 'compartilhada'.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-004", "disciplina": "SUS", "tema": "Financiamento", "subtema": "Mínimo constitucional municipal", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "O secretário de Finanças de Porto Calvo questiona qual é o percentual mínimo que o município deve aplicar anualmente em ações e serviços públicos de saúde. Considerando a CF/88 e a LC nº 141/2012, assinale a afirmativa CORRETA.", "alternativas": {"A": "O Município deve aplicar, no mínimo, 25% da arrecadação de impostos, percentual idêntico ao exigido para a manutenção do ensino.", "B": "O Município deve aplicar, no mínimo, 15% da arrecadação dos impostos próprios e das transferências constitucionais previstas na LC nº 141/2012.", "C": "O Município deve aplicar, no mínimo, 12% da arrecadação dos impostos próprios e das transferências previstas na LC nº 141/2012.", "D": "O Município deve aplicar, no mínimo, 15% da receita corrente líquida, mesma base de cálculo adotada para a União na Constituição.", "E": "O Município deve aplicar, no mínimo, 10% da arrecadação de impostos, podendo compensar o restante com recursos federais recebidos."}, "gabarito": "B", "comentario_correta": "Pela LC 141/2012 (art. 7º), os Municípios aplicam anualmente, no mínimo, 15% da arrecadação dos impostos do art. 156 e dos recursos dos arts. 158 e 159, I, 'b' e § 3º, da CF. Estados: 12%.", "por_que_cada_errada": {"A": "25% é o mínimo da educação (art. 212), não da saúde.", "B": "Esta é a alternativa a ser marcada.", "C": "12% é o mínimo dos Estados (e da parcela estadual do DF).", "D": "A base municipal é a arrecadação de impostos e transferências, não a receita corrente líquida.", "E": "Não há mínimo de 10% nem compensação com transferências federais vinculadas."}, "fundamento": "CF/88, art. 198, §§ 2º e 3º; LC 141/2012, arts. 6º e 7º", "pegadinha": "Trocar o percentual do município (15%) pelo do Estado (12%) ou pelo da educação (25%).", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-005", "disciplina": "SUS", "tema": "CF/88 arts. 196 a 200", "subtema": "Art. 199 – participação privada", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Um hospital privado com fins lucrativos pleiteou subvenção municipal para reformar sua UTI, comprometendo-se a atender pacientes do SUS. Considerando o art. 199 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "É permitida a participação direta de capital estrangeiro na assistência à saúde, independentemente de previsão em lei.", "B": "É vedada a destinação de recursos públicos para auxílios ou subvenções às instituições privadas com fins lucrativos.", "C": "É vedada a participação de entidades filantrópicas no SUS, uma vez que recebem recursos públicos sob a forma de isenção.", "D": "É permitida a subvenção a instituições privadas com fins lucrativos, desde que aprovada previamente pelo Conselho Municipal de Saúde.", "E": "É vedada a contratação de instituições privadas pelo SUS, admitindo-se somente convênios com entidades da administração pública."}, "gabarito": "B", "comentario_correta": "Art. 199: assistência livre à iniciativa privada; participação complementar mediante contrato de direito público ou convênio, com preferência para filantrópicas e sem fins lucrativos (§ 1º); vedada subvenção a instituições com fins lucrativos (§ 2º).", "por_que_cada_errada": {"A": "O § 3º veda, salvo nos casos previstos em lei.", "B": "Esta é a alternativa a ser marcada.", "C": "As filantrópicas têm PREFERÊNCIA na participação complementar (§ 1º).", "D": "A vedação do § 2º é absoluta; aprovação do Conselho não a afasta.", "E": "O § 1º admite participação complementar mediante contrato de direito público ou convênio."}, "fundamento": "CF/88, art. 199, §§ 1º a 3º", "pegadinha": "Condicionante falsa ('desde que aprovada pelo Conselho') legitimando uma vedação absoluta.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-006", "disciplina": "SUS", "tema": "CF/88 arts. 196 a 200", "subtema": "Art. 200 – competências do SUS", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "INCORRETA", "texto": null, "enunciado": "O art. 200 da Constituição Federal enumera atribuições do Sistema Único de Saúde, além de outras previstas em lei. Assinale a afirmativa INCORRETA.", "alternativas": {"A": "Compete ao SUS formular e executar com exclusividade a política de saneamento básico.", "B": "Compete ao SUS fiscalizar e inspecionar alimentos, compreendido o controle de seu teor nutricional.", "C": "Compete ao SUS colaborar na proteção do meio ambiente, nele compreendido o do trabalho.", "D": "Compete ao SUS ordenar a formação de recursos humanos na área de saúde.", "E": "Compete ao SUS executar as ações de vigilância sanitária e epidemiológica, bem como as de saúde do trabalhador."}, "gabarito": "A", "comentario_correta": "Quanto ao saneamento, o SUS 'participa da formulação da política e da execução das ações' (art. 200, IV) — não tem exclusividade.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Correta: art. 200, VI.", "C": "Correta: art. 200, VIII.", "D": "Correta: art. 200, III.", "E": "Correta: art. 200, II."}, "fundamento": "CF/88, art. 200, II, III, IV, VI e VIII", "pegadinha": "Troca de 'participar' por 'formular com exclusividade'.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-007", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Arts. 2º e 3º – determinantes e condicionantes", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Uma equipe de Saúde da Família observou aumento de doenças diarreicas em área sem rede de esgoto e com baixa renda familiar, e levou o caso à gestão municipal. Considerando os arts. 2º e 3º da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "Os níveis de saúde são responsabilidade apenas do Estado, o que exclui o dever das pessoas, da família, das empresas e da sociedade.", "B": "Os níveis de saúde expressam a organização social e econômica, tendo o saneamento e a renda entre seus condicionantes.", "C": "Os níveis de saúde dependem exclusivamente da oferta de serviços médicos, sendo o saneamento tema alheio às políticas de saúde.", "D": "Os níveis de saúde expressam a organização social, mas o trabalho e a renda não são reconhecidos como condicionantes pela lei.", "E": "Os níveis de saúde decorrem de fatores biológicos individuais, razão pela qual o dever do Estado dispensa ações intersetoriais."}, "gabarito": "B", "comentario_correta": "Art. 3º: os níveis de saúde expressam a organização social e econômica do País, tendo como determinantes e condicionantes, entre outros, alimentação, moradia, saneamento básico, meio ambiente, trabalho, renda, educação, atividade física, transporte, lazer e acesso aos bens e serviços essenciais.", "por_que_cada_errada": {"A": "O art. 2º, § 2º, diz que o dever do Estado NÃO exclui o das pessoas, da família, das empresas e da sociedade.", "B": "Esta é a alternativa a ser marcada.", "C": "O art. 3º lista expressamente o saneamento básico entre os determinantes e condicionantes.", "D": "Trabalho e renda constam expressamente do art. 3º.", "E": "A lei adota concepção ampliada de saúde, que exige ações intersetoriais."}, "fundamento": "Lei 8.080/1990, arts. 2º, § 2º, e 3º", "pegadinha": "Absolutos: 'exclusivamente', 'apenas', 'dispensa'.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-008", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Art. 4º – composição do SUS", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o conceito legal de Sistema Único de Saúde previsto no art. 4º da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "O SUS é constituído por ações e serviços de órgãos federais, cabendo aos entes subnacionais apenas a execução delegada.", "B": "O SUS é constituído por ações e serviços públicos, excluídas as fundações mantidas pelo Poder Público por terem personalidade própria.", "C": "O SUS é constituído por ações e serviços públicos, e a iniciativa privada poderá substituí-lo quando o custo for menor.", "D": "O SUS é constituído por ações e serviços públicos de saúde, e a iniciativa privada poderá participar dele em caráter complementar.", "E": "O SUS é constituído por ações e serviços públicos e privados, integrando a iniciativa privada o sistema em caráter obrigatório."}, "gabarito": "D", "comentario_correta": "Art. 4º: o SUS é o conjunto de ações e serviços de saúde prestados por órgãos e instituições públicas federais, estaduais e municipais, da administração direta e indireta e das fundações mantidas pelo Poder Público. § 2º: a iniciativa privada poderá participar em caráter complementar.", "por_que_cada_errada": {"A": "Integram o SUS órgãos e instituições federais, estaduais e municipais, da administração direta e indireta.", "B": "O art. 4º inclui expressamente as fundações mantidas pelo Poder Público.", "C": "A participação privada é complementar, não substitutiva.", "D": "Esta é a alternativa a ser marcada.", "E": "A participação privada é complementar e facultativa (§ 2º), não obrigatória."}, "fundamento": "Lei 8.080/1990, art. 4º, caput e § 2º", "pegadinha": "'Complementar' trocado por 'obrigatório' ou 'substitutivo'.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-009", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Art. 6º – vigilância sanitária", "dificuldade": 1, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Fiscais municipais inspecionaram uma padaria após denúncias de alimentos armazenados em condições inadequadas, apreendendo produtos vencidos. Considerando o art. 6º da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "Trata-se de ação de saúde do trabalhador, pois a inspeção recai sobre estabelecimento comercial que emprega pessoas.", "B": "Trata-se de vigilância sanitária, que busca eliminar, diminuir ou prevenir riscos da produção e circulação de bens.", "C": "Trata-se de vigilância epidemiológica, por envolver o controle de produtos e de serviços de interesse da saúde da população.", "D": "Trata-se de vigilância sanitária, cujo alcance se restringe aos serviços de saúde, excluídos os alimentos comercializados.", "E": "Trata-se de vigilância ambiental, atribuída com exclusividade ao órgão estadual de meio ambiente pela legislação do SUS."}, "gabarito": "B", "comentario_correta": "§ 1º do art. 6º: vigilância sanitária é o conjunto de ações capaz de eliminar, diminuir ou prevenir riscos à saúde e de intervir nos problemas sanitários decorrentes do meio ambiente, da produção e circulação de bens e da prestação de serviços de interesse da saúde.", "por_que_cada_errada": {"A": "O objeto da ação é o risco do produto ao consumidor, não a saúde dos empregados.", "B": "Esta é a alternativa a ser marcada.", "C": "Controle de bens e serviços de interesse da saúde é vigilância SANITÁRIA (§ 1º).", "D": "A vigilância sanitária abrange bens de consumo, incluindo alimentos.", "E": "Não há essa atribuição exclusiva; o caso é de vigilância sanitária."}, "fundamento": "Lei 8.080/1990, art. 6º, § 1º", "pegadinha": "Confusão entre vigilância sanitária e epidemiológica.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-010", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Art. 6º – vigilância epidemiológica", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Após aumento de notificações de dengue em dois bairros, a Secretaria Municipal de Saúde investigou os casos, mapeou fatores condicionantes e recomendou medidas de controle. Considerando o art. 6º da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "Trata-se de vigilância epidemiológica, cuja execução compete exclusivamente à União, cabendo ao município apenas notificar.", "B": "Trata-se de vigilância sanitária, que proporciona o conhecimento e a detecção de mudanças nos fatores condicionantes, para recomendar medidas de controle.", "C": "Trata-se de assistência terapêutica integral, uma vez que a investigação dos casos pressupõe o tratamento individual dos doentes.", "D": "Trata-se de vigilância epidemiológica, que detecta mudanças nos fatores condicionantes para recomendar medidas de controle.", "E": "Trata-se de vigilância epidemiológica, cuja finalidade se limita ao registro estatístico dos casos, sem recomendar medidas de controle."}, "gabarito": "D", "comentario_correta": "§ 2º do art. 6º: vigilância epidemiológica é o conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos.", "por_que_cada_errada": {"A": "O art. 18, IV, atribui à direção municipal executar serviços de vigilância epidemiológica.", "B": "A definição descrita é a do § 2º (epidemiológica), não a do § 1º (sanitária).", "C": "Investigação e recomendação de medidas coletivas configuram vigilância epidemiológica.", "D": "Esta é a alternativa a ser marcada.", "E": "A finalidade inclui recomendar e adotar medidas de prevenção e controle."}, "fundamento": "Lei 8.080/1990, art. 6º, § 2º; art. 18, IV", "pegadinha": "'Limita-se' e 'exclusivamente' + inversão de competência.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-011", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Art. 7º – integralidade", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Paciente diabético acompanhado na UBS foi encaminhado à oftalmologia por retinopatia, retornando à equipe de referência com plano de cuidado compartilhado. Considerando os princípios do art. 7º da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "A integralidade é entendida como garantia de acesso aos serviços em todos os níveis, independentemente de articulação ou continuidade.", "B": "A integralidade é entendida como conjunto articulado e contínuo de ações preventivas e curativas, individuais e coletivas.", "C": "A integralidade é entendida como acesso igualitário à assistência, sem preconceitos ou privilégios de qualquer espécie.", "D": "A integralidade é entendida como prioridade das ações curativas individuais, ficando as coletivas a cargo da vigilância em saúde.", "E": "A integralidade é entendida como oferta de todos os procedimentos em uma única unidade, dispensando a articulação entre os níveis de atenção."}, "gabarito": "B", "comentario_correta": "Art. 7º, II: integralidade de assistência, entendida como conjunto articulado e contínuo das ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade do sistema.", "por_que_cada_errada": {"A": "A definição legal exige conjunto articulado e contínuo.", "B": "Esta é a alternativa a ser marcada.", "C": "Esse é o princípio da igualdade da assistência (art. 7º, IV), não a integralidade.", "D": "A integralidade abrange ações preventivas e curativas, individuais e coletivas.", "E": "A lei fala em ações articuladas em todos os níveis de complexidade do sistema, não em unidade única."}, "fundamento": "Lei 8.080/1990, art. 7º, II", "pegadinha": "Troca de conceito vizinho: integralidade × igualdade × universalidade.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-012", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Art. 7º – descentralização", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "A Lei nº 8.080/1990 estabelece, entre os princípios do SUS, a descentralização político-administrativa. Assinale a afirmativa CORRETA sobre esse princípio.", "alternativas": {"A": "A descentralização ocorre com transferência integral de responsabilidades aos municípios, dispensando a regionalização e a hierarquização.", "B": "A descentralização ocorre apenas no plano financeiro, mantendo-se centralizadas na União as decisões sobre a organização dos serviços.", "C": "A descentralização ocorre com direção única em cada esfera de governo, com ênfase na descentralização dos serviços para os municípios.", "D": "A descentralização ocorre com direção compartilhada entre as esferas, cabendo à União a gestão direta dos serviços locais.", "E": "A descentralização ocorre com direção única em cada esfera de governo, com ênfase na concentração dos serviços nos estados."}, "gabarito": "C", "comentario_correta": "Art. 7º, IX: descentralização político-administrativa, com direção única em cada esfera de governo: a) ênfase na descentralização dos serviços para os municípios; b) regionalização e hierarquização da rede de serviços de saúde.", "por_que_cada_errada": {"A": "A alínea 'b' prevê expressamente regionalização e hierarquização da rede.", "B": "A descentralização é político-administrativa, não apenas financeira.", "C": "Esta é a alternativa a ser marcada.", "D": "A direção é única em cada esfera; a União não gere diretamente serviços locais.", "E": "A ênfase legal é nos MUNICÍPIOS (art. 7º, IX, 'a')."}, "fundamento": "Lei 8.080/1990, art. 7º, IX", "pegadinha": "Trocar município por estado; 'dispensando' a regionalização.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-013", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Art. 7º – epidemiologia para prioridades", "dificuldade": 2, "tipo_enunciado": "situacion

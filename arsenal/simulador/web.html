nça ou SSL (Secure Sockets Layer)?", "alternativas": {"A": "O site apresenta propagandas chamativas e descontos agressivos.", "B": "O site pode ser acessado por meio de um aplicativo de celular.", "C": "A URL do site começa com \"HTTPS\" e há um ícone de cadeado na barra de endereço.", "D": "A página inicial do site carrega rapidamente e tem bom design visual."}, "gabarito": "C", "verificar": false}, {"id": "R95-12", "real": true, "origem": "Japaratinga/AL 2025, questão 12", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Ao utilizar uma rede Wi-Fi pública, qual das ações abaixo é recomendada para garantir maior segurança ao realizar atividades que envolvam dados confidenciais?", "alternativas": {"A": "Utilizar normalmente a rede pública para acessar bancos e fazer compras, desde que o site tenha um cadeado na barra de endereços.", "B": "Conectar-se à rede pública e desativar temporariamente o antivírus para evitar interferências nas transações.", "C": "Acessar informações confidenciais apenas quando a conexão for lenta, pois isso indica menor risco de interceptação.", "D": "Utilizar uma VPN para proteger os dados transmitidos durante o uso da rede pública."}, "gabarito": "D", "verificar": false}, {"id": "R95-13", "real": true, "origem": "Japaratinga/AL 2025, questão 13", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Qual das afirmativas abaixo está correta sobre malware e vírus?", "alternativas": {"A": "Spyware e adware não são considerados tipos de malware.", "B": "Malware é um software intrusivo criado para causar danos e inclui vírus, spyware, adware e ransomware.", "C": "Vírus é um termo geral que inclui todos os tipos de malware.", "D": "Ransomware é um software seguro usado para proteger dados contra vírus."}, "gabarito": "B", "verificar": false}, {"id": "R95-14", "real": true, "origem": "Japaratinga/AL 2025, questão 14", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O que caracteriza um ataque de ransomware?", "alternativas": {"A": "É um tipo de vírus que apaga todos os arquivos automaticamente sem aviso.", "B": "É um sistema de backup que protege arquivos por meio de criptografia.", "C": "É um software de extorsão que bloqueia o computador ou arquivos e exige um pagamento para desbloqueá-los.", "D": "É um programa de segurança que bloqueia malwares e impede resgates financeiros."}, "gabarito": "C", "verificar": false}, {"id": "R95-15", "real": true, "origem": "Japaratinga/AL 2025, questão 15", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Utilização de planilhas eletrônicas", "dificuldade": 0, "comando": "INCORRETA", "texto": null, "enunciado": "No Microsoft Excel, diversas funções estatísticas são utilizadas para análise de dados. Qual das opções abaixo NÃO corresponde a uma função estatística?", "alternativas": {"A": "DESV.MÉDIO", "B": "MÉDIASE", "C": "CONCATENAR", "D": "CONT.NÚM"}, "gabarito": "C", "verificar": false}, {"id": "R95-16", "real": true, "origem": "Japaratinga/AL 2025, questão 16", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Utilização de planilhas eletrônicas", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "No Microsoft Excel, a função SOMA é usada para somar valores numéricos em células. Qual das alternativas apresenta a sintaxe correta dessa função?", "alternativas": {"A": "=SOMA(A1>A7)", "B": "=SOMA(A1/0)", "C": "=SOMA(A1:A7)", "D": "=SOMA(A1-A7)"}, "gabarito": "C", "verificar": false}, {"id": "R95-17", "real": true, "origem": "Japaratinga/AL 2025, questão 17", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Utilização de planilhas eletrônicas", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "No Microsoft Excel, qual das alternativas a seguir é adequada para destacar visualmente uma célula ou os dados dentro dela?", "alternativas": {"A": "Renomear o arquivo e incluir letras e números no nome do arquivo, sem mudar a extensão.", "B": "Colorir a célula e os seus dados com cores contrastantes (como texto vermelho e célula amarela).", "C": "Utilizar uma lista suspensa ou filtro para ordenar os dados em ordem alfabética.", "D": "Utilizar textos com menos de 144 caracteres em cada célula."}, "gabarito": "B", "verificar": false}, {"id": "R95-18", "real": true, "origem": "Japaratinga/AL 2025, questão 18", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Qual das alternativas abaixo descreve corretamente uma prática recomendada para a criação de senhas seguras no contexto da Internet?", "alternativas": {"A": "Criar uma senha longa, com pelo menos 12 caracteres, misturando letras maiúsculas, minúsculas, números e símbolos.", "B": "Usar a própria data de nascimento e o nome do animal de estimação, pois são informações fáceis de lembrar.", "C": "Optar por senhas curtas, de no máximo 6 caracteres, para evitar esquecimentos frequentes.", "D": "Utilizar sequências simples como \"123456\" ou padrões de teclado como \"qwerty\" para facilitar a memorização."}, "gabarito": "A", "verificar": false}, {"id": "R95-19", "real": true, "origem": "Japaratinga/AL 2025, questão 19", "disciplina": "Informática", "tema": "Aplicativos de escritório", "subtema": "Aplicativos de escri ivamente por exame laboratorial positivo para fator reumatoide.", "D": "Exames de imagem isolados são suficientes para confirmar a AR."}, "gabarito": "A", "verificar": false}, {"id": "R95-22", "real": true, "origem": "Japaratinga/AL 2025, questão 22", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Com relação às manifestações clínicas da leptospirose, assinale a alternativa mais correta e completa dentre as opções a seguir:", "alternativas": {"A": "É uma doença febril aguda, podendo variar de formas leves até quadros graves como a síndrome de Weil e hemorragia pulmonar.", "B": "É uma doença crônica e assintomática em humanos, sendo diagnosticada apenas por triagem sorológica.", "C": "Causa exclusivamente insuficiência renal, sem acometimento hepático ou pulmonar.", "D": "Inicia-se de forma insidiosa e progride lentamente até sintomas respiratórios graves."}, "gabarito": "A", "verificar": false}, {"id": "R95-23", "real": true, "origem": "Japaratinga/AL 2025, questão 23", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Com relação às características do diabetes mellitus, assinale a alternativa mais correta e completa:", "alternativas": {"A": "O diabetes afeta unicamente o pâncreas, não sendo considerada uma doença sistêmica.", "B": "O diabetes é uma doença exclusivamente endocrinológica, sem impacto significativo sobre outros órgãos.", "C": "O diabetes é caracterizado por hipoglicemia crônica e tem origem exclusivamente em distúrbios alimentares.", "D": "O diabetes resulta de processos patológicos diversos que causam hiperglicemia, afetando múltiplos órgãos e sistemas."}, "gabarito": "D", "verificar": false}, {"id": "R95-24", "real": true, "origem": "Japaratinga/AL 2025, questão 24", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Assinale a alternativa mais completa e correta sobre os testes rápidos (TR) utilizados na Atenção Primária à Saúde para diagnóstico de doenças sexualmente transmissíveis:", "alternativas": {"A": "Detectam exclusivamente anticorpos no sangue total.", "B": "Somente são indicados para diagnóstico de HIV e hepatite C.", "C": "Detectam apenas antígenos para indicar contato com o agente infeccioso.", "D": "Podem utilizar amostras de soro, plasma, sangue total ou fluido oral para detectar antígenos e/ou anticorpos."}, "gabarito": "D", "verificar": false}, {"id": "R95-25", "real": true, "origem": "Japaratinga/AL 2025, questão 25", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Qual a alternativa que descreve de forma mais completa os critérios do American College of Rheumatology (ACR) de 1987 para classificação da Artrite Reumatoide (AR)?", "alternativas": {"A": "Apenas presença de autoanticorpos e alterações radiográficas.", "B": "Presença de rigidez matinal e sintomas gastrointestinais.", "C": "Artrite unilateral, rigidez noturna e fator reumatoide negativo.", "D": "Rigidez matinal, artrite em três ou mais áreas articulares, artrite de mãos, artrites simétricas, nódulos reumatoides, fator reumatoide positivo e alterações radiográficas."}, "gabarito": "D", "verificar": false}, {"id": "R95-26", "real": true, "origem": "Japaratinga/AL 2025, questão 26", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Assinale a alternativa mais correta e completa sobre os objetivos da investigação clínico laboratorial do paciente hipertenso:", "alternativas": {"A": "Investigar fatores de risco cardiovasculares, lesões em órgãos alvo e causas associadas.", "B": " é sempre sintomática e de rápida evolução para casos graves.", "D": "A presença de febre baixa e constante é a principal característica da fase crítica."}, "gabarito": "B", "verificar": false}, {"id": "R95-34", "real": true, "origem": "Japaratinga/AL 2025, questão 34", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Sobre a tuberculose miliar, marque a opção mais correta e completa dentre as alternativas a seguir:", "alternativas": {"A": "Está restrita à forma primária da doença e ocorre principalmente em idosos saudáveis.", "B": "É uma forma leve da doença, sem importância clínica significativa.", "C": "Pode ocorrer tanto na forma primária quanto na secundária da TB, sendo mais comum em imunocomprometidos.", "D": "É causada por infecção viral associada à tuberculose e não afeta crianças."}, "gabarito": "C", "verificar": false}, {"id": "R95-35", "real": true, "origem": "Japaratinga/AL 2025, questão 35", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Com relação ao diagnóstico da Hipertensão Arterial Sistêmica (HAS), identifique e assinale a alternativa mais completa e correta:", "alternativas": {"A": "A aferição isolada da pressão arterial em consultório é suficiente para excluir o fenômeno da \"hipertensão do avental branco\".", "B": "A pressão arterial elevada em uma única aferição já é suficiente para classificar um indivíduo como hipertenso.", "C": "O diagnóstico de HAS deve considerar os níveis de pressão arterial e o risco cardiovascular global, com base em fatores de risco, lesões de órgãos alvo e comorbidades.", "D": "O diagnóstico pode ser confirmado com apenas uma aferição da pressão arterial em qualquer circunstância clínica."}, "gabarito": "C", "verificar": false}, {"id": "R95-36", "real": true, "origem": "Japaratinga/AL 2025, rnativas": {"A": "O servidor deve tratar cuidadosamente os usuários, buscando aprimorar a comunicação e o contato com o público.", "B": "A prioridade do servidor é a execução técnica do serviço, independentemente da qualidade da comunicação com o público.", "C": "O servidor deve restringir o contato com os usuários apenas aos canais oficiais de reclamação.", "D": "A interação com o público não é um dever ético, desde que o serviço seja prestado dentro do prazo legal."}, "gabarito": "A", "verificar": false}, {"id": "R95-39", "real": true, "origem": "Japaratinga/AL 2025, questão 39", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Gestão municipal do SUS", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "De acordo com o art. 18, inciso III, da Lei nº 8.080/1990, qual das alternativas abaixo descreve corretamente uma competência da direção municipal do SUS?", "alternativas": {"A": "Promover ações educativas apenas em unidades hospitalares privadas.", "B": "Elaborar políticas de gestão de pessoal nos hospitais estaduais.", "C": "Executar exclusivamente ações de vigilância sanitária no comércio local, sem envolvimento com o ambiente de trabalho.", "D": "Participar da execução, controle e avaliação das ações referentes às condições e aos ambientes de trabalho."}, "gabarito": "D", "verificar": false}, {"id": "R95-40", "real": true, "origem": "Japaratinga/AL 2025, questão 40", "disciplina": "SUS", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Qual das alternativas expressa corretamente o princípio da atenção humanizada no âmbito do SUS?", "alternativas": {"A": "A atenção humanizada permite reduzir o tempo de consulta, desde que aumente o número de atendimentos realizados.", "B": "A atenção humanizada consiste apenas na disponibilização de tecnologias médicas avançadas.", "C": "A atenção humanizada visa garantir que o atendimento respeite a dignidade, os valores e as necessidades dos usuários do sistema.", "D": "A atenção humanizada prioriza exclusivamente a eficiência dos procedimentos técnicos em saúde. RASCU NÃO DES UNHO STAQUE"}, "gabarito": "C", "verificar": false}], "textos": {"T1": "O laudo que ninguém lê\n\nHá documentos que nascem para ser arquivados. O laudo pericial, embora pareça pertencer a essa\nfamília, carrega uma ambição maior: traduzir um corpo em palavras capazes de orientar decisões que\nmudam vidas. Quando um perito conclui que alguém está incapaz para o trabalho, não descreve apenas\numa condição clínica; autoriza, em certa medida, um novo arranjo de existência.\n\nPor isso mesmo, causa estranheza que tantos laudos sejam escritos como se ninguém fosse lê-los.\nFrases truncadas, abreviaturas obscuras e conclusões sem fundamentação transformam o documento em\nenigma. O periciando não o compreende, o juiz hesita, o advogado o contesta. E o perito, que deveria\nser a voz técnica do processo, torna-se apenas mais um ruído.\n\nEscrever com clareza, contudo, não significa simplificar o que é complexo. Significa organizar o\nraciocínio de modo que o leitor percorra o mesmo caminho percorrido pelo autor: da história ao exame,\ndo exame à análise, da análise à conclusão. Um laudo claro não é aquele que dispensa termos técnicos,\nmas aquele que os explica quando necessário e os articula em uma argumentação verificável.\n\nTalvez o maior desafio esteja em reconhecer que a escrita também é parte do ato pericial. Não há\nexame bem feito que sobreviva a um texto mal construído.", "T2": "Território vivo\n\nDurante muito tempo, o território foi tratado pela saúde pública como simples recorte geográfico:\nlinhas traçadas no mapa para distribuir responsabilidades entre as equipes. Essa visão, embora útil\npara fins administrativos, revelou-se insuficiente para compreender por que pessoas que vivem a\npoucos quarteirões de distância adoecem e morrem de maneiras tão diferentes.\n\nO conceito de território vivo propõe outra leitura. Nele, o espaço não é cenário neutro, mas produto\ndas relações sociais, econômicas e culturais que ali se estabelecem. A ausência de saneamento, a\nviolência, a distância até a escola e a oferta de trabalho compõem uma paisagem que a equipe de saúde\nprecisa conhecer se quiser intervir de forma efetiva.\n\nConhecer o território, entretanto, não se resume a cadastrar famílias. Exige escuta, presença e\ndisposição para reconhecer saberes que não cabem nos formulários. O agente comunitário que conhece a\nhistória de cada rua frequentemente percebe antes do sistema de informação aquilo que os indicadores\nsó mostrarão meses depois.\n\nAssim, mapear deixa de ser tarefa burocrática e passa a ser exercício de cuidado."}, "matriz": [{"disciplina": "SUS", "tema": "Gestão municipal do SUS", "p_historico": 0.2667}, {"disciplina": "SUS", "tema": "Lei nº 8.080/1990", "p_historico": 0.2667}, {"disciplina": "SUS", "tema": "APS e ESF", "p_historico": 0.1333}, {"disciplina": "Português", "tema": "Interpretação e Análise Textual", "p_historico": 0.4412}, {"disciplina": "Português", "tema": "Sintaxe", "p_historico": 0.3235}, {"disciplina": "SUS", "tema": "CF/88 arts. 196 a 200", "p_historico": 0.0667}, {"disciplina": "SUS", "tema": "Controle social", "p_historico": 0.0667}, {"disciplina": "SUS", "tema": "Financiamento", "p_historico": 0.0667}, {"disciplina": "SUS", "tema": "Indicadores e monitoramento", "p_historico": 0.0667}, {"disciplina": "SUS", "tema": "Lei nº 8.142/1990", "p_historico": 0.0667}, {"disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "p_historico": 0.2564}, {"disciplina": "Português", "tema": "Fonologia", "p_historico": 0.1176}, {"disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "p_historico": 0.1795}, {"disciplina": "Constitucional", "tema": "Administração Pública na CF", "p_historico": 0.16}, {"disciplina": "Constitucional", "tema": "Direitos e garantias fundamentais", "p_historic /* ---------- utilidades ---------- */

function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

}

function fmtClock(ms) { ms = Math.max(0, ms); var h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3); return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); }

/* ---------- render de questão ---------- */

/* ---------- SIMULADO ---------- */
var SIM = null, timer = null;
function montarSimulado() {
  var qs = [];
  DISC.forEach(function (d) {
    var pool = INEDITAS.filter(function (q) { return q.disciplina === d[0]; });
    if (d[0] === "Português") { // mantém questões do mesmo texto juntas
      var grupos = {}; pool.forEach(function (q) { var k = q.texto || q.id; (grupos[k] = grupos[k] || []).push(q); });
      var sel = []; shuffle(Object.keys(grupos)).forEach(function (k) { if (sel.length + grupos[k].length <= d[1]) sel = sel.concat(grupos[k]); });
      qs = qs.concat(sel);
    } else qs = qs.concat(shuffle(pool).slice(0, d[1]));
  });
  return { qs: qs.map(function (q) { return q.id; }), resp: {}, i: 0, inicio: Date.now(), fim: Date.now() + 4 * 36e5, entregue: false, tq: {}, tIni: Date.now() };
}
function viewSimulado() {
  var app = $("#app");
  if (!SIM) {
    var last = S.sims.slice(-3).reverse();
    app.innerHTML = "<div class=\"sheet\"><h2>Simulado no formato da prova</h2><p>50 questões na proporção do edital (Português 10, Constitucional 5, Informática 5, Perícia 15, SUS 15), cronômetro de 4 horas e gabarito só no final. Pontuação: 1,1 por questão geral e 2,6 por específica. Eliminação abaixo de 70 pontos ou com zero em qualquer disciplina.</p>" +
      "<p class=\"muted\">Dica: faça no mesmo horário da prova, domingo às 14h.</p><div><button class=\"btn primary\" id=\"startSim\">Começar simulado</button></div></div>" +
      (last.length ? "<div class=\"sheet\"><h3>Últimos simulados</h3><div class=\"table-wrap\"><table><tr><th>Data</th><th class=\"num\">Pontos</th><th>Situação</th></tr>" + last.map(function (s) { return "<tr><td>" + new Date(s.t).toLocaleDateString("pt-BR") + "</td><td class=\"num\">" + s.total.toFixed(1) + "</td><td><span class=\"pill " + (s.aprov ? "ok\">Aprovada" : "bad\">Eliminada") + "</span></td></tr>"; }).join("") + "</table></div></div>" : "");
    $("#startSim").onclick = function () { SIM = montarSimulado(); viewSimulado(); };
    return;
  }
  if (SIM.entregue) return resultadoSim();
  var q = BY_ID[SIM.qs[SIM.i]];
  app.innerHTML = "<div class=\"bar\" style=\"justify-content:space-between\"><span class=\"clock\" id=\"clk\"></span><span class=\"muted\">" + Object.keys(SIM.resp).length + "/" + SIM.qs.length + " marcadas</span></div>" +
    "<div class=\"grid50\" id=\"g50\">" + SIM.qs.map(function (id, k) { return "<button class=\"" + (SIM.resp[id] ? "done" : "") + (k === SIM.i ? " cur" : "") + "\" data-k=\"" + k + "\" aria-label=\"Questão " + (k + 1) + "\">" + (k + 1) + "</button>"; }).join("") + "</div>" +
    "<div class=\"sheet\" id=\"qs\"><div class=\"muted\">Questão " + (SIM.i + 1) + "</div>" + qHTML(q) + "</div>" +
    "<div class=\"nav\"><button class=\"btn\" id=\"prev\"" + (SIM.i ? "" : " disabled") + ">Anterior</button><button class=\"btn\" id=\"entregar\">Entregar</button><button class=\"btn primary\" id=\"nx\"" + (SIM.i < SIM.qs.length - 1 ? "" : " disabled") + ">Próxima</button></div><div id=\"cf\"></div>";
  var cur = SIM.resp[q.id]; if (cur) $("#qs .alt[data-l=\"" + cur + "\"]").classList.add("sel");
  SIM.tIni = Date.now();
  function leave() { SIM.tq[q.id] = (SIM.tq[q.id] || 0) + (Date.now() - SIM.tIni); }
  $("#qs").querySelectorAll(".alt").forEach(function (b) { b.onclick = function () { SIM.resp[q.id] = b.dataset.l; $("#qs").querySelectorAll(".alt").forEach(function (x) { x.classList.toggle("sel", x === b); }); $("#g50 [data-k=\"" + SIM.i + "\"]").classList.add("done"); }; });
  $("#g50").querySelectorAll("button").forEach(function (b) { b.onclick = function () { leave(); SIM.i = +b.dataset.k; viewSimulado(); }; });
  $("#prev").onclick = function () { leave(); SIM.i--; viewSimulado(); };
  $("#nx").onclick = function () { leave(); SIM.i++; viewSimulado(); window.scrollTo(0, 0); };
  $("#entregar").onclick = function () {
    var falt = SIM.qs.length - Object.keys(SIM.resp).length;
    $("#cf").innerHTML = "<div class=\"confirm\">" + (falt ? falt + " questão(ões) em branco. " : "") + "Entregar o simulado agora? <button class=\"btn primary\" id=\"sim\">Entregar</button><button class=\"btn\" id=\"nao\">Continuar</button></div>";
    $("#sim").onclick = function () { leave(); entregar(); }; $("#nao").onclick = function () { $("#cf").innerHTML = ""; };

}
function tick() {
  clearInterval(timer);
  timer = setInterval(function () {
    if (!SIM || SIM.entregue) return clearInterval(timer);
    var el = $("#clk"); var rest = SIM.fim - Date.now();
    if (el) el.textContent = "⏱ " + fmtClock(rest);
    if (rest <= 0) entregar();
  }, 1000);
  var el = $("#clk"); if (el) el.textContent = "⏱ " + fmtClock(SIM.fim - Date.now());
}
function pontuar(qs, resp) {
  var por = {}; DISC.forEach(function (d) { por[d[0]] = { ac: 0, n: 0, pts: 0 }; });
  qs.forEach(function (id) { var q = BY_ID[id], p = por[q.disciplina]; p.n++; if (resp[id] === q.gabarito) { p.ac++; p.pts += DISC_INFO[q.disciplina].peso; } });
  var total = 0, zero = false; Object.keys(por).forEach(function (k) { total += por[k].pts; if (por[k].n && por[k].ac === 0) zero = true; });
  return { por: por, total: total, aprov: total >= 70 && !zero, zero: zero };
}
function entregar() {
  SIM.entregue = true; clearInterval(timer);
  SIM.qs.forEach(function (id) { record(id, SIM.resp[id] === BY_ID[id].gabarito, SIM.tq[id] || 0, "simulado"); });
  var r = pontuar(SIM.qs, SIM.resp);
  S.sims.push({ t: Date.now(), total: r.total, aprov: r.aprov, por: r.por, dur: Date.now() - SIM.inicio }); save();
  resultadoSim();
}

    "<div class=\"table-wrap\"><table><tr><th>Disciplina</th><th class=\"num\">Acertos</th><th class=\"num\">Pontos</th></tr>" +
    DISC.map(function (d) { var p = r.por[d[0]]; return "<tr><td>" + d[0] + "</td><td class=\"num\">" + p.ac + "/" + p.n + "</td><td class=\"num\">" + p.pts.toFixed(1) + "</td></tr>"; }).join("") +

    "<div class=\"bar\"><button class=\"btn primary\" id=\"novo\">Novo simulado</button></div></div><h3>Correção comentada</h3>";
  SIM.qs.forEach(function (id, k) { h += "<div class=\"sheet\" id=\"r" + k + "\"><div class=\"muted\">Questão " + (k + 1) + "</div>" + qHTML(BY_ID[id]) + "</div>"; });

}

/* ---------- PAINEL ---------- */

    var r = S.resp[q.id]; if (!r) return;
    r.forEach(function (x) {
      var d = disc[q.disciplina] = disc[q.disciplina] || { ac: 0, n: 0 }; d.n++; if (x.ok) d.ac++;
      var k = q.disciplina + "|" + q.tema, t = tema[k] = tema[k] || { ac: 0, n: 0 }; t.n++; if (x.ok) t.ac++;
      if (x.ms > 0 && x.ms < 30 * 6e4) { ms += x.ms; nms++; }
    });
  });
  return { disc: disc, tema: tema, tm: nms ? ms / nms : NaN };
}

    return { d: m.disciplina, t: m.tema, p: m.p_historico * d.n * d.peso * (1 - taxa), taxa: taxa, n: s ? s.n : 0 };

    "<div class=\"sheet\"><h3>Onde você mais perde ponto</h3><p class=\"muted\">Prioridade = chance do tema cair × questões × peso × (1 − seu acerto). Enquanto não houver provas IGEDUC coletadas, a chance é igual entre os temas de cada disciplina.</p><div class=\"table-wrap\"><table><tr><th>Tema</th><th>Disciplina</th><th class=\"num\">Acerto</th><th class=\"num\">Prior.</th></tr>" +

    $("#next").disabled = false;
  }; });
  $("#chR").onchange = function () { CH_REAIS = this.checked; CH = null; viewChute(); };
  $("#next").onclick = function () { CH = null; viewChute(); };
}

/* ---------- PROGRESSO (exportar / importar) ---------- */
function viewDados() {
  var json = JSON.stringify(S);
  $("#app").innerHTML = "<div class=\"sheet\"><h2>Levar o progresso para outro aparelho</h2><p>O progresso fica salvo neste navegador. Para continuar no celular ou no computador, copie o código abaixo e cole no outro aparelho, na mesma tela.</p>" +
    "<textarea id=\"exp\" readonly aria-label=\"Progresso exportado\">" + esc(json) + "</textarea><div class=\"bar\"><button class=\"btn primary\" id=\"copy\">Copiar progresso</button><span class=\"muted\" id=\"cmsg\"></span></div></div>" +
    "<div class=\"sheet\"><h3>Importar progresso</h3><p class=\"muted\">Cole o código copiado do outro aparelho ou escolha o arquivo progresso.json. As respostas são somadas às deste aparelho.</p><textarea id=\"imp\" aria-label=\"Colar progresso\"></textarea><input type=\"file\" id=\"impFile\" accept=\".json,application/json\" aria-label=\"Arquivo de progresso\"><div class=\"bar\"><button class=\"btn primary\" id=\"doImp\">Importar</button><span class=\"muted\" id=\"imsg\"></span></div></div>" +
    "<div class=\"sheet\"><h3>Zerar progresso</h3><div id=\"zr\"><button class=\"btn\" id=\"zerar\">Apagar tudo deste aparelho</button></div></div>";
  $("#copy").onclick = function () {
    var ta = $("#exp");
    try { navigator.clipboard.writeText(json).then(function () { $("#cmsg").textContent = "Copiado."; }, function () { ta.select(); $("#cmsg").textContent = "Selecionado: use Ctrl+C."; }); }
    catch (e) { ta.select(); $("#cmsg").textContent = "Selecionado: use Ctrl+C."; }
  };
  $("#impFile").onchange = function () { var f = this.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function () { $("#imp").value = rd.result; }; rd.readAsText(f); };
  $("#doImp").onclick = function () {
    try {
      var o = JSON.parse($("#imp").value);
      Object.keys(o.resp || {}).forEach(function (id) { var a = S.resp[id] = S.resp[id] || []; var ts = a.map(function (x) { return x.t; }); o.resp[id].forEach(function (x) { if (ts.indexOf(x.t) < 0) a.push(x); }); });
      Object.keys(o.srs || {}).forEach(function (id) { if (!S.srs[id]) S.srs[id] = o.srs[id]; });
      (o.sims || []).forEach(function (s) { if (!S.sims.some(function (x) { return x.t === s.t; })) S.sims.push(s); });
      S.chute = S.chute.concat(o.chute || []);
      save(); badge(); $("#imsg").textContent = "Importado.";
    } catch (e) { $("#imsg").textContent = "Código inválido: cole o texto completo copiado do outro aparelho."; }
  };
  $("#zerar").onclick = function () {
    $("#zr").innerHTML = "<div class=\"confirm\">Isto apaga respostas, revisões e simulados deste aparelho. <button class=\"btn primary\" id=\"zsim\">Apagar</button><button class=\"btn\" id=\"znao\">Cancelar</button></div>";
    $("#zsim").onclick = function () { S = blank(); save(); badge(); viewDados(); };
    $("#znao").onclick = viewDados;
  };
}

/* ---------- abas ---------- */
var VIEWS = { treino: viewTreino, simulado: viewSimulado, revisao: viewRevisao, painel: viewPainel, chute: viewChute, dados: viewDados };
function go(tab) {
  document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"); });
  VIEWS[tab](); window.scrollTo(0, 0);
}
document.querySelectorAll("#tabs button").forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
countdown(); badge();
var h = (location.hash || "").replace("#", "");
go(VIEWS[h] ? h : "treino");
})();
</script>

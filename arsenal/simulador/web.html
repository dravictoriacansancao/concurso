Inserir uma Tabela Dinâmica e escolher a opção \"Realçar valores maiores que a média\" nas configurações de campo.", "C": "Aplicar Formatação Condicional com uma nova regra do tipo \"Fórmula\", usando a expressão =C2> MÉDIA($C$2:$C$51)", "D": "Criar uma fórmula =MÉDIA(C2:C51)>C2 dentro de cada célula para alterar a cor das que estiverem acima da média."}, "gabarito": "C", "verificar": false}, {"id": "R114-18", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 18", "disciplina": "Informática", "tema": "Conceitos sobre redes sociais e ferramentas colaborativas", "subtema": "Conceitos sobre redes sociais e ferramentas colaborativas", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O uso das redes sociais tem ampliado o debate sobre privacidade e controle de informações pessoais. Usuários frequentemente compartilham dados sensíveis sem perceber o alcance público das postagens, enquanto plataformas digitais utilizam algoritmos para monitorar e armazenar comportamentos. Sobre as práticas de segurança e proteção de dados pessoais em ambientes de redes sociais, analise as afirmativas abaixo: I. Ajustar as configurações de privacidade permite restringir quem pode visualizar publicações, marcadores de fotos e informações pessoais, reduzindo a exposição indevida. II. A exclusão de uma conta de rede social elimina de forma imediata e definitiva todos os dados já armazenados nos servidores da plataforma. III. Evitar o compartilhamento de informações pessoais, como localização em tempo real e dados de documentos, é uma medida de prevenção contra golpes e fraudes digitais. IV. O aceite automático de solicitações de amizade ou conexões não representa risco à privacidade, uma vez que a filtragem de segurança é feita pela própria rede social. Assinale a alternativa correta:", "alternativas": {"A": "Apenas as afirmativas I e III são verdadeiras.", "B": "Apenas as afirmativas I, II e III são verdadeiras.", "C": "As afirmativas I, II, III e IV são verdadeiras.", "D": "Apenas as afirmativas III e IV são verdadeiras."}, "gabarito": "A", "verificar": false}, {"id": "R114-19", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 19", "disciplina": "Informática", "tema": "Ferramentas de backup e recuperação de dados", "subtema": "Ferramentas de backup e recuperação de dados", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A função PONTO DE RESTAURAÇÃO do sistema operacional Windows é um recurso associado à estabilidade e à recuperação do ambiente em situações de falha. Esse mecanismo atua criando registros que permitem reverter o estado do sistema a um momento anterior, preservando a integridade do sistema operacional e dos aplicativos. Sobre funcionamento e as características dos pontos de restauração, assinale a alternativa correta:", "alternativas": {"A": "O ponto de restauração apaga automaticamente todos os arquivos pessoais do usuário criados após a data de sua geração, garantindo que o sistema volte ao estado exato anterior, sem resíduos de dados.", "B": "A restauração do sistema permite reverter alterações em configurações e drivers instalados, sem afetar os arquivos pessoais do usuário, sendo útil principalmente após atualizações problemáticas.", "C": "O recurso de ponto de restauração substitui integralmente a necessidade de backups regulares, pois mantém cópias automáticas de todos os conteúdos do disco rígido em intervalos predefinidos.", "D": "Ao ser ativado, o ponto de restauração realiza uma cópia completa de todos os arquivos do sistema e de dados, incluindo documentos, imagens e vídeos, com o objetivo de uma recuperação total do computador."}, "gabarito": "B", "verificar": false}, {"id": "R114-20", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 20", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Utilização de planilhas eletrônicas", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "Analise as afirmativas a seguir sobre as funções de cálculo condicional do Microsoft Excel e assinale V (verdadeiro) ou F (falso): (__) A função SE permite definir uma condição lógica e retornar um valor caso ela seja verdadeira e outro se for falsa, sendo possível aninhar várias funções SE dentro de uma mesma fórmula. (__) A função SOMASES realiza a soma de valores com base em um único critério, enquanto SOMASE permite múltiplos critérios em colunas diferentes. (__) A função CONT.SE serve para contar quantas células atendem a um critério específico, mas não diferencia letras maiúsculas de minúsculas. (__) A função MÉDIASE devolve a média apenas dos valores que atendem a uma condição, funcionando de forma semelhante à SOMASE, mas aplicando o cálculo de média em vez da soma. (__) A função SEERRO é utilizada para substituir mensagens de erro como #DIV/0! ou #N/D por outro texto definido pelo usuário, o que ajuda a tornar relatórios mais limpos e compreensíveis. Assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "F, F, F, V, V", "B": "F, F, V, V, F", "C": "V, F, V, V, V", "D": "V, F, F, V, F CONHECIMENTOS ESPECÍFICOS"}, "gabarito": "C", "verificar": false}, {"id": "R114-21", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 21", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "afirmativas I-II-III", "texto": null, "enunciado": "A artrite reumatoide é uma doença inflamatória crônica autoimune que afeta principalmente articulações sinoviais, podendo levar a deformidades, perda funcional e aumento do risco cardiovascular. Considerando esse tema, analise as afirmativas a seguir. I. O início precoce de terapias modificadoras de doença (DMARDs), tipicamente incluindo Metotrexato como base, melhora os resultados estruturais e funcionais. II. O alvo terapêutico (treat-to-target) na AR é alcançar remissão ou pelo menos atividade mínima de doença, com monitorização frequente e ajuste de tratamento se o alvo não for atingido em 3 a 6 meses. III. O risco cardiovascular aumentado em pacientes com artrite reumatoide deve ser avaliado com os mesmos algoritmos utilizados na população geral, porém com ajustes específicos (como a aplicação de multiplicador e a consideração do estado inflamatório crônico), uma vez que a doença cursa com inflamação sistêmica relevante para a aterosclerose. Assinale a alternativa que apresenta as proposições CORRETAS.", "alternativas": {"A": "I e III.", "B": "I e II.", "C": "I, II e III.", "D": "II."}, "gabarito": "C", "verificar": false}, {"id": "R114-22", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 22", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "As Diretrizes da American Diabetes Association (ADA) de 2025 introduziram atualizações importantes no manejo do diabetes tipo 2, incluindo o uso de tecnologias, terapias farmacológicas e estratégias centradas na pessoa. Acerca do assunto, registre V, para as afirmativas verdadeiras, e F, para as falsas: (__) No tratamento de diabetes tipo 2 com sobrepeso, as diretrizes de 2025 priorizam o uso de agonistas do apenas para pacientes com função renal reduzida ou doença cardiovascular estabelecida; caso contrário, deve-se optar inicialmente apenas por metformina. (__) As diretrizes de 2025 recomendam considerar o uso de monitorização contínua da glicose (CGM) em pacientes com diabetes tipo 2 que não utilizam insulina, como ferramenta de apoio à decisão terapêutica. (__) Em pacientes com diabetes tipo 2 estáveis e sem complicações, o acompanhamento sorológico de função renal (eGFR/albuminúria) não foi modificado nas diretrizes de 2025, sendo necessário apenas uma avaliação inicial e após três anos se os resultados normais forem mantidos. (__) As diretrizes de 2025 enfatizam a linguagem centrada na pessoa (\"person-first\") e recomendam evitar termos como \"diabético\", bem como considerar determinantes sociais da saúde no planejamento terapêutico. Após análise, assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "F, V, F, V.", "B": "V, V, V, V.", "C": "V, F, F, F.", "D": "F, F, V, V."}, "gabarito": "A", "verificar": false}, {"id": "R114-23", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 23", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Um trabalhador de saneamento apresenta febre, calafrios, mialgias intensas, principalmente na região da panturrilha, e dor de cabeça difusa após contato com água de enchentes em área urbana. Durante a avaliação clínica, são considerados fatores de risco ambientais, hábitos de higiene e sinais laboratoriais sugestivos de leptospirose. Com base nesse contexto, analise as afirmativas a seguir sobre a doença e assinale a alternativa correta.", "alternativas": {"A": "O diagnóstico definitivo da leptospirose depende da análise clínica, sem necessidade de exames laboratoriais.", "B": "O uso de antibióticos não tem papel no manejo da leptospirose, sendo apenas medida de suporte clínico suficiente.", "C": "A fase imunológica da leptospirose geralmente ocorre após a primeira semana de sintomas e pode ser confirmada pela detecção de anticorpos específicos ou teste sorológico.", "D": "A transmissão ocorre principalmente por ingestão de alimentos contaminados com secreções de roedores, sendo raro o contato cutâneo com água ou solo contaminado."}, "gabarito": "C", "verificar": false}, {"id": "R114-24", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 24", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Um paciente de 52 anos, residente em área endêmica, apresenta histórico de disfagia progressiva para sólidos e líquidos, associada a episódios de constipação e sensação de plenitude abdominal. Ele relata antecedentes de febre baixa na infância, sem acompanhamento médico na época. Durante a avaliação, considera-se a suspeita de complicações digestivas crônicas da doença de Chagas. Com base nesse cenário, analise as afirmativas a seguir e assinale a alternativa correta.", "alternativas": {"A": "A presença de anticorpos anti-Trypanosoma cruzi é irrelevante na investigação de complicações digestivas crônicas, não contribuindo para o diagnóstico.", "B": "A cirurgia para correção do megaesôfago, como esofagectomia ou cardiomiotomia de Heller, é indicada apenas após a falha do tratamento antiparasitário.", "C": "O diagnóstico do megaesôfago pode ser auxiliado por exames de imagem, como esofagograma contrastado, que revela dilatação e aperistaltismo esofágico.", "D": "O megaesôfago chagásico ocorre devido à infecção aguda, sendo raro na fase crônica da doença."}, "gabarito": "C", "verificar": false}, {"id": "R114-25", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 25", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "afirmativas I-II-III", "texto": null, "enunciado": "A coqueluche é uma infecção respiratória altamente contagiosa causada pela Bordetella pertussis, com implicações para prevenção, diagnóstico e tratamento em diferentes faixas etárias. Sobre essa doença, analise as afirmativas a seguir. I. A vacinação materna com a vacina contendo pertussis (Tdap) em cada gestação, preferencialmente entre as 27 e 36 semanas de gestação, é recomendada para reduzir a transmissão ao recém-nascido. II. A imunidade conferida por vacina ou infecção natural contra coqueluche não é vitalícia, exigindo reforços após a adolescência, inclusive em adultos saudáveis. III. O tratamento com azitromicina nas primeiras três semanas de tosse pode reduzir a transmissão da coqueluche, mesmo que os sintomas já tenham se iniciado, sendo indicado também como pós-exposição para contatos próximos. profilaxia Assinale a alternativa que apresenta as proposições corretas.", "alternativas": {"A": "I e III.", "B": "I.", "C": "I, II e III.", "D": "II."}, "gabarito": "A", "verificar": false}, {"id": "R114-26", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 26", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "Os acidentes de trabalho com exposição a material biológico representam risco potencial de transmissão de HIV, HBV e HCV aos profissionais de saúde. Acerca do assunto, registre V, para as afirmativas verdadeiras, e F, para as falsas: (__) Há profilaxia medicamentosa eficaz indicada para o vírus da hepatite C, devendo ser iniciada imediatamente após o acidente. (__) A profilaxia pós-exposição ao HIV deve ser iniciada, preferencialmente, nas primeiras duas horas após o acidente, podendo ser considerada até 72 horas após a exposição. (__) O acompanhamento sorológico para HIV deve ser encerrado após três meses, visto que a soroconversão ocorre geralmente nesse período. (__) O local da exposição deve ser higienizado imediatamente com água e sabão, sendo contraindicado o uso de substâncias cáusticas ou irritantes. Após análise, assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "F, V, F, V.", "B": "F, F, V, F.", "C": "V, F, F, V.", "D": "F, V, V, F."}, "gabarito": "A", "verificar": false}, {"id": "R114-27", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 27", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A esquistossomose mansoni é uma parasitose endêmica em diversas regiões do Brasil e permanece como importante problema de saúde pública, podendo causar manifestações clínicas agudas e crônicas, alterações hepatoesplênicas e complicações graves quando não tratada adequadamente. O diagnóstico envolve avaliação clínica, exames laboratoriais e imagem, e a intervenção precoce é fundamental para prevenção de sequelas. Com base nesse contexto, analise as afirmativas a seguir e assinale a alternativa verdadeira.", "alternativas": {"A": "A transmissão ocorre por ingestão de água contaminada com ovos do Schistosoma mansoni, não havendo penetração ativa das cercárias pela pele.", "B": "A fibrose periportal característica da esquistossomose ocorre na fase aguda da infecção, sendo detectável geralmente nas primeiras semanas após o contato com água contaminada.", "C": "O tratamento de escolha para todos os pacientes infectados é a administração de albendazol em dose única.", "D": "O contato com água doce contendo cercárias liberadas por caramujos do gênero Biomphalaria é a via principal de infecção, e o uso de praziquantel ajustado ao peso corporal é recomendado para tratamento conforme diretrizes nacionais."}, "gabarito": "D", "verificar": false}, {"id": "R114-28", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 28", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "Leptospirose é uma zoonose bacteriana de importância em saúde pública, associada a infecções agudas que podem evoluir para formas graves com comprometimento multissistêmico. Acerca do assunto, registre V, para as afirmativas verdadeiras, e F, para as falsas: (__) A síndrome clássica da leptospirose grave (síndrome de Weil) caracteriza-se por icterícia intensa, insuficiência renal e hemorragias, e pode evoluir com letalidade elevada se não tratada. (__) O tratamento antibiótico deve aguardar confirmação laboratorial por sorologia ou PCR, para evitar o uso desnecessário de antibióticos em casos leves. (__) A profilaxia com doxiciclina para contatos após exposição a água de enchente é uma estratégia respaldada rotineiramente em áreas de surto segundo diretrizes oficiais brasileiras. (__) A presença de conjuntivas hiperêmicas ou sufusão conjuntival, associada a mialgia de panturrilha, eleva a suspeita clínica de leptospirose e justifica iniciar coleta laboratorial e tratamento imediato. Após análise, assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "V, F, F, F.", "B": "F, F, V, V.", "C": "V, V, V, V.", "D": "V, F, F, V."}, "gabarito": "D", "verificar": false}, {"id": "R114-30", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 30", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Um paciente de 34 anos chega ao pronto-socorro relatando visão turva, dificuldade para engolir e sensação de fraqueza muscular progressiva nas extremidades superiores. Ele menciona que consumiu recentemente conservas caseiras de vegetais. Considerando o quadro clínico e a suspeita de botulismo alimentar, avalie as afirmativas a seguir e assinale a alternativa correta.", "alternativas": {"A": "O início dos sintomas de botulismo geralmente ocorre semanas após a ingestão do alimento contaminado.", "B": "A paralisia observada no botulismo é resultado da ação da toxina botulínica que bloqueia a liberação de acetilcolina nas sinapses neuromusculares.", "C": "O botulismo alimentar é causado por intoxicação direta das bactérias Clostridium botulinum presentes no trato gastrointestinal.", "D": "O tratamento envolve antibióticos, que são suficientes para reverter imediatamente a paralisia."}, "gabarito": "B", "verificar": false}, {"id": "R114-31", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 31", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "A sífilis continua sendo uma infecção sexualmente transmissível com repercussões importantes para saúde pública e obstétrica, exigindo manejo clínico oportuno e adequado. Acerca do assunto, registre V, para as afirmativas verdadeiras, e F, para as falsas: (__) Nos casos de grávidas alérgicas à penicilina, pode-se adotar como alternativa segura à penicilina benzatinica um curso oral de Doxiciclina, 100 mg duas vezes ao dia por 14 dias. (__) O tratamento de primeira linha para sífilis primária ou secundária em adultos saudáveis é a administração de Penicilina G benzatina 2,4 milhões UI intramuscular em dose única. (__) O rastreio de sífilis em gestantes é conduzido apenas no primeiro trimestre, não sendo necessária repetição em trimestres subsequentes salvo indicação específica. (__) Em casos de sífilis latente de duração desconhecida ou terciária sem neurossífilis, recomenda-se esquema com penicilina benzatinica 2,4 milhões UI intramuscular em dose semanal por três semanas consecutivas. Após análise, assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "V, F, F, F.", "B": "V, V, V, V.", "C": "F, F, V, V.", "D": "F, V, F, V."}, "gabarito": "D", "verificar": false}, {"id": "R114-32", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 32", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O abdome agudo é uma emergência médica que representa um desafio diagnóstico frequente, envolvendo diversas etiologias que podem afetar órgãos gastrointestinais, geniturinários e vasculares. O manejo adequado depende da avaliação detalhada do paciente, história clínica, exame físico e exames complementares, permitindo decisões que vão desde conduta conservadora até intervenção cirúrgica emergencial. Considerando essas informações, analise as afirmativas abaixo e assinale a correta.", "alternativas": {"A": "A avaliação clínica detalhada, associada à história do paciente e exames complementares, é fundamental para orientar condutas cirúrgicas ou conservadoras no abdome agudo.", "B": "O exame de imagem não tem papel relevante no diagnóstico do abdome agudo, sendo o diagnóstico puramente clínico e laboratorial.", "C": "A presença de dor abdominal difusa intensa associada a febre baixa geralmente indica hemorragia intra-abdominal, sendo a laparotomia imediata sempre indicada.", "D": "A apendicite aguda raramente se apresenta com sinais localizados no quadrante inferior direito, sendo geralmente difusa."}, "gabarito": "A", "verificar": false}, {"id": "R114-33", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 33", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O sarampo é uma doença viral altamente contagiosa, causada pelo vírus do sarampo, com transmissão predominantemente respiratória. Apesar da disponibilidade de vacina segura e eficaz, surtos ainda ocorrem em populações não vacinadas ou com cobertura vacinal insuficiente, podendo resultar em complicações graves, incluindo pneumonia, encefalite e desnutrição. Considerando o contexto clínico, epidemiológico e preventivo do sarampo, analise as afirmativas a seguir e assinale a alternativa verdadeira.", "alternativas": {"A": "O diagnóstico laboratorial definitivo é realizado pela detecção de anticorpos IgM específicos ou RNA viral, sendo a coleta de sangue ou secreção respiratória indicada para confirmação.", "B": "O sarampo é transmitido por contato com superfícies contaminadas, não havendo risco de transmissão aérea entre indivíduos susceptíveis.", "C": "A imunidade conferida pela vacinação contra o sarampo é temporária, sendo necessária a revacinação a cada 3 anos para manter a proteção.", "D": "A fase de exantema no sarampo geralmente ocorre antes do aparecimento de febre e sintomas respiratórios, servindo como marcador precoce da doença."}, "gabarito": "A", "verificar": false}, {"id": "R114-34", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 34", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "afirmativas I-II-III", "texto": null, "enunciado": "A Doença de Creutzfeldt-Jakob (DCJ) é uma encefalopatia esporádica, genética ou adquirida, caracterizada por rápida deterioração neurológica e alterações cognitivas progressivas. Considerando esse assunto, analise as afirmativas a seguir. I. O exame de eletroencefalograma (EEG) na Doença de Creutzfeldt-Jakob (DCJ) esporádica frequentemente revela complexos periódicos de ondas agudas e lentas, sendo um achado diagnóstico clássico em estágios avançados da doença. II. A ressonância magnética, em inglês magnetic resonance imaging (MRI), com sequências de difusão geralmente mostra hipersinal nos núcleos da base e córtex cerebral, sendo útil para o diagnóstico precoce da Doença de Creutzfeldt-Jakob (DCJ). III. A proteína 14-3-3 detectada no líquor cerebroespinal é específica para a Doença de Creutzfeldt-Jakob (DCJ), podendo confirmar o diagnóstico em qualquer contexto clínico. Assinale a alternativa que apresenta as proposições CORRETAS.", "alternativas": {"A": "I e II.", "B": "I e III.", "C": "II.", "D": "I, II e III."}, "gabarito": "A", "verificar": false}, {"id": "R114-35", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 35", "disciplina": "Clínica (outro cargo)", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "A chikungunya é uma arbovirose transmitida por mosquitos que pode apresentar manifestações agudas e persistentes, exigindo controle clínico e epidemiológico rigoroso. Acerca do assunto, registre V, para as afirmativas verdadeiras, e F, para as falsas: (__) O tratamento específico antivírico para chikungunya está disponível e deve ser iniciado nos primeiros três dias de sintomas para reduzir a persistência articular. (__) A profilaxia individual consiste em vacinação universal em todas as regiões endêmicas, sendo esta o método principal de controle da doença. (__) Em casos de suspeita de chikungunya, até que a dengue seja excluída, deve-se evitar o uso de paracetamol para febre e dor articular, dando preferência desde o início aos anti-inflamatórios não esteroidais. (__) A eliminação de criadouros de mosquitos e o controle vetorial integrado são estratégias centrais reconhecidas nas diretrizes internacionais para prevenir surtos de chikungunya. Após análise, assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "V, V, V, V.", "B": "F, F, F, V.", "C": "V, F, F, F.", "D": "F, F, V, V."}, "gabarito": "B", "verificar": false}, {"id": "R114-36", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 36", "disciplina": "SUS", "tema": "APS e ESF", "subtema": "APS e ESF", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "O Núcleo de Apoio à Saúde da Família (NASF) tem como objetivo oferecer suporte técnico e interdisciplinar às equipes de Saúde da Família (SF), promovendo a integração das ações de cuidado, participação social e construção de projetos terapêuticos singulares, além de favorecer a articulação intersetorial para a melhoria da atenção à saúde no território. Acerca do assunto, registre V, para as afirmativas verdadeiras, e F, para as falsas: (__) O NASF deve atuar na execução de procedimentos específicos de saúde, sem participação nas decisões estratégicas das equipes de SF ou do território. (__) O Projeto Terapêutico Singular (PTS) é uma ferramenta do NASF que permite a construção coletiva de condutas terapêuticas para indivíduos, grupos ou famílias, a partir da discussão interdisciplinar de casos complexos. (__) A Pactuação do Apoio é um processo isolado realizado no início da implantação do NASF, sem necessidade de revisão ou atualização ao longo do tempo, uma vez definidos os profissionais e metas iniciais. (__) A Clínica Ampliada preconiza a atuação do NASF considerando a singularidade de cada situação e a construção compartilhada dos diagnósticos e intervenções, ampliando o objeto de trabalho além da visão restrita de cada profissão. Após análise, assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "V, F, F, V.", "B": "F, F, V, F.", "C": "F, V, F, V.", "D": "F, V, V, F."}, "gabarito": "C", "verificar": false}, {"id": "R114-37", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 37", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Gestão municipal do SUS", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "O atendimento em serviços de saúde envolve a organização e execução de ações que garantam acesso, qualidade e humanização do cuidado, contemplando protocolos clínicos, fluxos administrativos e comunicação efetiva com os usuários, bem como o monitoramento de resultados e avaliação contínua da prática assistencial. Acerca do assunto, registre V, para as afirmativas verdadeiras, e F, para as falsas: (__) O atendimento centrado no paciente deve priorizar os protocolos clínicos, dispensando a individualização das necessidades e preferências do usuário. (__) A organização do fluxo assistencial e dos processos internos não influencia a efetividade do atendimento, sendo relevante apenas a competência técnica dos profissionais. (__) A avaliação contínua do serviço de saúde deve restringir-se à aferição de indicadores administrativos, sem considerar desfechos clínicos, satisfação do usuário ou impacto na saúde da população. (__) A humanização do atendimento inclui ações de acolhimento, escuta ativa, garantia de direitos do usuário e integração com estratégias de participação social. Após análise, assinale a alternativa que apresenta a sequência correta dos itens acima, de cima para baixo:", "alternativas": {"A": "F, F, F, V.", "B": "V, F, F, F.", "C": "V, V, V, V.", "D": "F, F, V, V."}, "gabarito": "A", "verificar": false}, {"id": "R114-38", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 38", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Lei nº 8.080/1990", "dificuldade": 0, "comando": "afirmativas I-II-III", "texto": null, "enunciado": "O Sistema Único de Saúde (SUS) organiza-se de forma descentralizada e hierarquizada, com competências compartilhadas entre a União, os Estados, o Distrito Federal e os Municípios, abrangendo desde a formulação de políticas de saúde até a execução e avaliação de ações e serviços. Considerando as atribuições comuns e competências da direção nacional do SUS, analise as afirmativas a seguir. I. Compete à direção nacional do SUS coordenar e participar da execução das ações de vigilância epidemiológica, além de estabelecer normas e executar a vigilância sanitária de portos, aeroportos e fronteiras, garantindo proteção à saúde pública. II. Entre as atribuições comuns das diferentes esferas de governo estão a administração dos recursos financeiros destinados à saúde, a elaboração de normas técnicas e padrões de qualidade, bem como a participação na formulação e execução de políticas de saneamento básico e proteção ambiental. III. A direção nacional do SUS é responsável por formular, avaliar e apoiar políticas de alimentação e nutrição, definir sistemas de redes integradas de assistência de alta complexidade e coordenar o Sistema Nacional de Sangue, Componentes e Derivados, promovendo articulação com estados e municípios. Assinale a alternativa que apresenta as proposições CORRETAS.", "alternativas": {"A": "I e II.", "B": "II.", "C": "I e III.", "D": "I, II e III."}, "gabarito": "C", "verificar": false}, {"id": "R114-39", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 39", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Gestão municipal do SUS", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Em um município da região Sudeste, a secretaria de saúde implementou um projeto piloto de educação permanente voltado à qualificação de equipes da Atenção Primária. Paralelamente, o município passou a participar de um Laboratório de Inovação, compartilhando experiências e ferramentas para avaliar a eficácia de novas práticas educativas e aprimorar os fluxos de trabalho dos serviços de saúde. Considerando os objetivos e métodos utilizados pelos Laboratórios de Inovação no contexto do SUS, assinale a alternativa correta sobre a integração de ações de educação permanente e inovação.", "alternativas": {"A": "Os Laboratórios de Inovação buscam identificar práticas que possam trazer benefícios concretos e mensuráveis para profissionais, grupos ou organizações, utilizando metodologias como estudos de caso, ciclos de debate e intercâmbio técnico.", "B": "A participação nos Laboratórios de Inovação exige que todas as experiências sejam previamente aprovadas pelo Ministério da Saúde, sendo proibida a análise de casos experimentais locais.", "C": "A inovação em saúde, dentro do SUS, se restringe à criação de tecnologias e produtos farmacêuticos, sem envolvimento de processos organizacionais, práticas ou políticas públicas.", "D": "As ações de educação permanente em saúde devem ser avaliadas apenas com base em indicadores financeiros, sem considerar o impacto sobre os profissionais ou na melhoria dos serviços prestados à população."}, "gabarito": "A", "verificar": false}, {"id": "R114-40", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 40", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Lei nº 8.080/1990", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O Sistema Único de Saúde (SUS) organiza-se a partir de princípios e diretrizes que orientam sua estrutura e funcionamento, incluindo a universalidade, integralidade e equidade, além das diretrizes de descentralização, regionalização e hierarquização e participação da comunidade. Considerando o arcabouço legal e operacional do SUS, analise as afirmativas a seguir e assinale a alternativa correta.", "alternativas": {"A": "A participação da comunidade no SUS se limita à representação em conselhos municipais de saúde, sendo dispensável em conferências estaduais ou nacionais, pois estas não têm poder deliberativo.", "B": "A regionalização e hierarquização visam organizar a rede de serviços por nível de complexidade e território, promovendo fluxos de referência e contrarreferência, assegurando que serviços especializados estejam disponíveis de forma organizada.", "C": "A diretriz da descentralização do SUS permite que cada município organize sua rede de serviços de forma independente, sem necessidade de pactos ou articulação com os estados ou com a União.", "D": "A integralidade no SUS significa que todos os serviços devem ser prestados sem diferenciação, sem considerar as necessidades epidemiológicas ou socioeconômicas da população."}, "gabarito": "B", "verificar": false}, {"id": "R142-01", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 1", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Considerando a regência do verbo \"prever\" no enunciado apresentado, analise o comportamento sintático do verbo e o valor da oração que o complementa, levando em conta sua transitividade e sua relação com o conteúdo semântico expresso, e assinale a alternativa CORRETA.", "alternativas": {"A": "O verbo \"prever\" apresenta comportamento intransitivo ao projetar sentido completo sem necessidade de complemento, funcionando a oração subsequente como segmento acessório que amplia o escopo informativo.", "B": "O verbo \"prever\" é empregado como transitivo indireto ao exigir complemento oracional iniciado por elemento correlativo, o que resulta em construção dependente de preposição elíptica na organização frasal.", "C": "O verbo \"prever\" manifesta valor predicativo ao retomar conteúdo da oração seguinte, de modo que a estrutura posterior atua como predicativo oracional do sujeito implícito do enunciado.", "D": "O verbo \"prever\" atua como transitivo direto ao introduzir complemento oracional desenvolvido por conjunção integrante, estabelecendo relação de objeto direto com a estrutura que expressa o conteúdo previsto."}, "gabarito": "D", "verificar": false}, {"id": "R142-02", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 2", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Considerando os mecanismos de coesão e coerência empregados no texto, observe a forma como as ideias são articuladas, a progressão lógica estabelecida entre as partes e o modo como os conectores organizam o encadeamento argumentativo, e assinale a alternativa CORRETA.", "alternativas": {"A": "A coesão textual é assegurada pela presença recorrente de marcadores formais explícitos, que organizam rigidamente as relações entre frases, dispensando conexões implícitas próprias do discurso expositivo.", "B": "A coerência interna se estabelece pela equivalência semântica entre todos os parágrafos, que retomam integralmente as mesmas ideias sem ampliação conceitual, evitando construção de avanço argumentativo.", "C": "A manutenção do sentido global depende predominantemente de repetições lexicais próximas, que substituem relações lógicas e tornam a progressão argumentativa independente de nexos conceituais desenvolvidos.", "D": "O texto apresenta continuidade temática ao articular causas e consequências por meio de conectores implícitos, mantendo unidade global coerente com o propósito de discutir desafios da convivência com diferenças."}, "gabarito": "D", "verificar": false}, {"id": "R142-03", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 3", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Considerando a tipologia e o gênero textual que caracterizam o texto apresentado, analise a forma de organização discursiva, a finalidade comunicativa predominante e os recursos linguísticos mobilizados pelo autor na construção do sentido, e assinale a alternativa CORRETA.", "alternativas": {"A": "O texto apresenta predominância expositivo-argumentativa, própria de gêneros reflexivos, organizando ideias de modo progressivo para discutir a convivência com diferenças e provocar reflexão sobre o comportamento humano.", "B": "A construção textual corresponde a sequência essencialmente narrativa, estruturada por ações encadeadas no tempo e por personagens definidos, enfatizando eventos sucessivos que conduzem à conclusão central.", "C": "A tipologia utilizada se caracteriza pelo predomínio da injunção, visto que o autor orienta procedimentos práticos e apresenta instruções diretas para superar conflitos decorrentes da diversidade social.", "D": "O gênero textual evidencia natureza descritiva ao concentrar-se na enumeração de características fixas e na apresentação estática de elementos sociais sem desenvolvimento argumentativo."}, "gabarito": "A", "verificar": false}, {"id": "R142-04", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 4", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Com base no funcionamento sintático e semântico do período \"Topar de cara com realidades e ideologias diferentes da sua é algo estranho para qualquer pessoa\", analise a estrutura da oração, a relação entre seus termos e o valor atribuído ao predicado em torno da expressão \"é algo estranho\", considerando o comportamento verbal e nominal do enunciado, e assinale a alternativa CORRETA.", "alternativas": {"A": "O segmento apresenta caráter impessoal, pois o verbo \"é\" desenvolve sentido autônomo, formando estrutura sem sujeito e permitindo interpretação independente do conteúdo que segue ao longo do enunciado.", "B": "O enunciado apresenta estrutura de predicação nominal com verbo de ligação, atribuindo ao sujeito oracional o predicativo \"algo estranho\", o que configura relação estável entre experiência descrita e juízo avaliativo implícito.", "C": "O período constrói predicação verbal ao indicar ação plenamente definida, na qual o verbo central expressa movimento concreto, dispensando complementos que caracterizem natureza avaliativa do enunciado.", "D": "O trecho estabelece construção transitiva direta, visto que \"é\" atua como verbo pleno e seleciona objeto que complementa seu sentido, produzindo associação entre ação inicial e termo que finaliza a unidade sintática."}, "gabarito": "B", "verificar": false}, {"id": "R142-05", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 5", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Considerando os mecanismos de pontuação empregados no trecho \"O que vale a pena quando o seu grupo entra em choque com outro grupo? Brigar, discutir, partir para a agressão − isso é fácil\", especialmente o uso do ponto de interrogação, da vírgula e do travessão, identifique a interpretação que melhor corresponde às funções sintáticas e discursivas desses sinais no contexto argumentativo apresentado, e assinale a alternativa CORRETA.", "alternativas": {"A": "O ponto de interrogação funciona como marca de dúvida efetiva, enquanto as vírgulas assinalam enumeração com valor explicativo e o travessão introduz detalhamento informativo que amplia o conteúdo sem manifestar posicionamento.", "B": "O ponto de interrogação encerra pergunta direta ao contexto narrativo, as vírgulas indicam interrupção de fluidez sintática e o travessão introduz construção que substitui conectivos concessivos utilizados para opor ideias distintas.", "C": "A pontuação organiza a progressão argumentativa ao empregar o ponto de interrogação para instaurar questionamento retórico, as vírgulas para separar ações coordenadas e o travessão para destacar comentário avaliativo que reforça a conclusão do autor.", "D": "A interrogação estabelece consulta aberta ao leitor, as vírgulas demarcam termos acessórios de natureza circunstancial e o travessão opera como fronteira entre partes independentes que não mantêm vínculo de sentido imediato."}, "gabarito": "C", "verificar": false}, {"id": "R142-07", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 7", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Com base na interpretação do texto apresentado, que discute a convivência com realidades divergentes e o impacto das diferenças na formação humana, identifique a ideia que melhor sintetiza a orientação central desenvolvida pelo autor e a relação entre diversidade, conflito e crescimento pessoal, e assinale a alternativa CORRETA.", "alternativas": {"A": "Os estranhamentos gerados pelas diferenças aparecem como obstáculo persistente à sociabilidade, sugerindo que relações pacíficas dependem do compartilhamento amplo de práticas semelhantes no cotidiano.", "B": "As divergências entre grupos são expostas como fenômenos resultantes principalmente de afastamentos culturais, indicando que a vida coletiva tende à instabilidade quando não há alinhamento pleno de valores.", "C": "As emoções provocadas pelo encontro com o diferente são tratadas como impedimento estruturante da convivência social, ressaltando que a disparidade de experiências dificulta qualquer possibilidade de aproximação.", "D": "A diversidade é apresentada como fator que desperta tensões inevitáveis, mas também como elemento que favorece o amadurecimento humano ao exigir reflexão constante sobre modos distintos de existência."}, "gabarito": "D", "verificar": false}, {"id": "R142-08", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 8", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Considerando a colocação pronominal que ocorre na forma \"defendê-los\" em \"[...] e que ele vai defendê-los, assim como você defende os seus\", observe o valor morfológico do pronome oblíquo, os fatores que condicionam sua posição em relação ao verbo e a justificação normativa para o emprego da ênclise após verbo no infinitivo, e assinale a alternativa CORRETA.", "alternativas": {"A": "A forma utilizada caracteriza mesóclise facultativa, justificando a posição medial do pronome em razão da presença do futuro sintético, que desloca o pronome para o interior do verbo.", "B": "O pronome \"-los\" liga-se ao verbo por ênclise, permitida pelo uso do infinitivo \"defender\", formando \"defendê-los\", construção normativa que expressa complemento direto plural referente aos elementos mencionados.", "C": "O emprego do pronome exige próclise obrigatória, uma vez que verbos no infinitivo devem sempre receber pronome antes de sua forma verbal, razão pela qual a estrutura apresentada contraria prescrição padrão.", "D": "O pronome assume função de objeto indireto e sua colocação resulta da presença do conectivo \"que\", que força a antecipação pronominal mesmo diante de formas verbais não flexionadas. NOÇÕES DA CONSTITUIÇÃO FEDERAL DE 1988"}, "gabarito": "B", "verificar": false}, {"id": "R142-09", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 9", "disciplina": "Constitucional", "tema": "Organização dos Poderes", "subtema": "Organização dos Poderes", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "A Constituição Federal estabelece competências privativas do Presidente da República no exercício da Chefia do Poder Executivo federal, delimitando suas atribuições normativas e institucionais. Com base exclusivamente no texto constitucional, analise as afirmativas abaixo e preencha as lacunas utilizando \"V\", para as verdadeiras, e \"F\", para as falsas: (__) Compete privativamente ao Presidente da República sancionar, promulgar e fazer publicar as leis, bem como expedir decretos e regulamentos para sua fiel execução. (__) A edição de medidas provisórias pode ser delegada a Ministro de Estado, mediante ato formal do Presidente da República. (__) A sanção presidencial é requisito de validade das emendas constitucionais aprovadas pelo Congresso Nacional. Assinale a alternativa que apresenta a sequência CORRETA, de cima para baixo:", "alternativas": {"A": "V, F, F.", "B": "F, V, F.", "C": "F, F, V.", "D": "V, V, F."}, "gabarito": "A", "verificar": false}, {"id": "R142-10", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 10", "disciplina": "Constitucional", "tema": "Administração Pública na CF", "subtema": "Administração Pública na CF", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A Constituição estabelece princípios estruturantes e regras específicas aplicáveis à Administração Pública direta e indireta, vinculando todos os entes federativos e Poderes constituídos. Considerando exclusivamente os arts. 37 a 41 da Constituição, assinale a alternativa CORRETA.", "alternativas": {"A": "A acumulação remunerada de cargos públicos é admitida sempre que houver compatibilidade de horários, independentemente das hipóteses expressamente previstas na Constituição.", "B": "A administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios da legalidade, impessoalidade, moralidade, publicidade e eficiência.", "C": "A contratação por tempo determinado para atender a necessidade temporária de excepcional interesse público independe de previsão legal específica.", "D": "A estabilidade no serviço público é adquirida após dois anos de efetivo exercício, dispensada avaliação especial de desempenho por comissão instituída para essa finalidade."}, "gabarito": "B", "verificar": false}, {"id": "R142-11", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 11", "disciplina": "Constitucional", "tema": "Direitos e garantias fundamentais", "subtema": "Direitos e garantias fundamentais", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A Constituição disciplina critérios objetivos para aquisição da nacionalidade brasileira, distinguindo hipóteses originárias e derivadas. Considerando exclusivamente o texto constitucional, assinale a alternativa CORRETA.", "alternativas": {"A": "O brasileiro naturalizado pode ocupar qualquer cargo privativo de brasileiro nato previsto expressamente na Constituição.", "B": "A nacionalidade brasileira pode ser livremente renunciada sem qualquer consequência jurídica posterior quanto à condição de brasileiro.", "C": "São brasileiros natos os nascidos na República Federativa do Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país.", "D": "São brasileiros naturalizados todos os estrangeiros residentes no Brasil há mais de cinco anos, independentemente de qualquer outro requisito constitucional."}, "gabarito": "C", "verificar": false}, {"id": "R142-12", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 12", "disciplina": "Constitucional", "tema": "Direitos e garantias fundamentais", "subtema": "Direitos e garantias fundamentais", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Os direitos sociais integram o núcleo de proteção constitucional voltado à promoção da justiça social e à redução das desigualdades estruturais. Considerando exclusivamente o texto constitucional, assinale a alternativa CORRETA.", "alternativas": {"A": "São direitos sociais a educação, a saúde, o trabalho, a moradia, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância e a assistência aos desamparados.", "B": "O direito ao trabalho encontra previsão apenas como princípio da ordem econômica, não integrando o catálogo de direitos sociais.", "C": "O direito à saúde possui natureza exclusivamente programática, condicionando-se integralmente à disponibilidade orçamentária do ente federativo competente.", "D": "A previdência social não integra o rol de direitos sociais expressamente previstos no texto constitucional."}, "gabarito": "A", "verificar": false}, {"id": "R142-13", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 13", "disciplina": "Constitucional", "tema": "Aplicabilidade e interpretação das normas", "subtema": "Aplicabilidade e interpretação das normas", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A Constituição assegura direitos individuais dotados de eficácia imediata e estabelece cláusulas expressas quanto à sua aplicabilidade e extensão. Considerando exclusivamente o texto constitucional, assinale a alternativa CORRETA.", "alternativas": {"A": "O direito de reunião pode ser exercido independentemente de aviso prévio à autoridade competente quando realizado em locais abertos ao público.", "B": "O direito de propriedade possui natureza absoluta e não se submete à função social constitucionalmente prevista.", "C": "Os direitos e garantias fundamentais somente produzem efeitos após edição de lei regulamentadora que discipline seu exercício.", "D": "As normas definidoras dos direitos e garantias fundamentais têm aplicação imediata, independentemente de regulamentação infraconstitucional específica."}, "gabarito": "D", "verificar": false}, {"id": "R142-14", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 14", "disciplina": "Constitucional", "tema": "Organização dos Poderes", "subtema": "Organização dos Poderes", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A Constituição Federal institui sistema de controle externo da Administração Pública com finalidade de assegurar a legalidade, legitimidade e economicidade da gestão pública. Com base exclusivamente no texto constitucional, analise as afirmativas a seguir: I. O controle externo será exercido pelo Congresso Nacional, com o auxílio do Tribunal de Contas da União. II. O Tribunal de Contas da União integra a estrutura do Poder Judiciário. III. O Tribunal de Contas da União exerce jurisdição judicial típica ao julgar as contas dos administradores públicos. IV. O controle externo abrange a fiscalização contábil, financeira, orçamentária, operacional e patrimonial da União e das entidades da administração direta e indireta. Estão CORRETAS:", "alternativas": {"A": "I, II e IV apenas.", "B": "II e III apenas.", "C": "I, III e IV apenas.", "D": "I e IV apenas."}, "gabarito": "D", "verificar": false}, {"id": "R142-16", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 16", "disciplina": "Constitucional", "tema": "Federalismo e organização do Estado", "subtema": "Federalismo e organização do Estado", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A Constituição estabelece modelo federativo baseado na autonomia política, administrativa e financeira dos entes federativos, preservando a unidade do Estado por meio de repartição constitucional de competências. Considerando exclusivamente o texto constitucional, assinale a alternativa CORRETA.", "alternativas": {"A": "Os Estados-membros não possuem competência para auto-organização constitucional, devendo adotar integralmente o modelo organizatório federal.", "B": "O Distrito Federal pode subdividir-se em Municípios, desde que autorizada a divisão por meio de lei complementar federal específica.", "C": "A organização político-administrativa da República Federativa do Brasil compreende a União, os Estados, o Distrito Federal e os Municípios, todos dotados de autonomia nos termos da Constituição.", "D": "Os Municípios integram a Federação apenas sob o aspecto administrativo, não possuindo autonomia política ou legislativa própria. ÉTICA"}, "gabarito": "C", "verificar": false}, {"id": "R142-17", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 17", "disciplina": "Constitucional", "tema": "Administração Pública na CF", "subtema": "Administração Pública na CF", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Os princípios constitucionais da Administração Pública exercem função estruturante no regime jurídico-administrativo, orientando a interpretação das normas, a atuação dos agentes públicos e o controle dos atos estatais. Sua aplicação não se limita ao plano formal, pois envolve a harmonização de valores e finalidades que asseguram a legitimidade da ação administrativa no Estado democrático (BRASIL, 1988). Com base nessa abordagem, é CORRETO afirmar que:", "alternativas": {"A": "Os princípios constitucionais atuam apenas como diretrizes genéricas, sem aplicação direta na invalidação de atos administrativos ou na responsabilização de agentes públicos.", "B": "Os princípios constitucionais orientam a interpretação e o controle dos atos administrativos, vinculando a atuação estatal.", "C": "Os princípios constitucionais da Administração Pública incidem apenas sobre atos vinculados, não sendo aplicáveis às hipóteses de discricionariedade administrativa.", "D": "A aplicação dos princípios constitucionais depende de regulamentação infraconstitucional específica, sem a qual não produzem efeitos concretos na atuação administrativa."}, "gabarito": "B", "verificar": false}, {"id": "R142-18", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 18", "disciplina": "Ética e serviço público", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Os deveres, direitos e responsabilidades do servidor público estruturam a relação funcional entre o agente e a Administração, definindo limites, garantias e obrigações que asseguram a continuidade do serviço público e a proteção do interesse coletivo. Esses elementos articulam prerrogativas institucionais e mecanismos de responsabilização, conferindo equilíbrio entre autoridade, dever funcional e controle democrático (BRASIL, 1988). Com base nessa estrutura, é CORRETO afirmar que:", "alternativas": {"A": "Os direitos do servidor público possuem caráter absoluto e prevalecem sobre deveres funcionais e responsabilidades administrativas, sempre que houver conflito entre esses elementos.", "B": "Os deveres do servidor público aplicam-se somente durante a execução direta das atribuições do cargo, não abrangendo comportamentos externos ou atitudes praticadas fora do ambiente institucional que possam afetar a imagem da Administração.", "C": "As responsabilidades do servidor público restringem-se exclusivamente ao âmbito administrativo interno, não alcançando repercussões civis ou penais, ainda que a conduta funcional cause prejuízo a terceiros ou ao patrimônio público.", "D": "Os deveres, direitos e responsabilidades do servidor formam um sistema integrado que garante o exercício regular da função pública e a proteção do interesse coletivo. MÉDICO DO PSF (SECRETARIA MUNICIPAL DE SAÚDE) - 1"}, "gabarito": "D", "verificar": false}, {"id": "R142-19", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 19", "disciplina": "Ética e serviço público", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A ética no serviço público configura um conjunto de valores e princípios que orientam a atuação administrativa para além do cumprimento formal da lei, funcionando como critério de legitimidade das decisões estatais e de controle da discricionariedade. Essa perspectiva permite avaliar a conduta do agente público à luz do interesse coletivo, da integridade institucional e da confiança social nas instituições (BRASIL, 1988). Com base nessa compreensão, é CORRETO afirmar que:", "alternativas": {"A": "A ética no serviço público autoriza decisões baseadas em convicções pessoais do agente, desde que estas não contrariem diretamente a legislação vigente.", "B": "A ética no serviço público atua como limite valorativo à discricionariedade administrativa.", "C": "A observância da ética no serviço público restringe-se às hipóteses em que exista norma expressa que discipline previamente a conduta do agente.", "D": "A ética no serviço público se confunde com a legalidade estrita, uma vez que toda decisão legal é, por definição, eticamente legítima no âmbito da Administração."}, "gabarito": "B", "verificar": false}, {"id": "R142-20", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 20", "disciplina": "Ética e serviço público", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A relação entre ética, moral e cidadania envolve a compreensão de como valores, normas e práticas orientam a vida em sociedade e a atuação dos indivíduos no espaço público. Essa abordagem permite analisar, em nível conceitual, tanto os costumes socialmente praticados quanto a reflexão crítica sobre eles, bem como o papel do cidadão na construção e na preservação da vida coletiva (BRASIL, 1988). Com base nessa relação, é CORRETO afirmar que:", "alternativas": {"A": "A ética, a moral e a cidadania possuem o mesmo significado conceitual, diferenciando-se apenas pelo contexto histórico em que são utilizadas.", "B": "A cidadania limita-se ao cumprimento de deveres impostos pelo Estado, não abrangendo direitos nem participação ativa na esfera pública.", "C": "A ética reflete criticamente sobre a moral, enquanto a cidadania envolve o exercício de direitos e deveres na vida social.", "D": "A moral refere-se exclusivamente à reflexão filosófica abstrata, enquanto a ética corresponde às normas práticas vigentes em uma sociedade."}, "gabarito": "C", "verificar": false}, {"id": "R142-21", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 21", "disciplina": "Constitucional", "tema": "Administração Pública na CF", "subtema": "Administração Pública na CF", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Os princípios constitucionais da Administração Pública configuram fundamentos jurídicos e éticos que orientam a atuação do Estado, vinculando o exercício da função administrativa à observância de valores essenciais à legitimidade do poder público. Esses princípios funcionam como parâmetros normativos de interpretação, controle e validade dos atos administrativos no regime democrático (BRASIL, 1988). Com base nesses princípios, é CORRETO afirmar que:", "alternativas": {"A": "Os princípios constitucionais da Administração Pública limitam-se à legalidade formal, não abrangendo critérios de natureza ética, finalística ou relacionados ao interesse público.", "B": "Os princípios constitucionais vinculam a atuação administrativa e funcionam como critérios de validade dos atos do poder público.", "C": "A observância dos princípios constitucionais restringe-se à Administração direta, não alcançando entidades da administração indireta ou agentes investidos em funções temporárias.", "D": "Os princípios constitucionais da Administração Pública possuem natureza apenas programática, servindo como diretrizes políticas sem eficácia jurídica direta ou imediata."}, "gabarito": "B", "verificar": false}, {"id": "R142-22", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 22", "disciplina": "Ética e serviço público", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A conduta ética, a probidade e a responsabilidade social constituem valores centrais da atuação pública, pois orientam o comportamento do agente estatal em consonância com o interesse coletivo, a integridade das instituições e a confiança da sociedade. Esses princípios permitem avaliar não apenas a legalidade dos atos administrativos, mas também sua legitimidade ética e seu impacto social mais amplo (BRASIL, 1988). Com base nessa abordagem, é CORRETO afirmar que:", "alternativas": {"A": "A conduta ética admite relativização da probidade sempre que a flexibilização de princípios resultar em maior eficiência administrativa ou conveniência institucional.", "B": "A conduta ética envolve probidade e responsabilidade social na atuação do agente público.", "C": "A responsabilidade social do agente público limita-se ao cumprimento formal das normas legais, sem consideração dos impactos sociais ou institucionais de suas decisões.", "D": "A probidade administrativa restringe-se à ausência de práticas criminosas, não abrangendo deveres éticos ou padrões de comportamento esperados do agente público."}, "gabarito": "B", "verificar": false}, {"id": "R142-23", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 23", "disciplina": "Ética e serviço público", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A ética no serviço público envolve princípios que orientam a atuação do agente estatal para além da legalidade estrita, incorporando critérios de responsabilidade, integridade e compromisso com o interesse coletivo. Em nível conceitual mais aprofundado, essa perspectiva permite analisar a relação entre valores éticos, dever funcional e legitimidade da ação administrativa no contexto democrático (BRASIL, 1988). Com base nessa compreensão, é CORRETO afirmar que:", "alternativas": {"A": "A ética no serviço público exige que o agente fundamente suas decisões na legalidade e no interesse público, orientando sua conduta por valores de integridade e responsabilidade institucional.", "B": "A atuação ética no serviço público autoriza a flexibilização do interesse coletivo sempre que decisões personalizadas aumentem a eficiência administrativa ou atendam a conveniências circunstanciais.", "C": "A ética no serviço público confunde-se com o regime jurídico do servidor, restringindo-se ao cumprimento formal de normas legais e afastando qualquer avaliação de natureza valorativa da conduta.", "D": "A observância ética no serviço público depende exclusivamente da consciência individual do agente, não podendo ser exigida institucionalmente nem servir como parâmetro de controle administrativo. INFORMÁTICA"}, "gabarito": "A", "verificar": false}, {"id": "R142-24", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 24", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "afirmativas I-II-III", "texto": null, "enunciado": "A engenharia social é uma técnica de manipulação psicológica usada por atacantes para enganar indivíduos e fazê-los divulgar informações confidenciais ou realizar ações que comprometam a segurança. Um assistente de tecnologia precisa estar ciente desses ataques para orientar os usuários a não se tornarem vítimas. Analise as seguintes proposições sobre ataques de engenharia social: I. Phishing é um tipo de ataque que utiliza e-mails, mensagens ou sites falsos, que se passam por entidades confiáveis, para induzir as vítimas a fornecerem dados sensíveis, como senhas e números de cartão de crédito. II. Spear phishing é uma variação do phishing, porém altamente direcionada. O atacante pesquisa sobre o alvo (uma pessoa ou empresa específica) e cria uma mensagem personalizada, aumentando a probabilidade de sucesso do golpe. III. A implementação de um firewall robusto e de um software antivírus atualizado é suficiente para proteger completamente uma organização contra todos os tipos de ataques de engenharia social, pois o fator humano não é explorado. Está CORRETO o que se afirma em:", "alternativas": {"A": "I e II apenas.", "B": "I apenas.", "C": "I, II e III.", "D": "II e III apenas."}, "gabarito": "A", "verificar": false}, {"id": "R142-25", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 25", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "Um assistente de tecnologia está implementando uma política de segurança para proteger os dados de uma organização contra acessos não autorizados e vazamentos. Ele precisa garantir que os princípios fundamentais da segurança da informação sejam aplicados corretamente. A confidencialidade, a integridade e a disponibilidade são os pilares que sustentam a segurança da informação. Julgue os itens a seguir como Verdadeiro (V) ou Falso (F) sobre os pilares da segurança da informação: (__) A Confidencialidade garante que a informação seja acessível somente por pessoas autorizadas. Um exemplo de mecanismo que promove a confidencialidade é a criptografia de dados. (__) A Integridade assegura que a informação não foi alterada de forma não autorizada. Funções de hash (como SHA-256) são comumente usadas para verificar a integridade de arquivos e mensagens. (__) A Disponibilidade refere-se à garantia de que os sistemas e os dados estarão acessíveis e utilizáveis sempre que necessário por usuários autorizados. A implementação de firewalls é a única medida necessária para garantir a disponibilidade. (__) A Autenticidade, um princípio relacionado, garante que a identidade de um usuário ou a origem de uma informação é genuína. A assinatura digital é um mecanismo que assegura tanto a autenticidade quanto a integridade. Assinale a alternativa que apresenta a sequência CORRETA, de cima para baixo.", "alternativas": {"A": "F, V, V, F.", "B": "V, V, F, V.", "C": "F, F, V, V.", "D": "V, F, F, V."}, "gabarito": "B", "verificar": false}, {"id": "R142-26", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 26", "disciplina": "Informática", "tema": "E-mail e comunicação eletrônica no ambiente corporativo", "subtema": "E-mail e comunicação eletrônica no ambiente corporativo", "dificuldade": 0, "comando": "afirmativas I-II-III", "texto": null, "enunciado": "Um assistente de tecnologia precisa configurar o cliente de e-mail de um novo colaborador, que necessita acessar seus e-mails de múltiplos dispositivos (desktop, smartphone e tablet), mantendo todas as pastas e o status das mensagens (lidas, não lidas, respondidas) sincronizados em tempo real. A escolha do protocolo de recebimento de e-mails é determinante para atender a essa demanda de mobilidade e sincronização. Analise as seguintes proposições sobre os protocolos de correio eletrônico: I. O protocolo POP3 (Post Office Protocol 3) é o mais indicado para essa situação, pois foi projetado para sincronizar as caixas de correio em múltiplos dispositivos, mantendo uma cópia das mensagens no servidor e espelhando todas as ações (como apagar ou mover mensagens) em todos os clientes conectados. II. O protocolo IMAP (Internet Message Access Protocol) permite que o usuário acesse e gerencie seus e-mails diretamente no servidor. As mensagens permanecem no servidor, e os clientes de e-mail nos diferentes dispositivos sincronizam com o servidor, refletindo o estado atual da caixa de correio, o que o torna ideal para o cenário descrito. III. O protocolo SMTP (Simple Mail Transfer Protocol) é utilizado tanto para o envio quanto para o recebimento de e-mails, funcionando como um protocolo universal para todas as operações de correio eletrônico, sendo a única configuração necessária no cliente de e-mail. Está correto o que se afirma em:", "alternativas": {"A": "I e II apenas.", "B": "I apenas.", "C": "II e III apenas.", "D": "II apenas."}, "gabarito": "D", "verificar": false}, {"id": "R142-27", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 27", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "Um assistente de tecnologia está implementando uma política de segurança para proteger os dados de uma organização contra acessos não autorizados e vazamentos. Ele precisa garantir que os princípios fundamentais da segurança da informação sejam aplicados corretamente. A confidencialidade, a integridade e a disponibilidade são os pilares que sustentam a segurança da informação. Julgue os itens a seguir como Verdadeiro (V) ou Falso (F) sobre os pilares da segurança da informação: (__) A Confidencialidade garante que a informação seja acessível somente por pessoas autorizadas. Um exemplo de mecanismo que promove a confidencialidade é a criptografia de dados. (__) A Integridade assegura que a informação não foi alterada de forma não autorizada. Funções de hash (como SHA-256) são comumente usadas para verificar a integridade de arquivos e mensagens. (__) A Disponibilidade refere-se à garantia de que os sistemas e os dados estarão acessíveis e utilizáveis sempre que necessário por usuários autorizados. A implementação de firewalls é a única medida necessária para garantir a disponibilidade. (__) A Autenticidade, um princípio relacionado, garante que a identidade de um usuário ou a origem de uma informação é genuína. A assinatura digital é um mecanismo que assegura tanto a autenticidade quanto a integridade. Assinale a alternativa que apresenta a sequência CORRETA, de cima para baixo.", "alternativas": {"A": "V, F, F, V.", "B": "F, F, V, V.", "C": "V, V, F, V.", "D": "F, V, V, F."}, "gabarito": "C", "verificar": false}, {"id": "R142-28", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 28", "disciplina": "Informática", "tema": "Conceitos básicos de hardware e software", "subtema": "Conceitos básicos de hardware e software", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Um assistente de tecnologia é encarregado de preparar uma nova estação de trabalho para um desenvolvedor que precisará de ambientes para compilar código, gerenciar contêineres e garantir a segurança do sistema. A escolha do sistema operacional e a configuração de seus recursos são cruciais para a produtividade e a proteção contra ameaças. Para isso, ele precisa compreender as diferenças fundamentais entre os principais sistemas operacionais e seus subsistemas. Associe os conceitos da Coluna A com suas respectivas descrições na Coluna B, relacionados a sistemas operacionais como Windows e Linux. Coluna A 1. Subsistema Windows para Linux (WSL). 2. Kernel do Linux. 3. Política de Grupo (GPO) do Windows. 4. Permissões de arquivo no Linux (chmod). Coluna B (__) Ferramenta de administração centralizada no Windows que permite a um administrador de rede definir configurações para usuários e computadores, reforçando políticas de segurança e padronizando o ambiente de trabalho. (__) Camada de compatibilidade no Windows 10 e 11 que permite a execução de binários Linux (em formato ELF) de forma nativa, integrando um ambiente de linha de comando Linux completo sem a necessidade de uma máquina virtual tradicional. (__) Núcleo do sistema operacional, responsável pelo gerenciamento de processos, memória, dispositivos de hardware e chamadas de sistema. Sua natureza monolítica e de código aberto permite alta customização e auditoria de segurança. (__) Comando utilizado para alterar as permissões de acesso (leitura, escrita e execução) para o dono do arquivo, o grupo e outros usuários, sendo um pilar fundamental na segurança do sistema de arquivos. Assinale a alternativa que apresenta a ordem de associação CORRETA, de cima para baixo.", "alternativas": {"A": "3, 2, 4, 1.", "B": "2, 4, 1, 3.", "C": "3, 1, 2, 4.", "D": "4, 1, 2, 3."}, "gabarito": "C", "verificar": false}, {"id": "R142-29", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 29", "disciplina": "Informática", "tema": "fora do edital", "subtema": "fora do edital", "dificuldade": 0, "comando": "afirmativas I-II-III", "texto": null, "enunciado": "Com o avanço da Inteligência Artificial (IA), surgem dilemas éticos complexos sobre o uso de dados e a autonomia dos algoritmos, especialmente no ambiente acadêmico e de pesquisa. As universidades brasileiras têm debatido a criação de diretrizes para o uso responsável da IA generativa por alunos e pesquisadores. Analise as seguintes proposições sobre o uso ético da Inteligência Artificial: I. O uso de ferramentas de IA para gerar textos, como artigos ou trabalhos acadêmicos, sem a devida declaração de uso e sem uma revisão crítica e substancial pelo autor humano, pode ser considerado plágio ou má conduta acadêmica, pois o trabalho não é original. II. Os dados utilizados para treinar modelos de IA podem conter vieses (de gênero, raça, etc.) presentes na sociedade. A utilização acrítica dos resultados gerados por esses modelos pode perpetuar e amplificar esses vieses em pesquisas e tomadas de decisão. III. A responsabilidade sobre o conteúdo gerado por uma IA é exclusivamente do desenvolvedor da ferramenta, isentando o usuário final de qualquer obrigação de verificar a veracidade, a precisão ou as implicações éticas das informações produzidas. Está CORRETO o que se afirma em:", "alternativas": {"A": "I apenas.", "B": "II e III apenas.", "C": "I, II e III.", "D": "I e II apenas."}, "gabarito": "D", "verificar": false}, {"id": "R142-30", "real": true, "origem": "Cabo Sto Agostinho/PE 2026, questão 30", "disciplina": "Informática", "tema": "Conceitos sobre redes sociais e ferramentas colaborativas", "subtema": "Conceitos sobre redes sociais e ferramentas colaborativas", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "A etiqueta digital, ou \"netiqueta\", refere-se a um conjunto de normas de conduta e boas maneiras no ambiente online, visando uma convivência respeitosa e profissional. Um assistente de tecnologia deve promover o uso da netiqueta para manter um ambiente de trabalho digital saudável. Julgue os itens a seguir como Verdadeiro (V) ou Falso (F) sobre as práticas de netiqueta: (__) Escrever mensagens inteiras em letras maiúsculas é uma boa prática, pois garante que a mensagem será lida com atenção. (__) Antes de enviar um e-mail para um grande grupo de pessoas, deve-se avaliar se todos os destinatários realmente precisam receber a informação. (__) Em fóruns e chats, é aceitável interromper uma conversa paralela para fazer uma pergunta não relacionada, pois o ambiente é informal. (__) É importante respeitar a privacidade alheia, não compartilhando informações, fotos ou vídeos de outras pessoas sem o consentimento delas. Assinale a alternativa que apresenta a sequência CORRETA, de cima para baixo:", "alternativas": {"A": "V, F, V, F.", "B": "V, V, F, F.", "C": "F, V, F, V.", "D": "F, F, V, V. PREFEITURA SANTO AG RASCU NÃO DES DO CABO DE GOSTINHO UNHO STAQUE"}, "gabarito": "C", "verificar": false}, {"id": "R95-01", "real": true, "origem": "Japaratinga/AL 2025, questão 1", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "De acordo com o texto \"MANGUEZAIS\", a maior parte do carbono sequestrado pelos manguezais está armazenada:", "alternativas": {"A": "Nos sedimentos e solos.", "B": "Nos animais marinhos que habitam o ecossistema.", "C": "Na água do mar.", "D": "Nas copas das árvores."}, "gabarito": "A", "verificar": false}, {"id": "R95-02", "real": true, "origem": "Japaratinga/AL 2025, questão 2", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Conforme o texto \"MANGUEZAIS\", qual é uma das ações humanas que impactam negativamente \", é possível inferir que o sucesso das estratégias de mitigação climática propostas pelo projeto BlueShore depende principalmente de:", "alternativas": {"A": "Substituição gradual dos manguezais por florestas amazônicas, devido à sua menor eficiência em capturar carbono.", "B": "Incentivos econômicos para estimular a urbanização costeira e o crescimento populacional nas regiões de manguezal.", "C": "Expansão da carcinicultura e da agropecuária como formas de desenvolvimento sustentável nos manguezais.", "D": "Conhecimento técnico sobre os processos geoquímicos dos solos e sua relação com o sequestro de carbono."}, "gabarito": "D", "verificar": false}, {"id": "R95-07", "real": true, "origem": "Japaratinga/AL 2025, questão 7", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Assinale a alternativa em que a concordância verbal está CORRETA, de acordo com a norma padrão da Língua Portuguesa:", "alternativas": {"A": "Os manguezais brasileiros apresenta uma das maiores extensões globais desse ecossistema.", "B": "As condições geoquímicas dos solos influenciam na capacidade de sequestro de carbono.", "C": "O projeto BlueShore e seus pesquisadores realiza estudos sobre os solos dos manguezais.", "D": "A alteração no uso da terra comprometem a função de sumidouro de carbono dos manguezais."}, "gabarito": "B", "verificar": false}, {"id": "R95-08", "real": true, "origem": "Japaratinga/AL 2025, questão 8", "disciplina": "Português", "tema": "Fonologia", "subtema": "Fonologia", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Assinale a alternativa em que todas as palavras estão corretamente acentuadas conforme a norma padrão da Língua Portuguesa:", "alternativas": {"A": "A biodiversidade dos manguezais está ameaçada pela açao humana em zonas urbanas.", "B": "Os pesquisadores coletam dados sobre o fenômeno do sequestro de carbono em áreas úmidas.", "C": "As condições geo

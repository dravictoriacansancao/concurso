<style>

}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }

.grid50 button.cur { outline: 2px solid var(--accent); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }

.kpi .v { font: 800 1.6rem var(--display); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .78rem; color: var(--ink-soft); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-weight: 600; font-size: .85rem; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
textarea { width: 100%; min-height: 110px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 500 .75rem var(--mono); }
.confirm { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.empty { text-align: center; padding: 30px 10px; color: var(--ink-soft); }
@media (prefers-reduced-motion: no-preference) { .alt { transition: background .15s, border-color .15s; } }

 informações relativas à pessoa do impetrante.", "D": "O instrumento adequado é o mandado de injunção, que assegura o conhecimento e a retificação de informações pessoais em registros públicos.", "E": "O instrumento adequado é o habeas data, que assegura o conhecimento e a retificação de informações pessoais em registros públicos."}, "gabarito": "E", "comentario_correta": "Art. 5º, LXXII: conceder-se-á habeas data para assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público, e para a retificação de dados. LXXVII: são gratuitas as ações de habeas corpus e habeas data.", "por_que_cada_errada": {"A": "Ação popular visa anular ato lesivo ao patrimônio público e à moralidade.", "B": "As ações de habeas data são gratuitas (art. 5º, LXXVII).", "C": "Habeas corpus protege a liberdade de locomoção.", "D": "Mandado de injunção supre falta de norma regulamentadora.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "CF/88, art. 5º, LXXII e LXXVII", "pegadinha": "Troca entre remédios.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-006", "disciplina": "Constitucional", "tema": "Remédios constitucionais", "subtema": "Mandado de segurança coletivo", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando a legitimidade para impetrar mandado de segurança coletivo, prevista no art. 5º, LXX, da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "Pode ser impetrado por qualquer partido político, ainda que sem representação no Congresso Nacional.", "B": "Pode ser impetrado pelo Ministério Público, que detém legitimidade exclusiva para a defesa de interesses coletivos.", "C": "Pode ser impetrado por associação legalmente constituída e em funcionamento há pelo menos dois anos, em defesa de seus membros.", "D": "Pode ser impetrado por qualquer cidadão em pleno gozo dos direitos políticos, em defesa do patrimônio público.", "E": "Pode ser impetrado por associação constituída e em funcionamento há pelo menos um ano, em defesa dos associados."}, "gabarito": "E", "comentario_correta": "Art. 5º, LXX: o mandado de segurança coletivo pode ser impetrado por: a) partido político com representação no Congresso Nacional; b) organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa dos interesses de seus membros ou associados.", "por_que_cada_errada": {"A": "Exige-se representação no Congresso Nacional.", "B": "A Constituição não prevê o MP no inciso LXX nem confere exclusividade.", "C": "O prazo é de pelo menos um ano.", "D": "Essa é a legitimidade da ação popular.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "CF/88, art. 5º, LXX", "pegadinha": "Troca de prazo (1 × 2 anos) e de legitimados.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-007", "disciplina": "Constitucional", "tema": "Direitos políticos", "subtema": "Voto e alistamento", "dificuldade": 1, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando as regras sobre alistamento eleitoral e voto do art. 14 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "O alistamento e o voto são facultativos para os analfabetos, os maiores de sessenta e os maiores de dezesseis e menores de dezoito.", "B": "O alistamento e o voto são facultativos para os analfabetos, os maiores de setenta anos e os maiores de dezesseis e menores de dezoito anos.", "C": "O alistamento e o voto são facultativos para os maiores de dezoito anos que residam no exterior.", "D": "O alistamento e o voto são vedados aos maiores de dezesseis e menores de dezoito anos.", "E": "O alistamento e o voto são obrigatórios para os analfabetos, por exigência do princípio da igualdade política."}, "gabarito": "B", "comentario_correta": "Art. 14, § 1º: o alistamento eleitoral e o voto são obrigatórios para os maiores de dezoito anos e facultativos para os analfabetos, os maiores de setenta anos e os maiores de dezesseis e menores de dezoito anos.", "por_que_cada_errada": {"A": "A idade é setenta anos.", "B": "Esta é a alternativa a ser marcada.", "C": "Não há essa hipótese de facultatividade.", "D": "Para eles são facultativos.", "E": "Para analfabetos são facultativos."}, "fundamento": "CF/88, art. 14, § 1º", "pegadinha": "Troca 70 × 60 anos.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-008", "disciplina": "Constitucional", "tema": "Direitos políticos", "subtema": "Idade mínima para cargos", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando as idades mínimas exigidas como condição de elegibilidade pela Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "Exige-se idade mínima de vinte e um anos para Prefeito e Vice-Prefeito, e de dezoito anos para Vereador.", "B": "Exige-se idade mínima de vinte e cinco anos para Prefeito e Vice, e de vinte e um para Vereador.", "C": "Exige-se idade mínima de dezoito anos para Prefeito e Vice-Prefeito, e de dezesseis anos para Vereador.", "D": "Exige-se idade mínima de trinta anos para Prefeito e Vice-Prefeito, e de vinte e um anos para Vereador.", "E": "Exige-se idade mínima de vinte e um anos para Prefeito, e de trinta e cinco anos para Vereador."}, "gabarito": "A", "comentario_correta": "Art. 14, § 3º, VI: idade mínima de 35 anos (Presidente, Vice e Senador); 30 (Governador e Vice); 21 (Deputados, Prefeito, Vice-Prefeito e juiz de paz); 18 (Vereador).", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Não existe a idade de 25 anos no rol.", "C": "Prefeito exige 21; Vereador 18.", "D": "Trinta anos é para Governador; Prefeito exige 21 e Vereador 18.", "E": "Trinta e cinco é para Presidente, Vice e Senador."}, "fundamento": "CF/88, art. 14, § 3º, VI", "pegadinha": "Troca entre as faixas etárias.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-009", "disciplina": "Constitucional", "tema": "Princípios fundamentais", "subtema": "Fundamentos da República", "dificuldade": 1, "tipo_enunciado": "direto", "comando": "INCORRETA", "texto": null, "enunciado": "O art. 1º da Constituição Federal enumera os fundamentos da República Federativa do Brasil. Assinale a afirmativa INCORRETA.", "alternativas": {"A": "É fundamento da República a dignidade da pessoa humana.", "B": "É fundamento da República a soberania.", "C": "É fundamento da República o pluralismo político.", "D": "É fundamento da República a cidadania.", "E": "É fundamento da República erradicar a pobreza."}, "gabarito": "E", "comentario_correta": "Erradicar a pobreza e a marginalização é OBJETIVO fundamental (art. 3º, III), não fundamento. Fundamentos (art. 1º): soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa, pluralismo político.", "por_que_cada_errada": {"A": "Correto: art. 1º, III.", "B": "Correto: art. 1º, I.", "C": "Correto: art. 1º, V.", "D": "Correto: art. 1º, II.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "CF/88, arts. 1º e 3º", "pegadinha": "Trocar objetivo (art. 3º) por fundamento (art. 1º).", "prob_tema": 0.08, "verificar": false}, {"id": "CON-010", "disciplina": "Constitucional", "tema": "Federalismo e organização do Estado", "subtema": "Competência municipal em saúde", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Vereador apresentou projeto de lei municipal sobre normas gerais de previdência social para os servidores de saúde, alegando competência concorrente. Considerando a repartição de competências da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "Compete ao Município prestar serviços de saúde à população, com cooperação técnica e financeira da União e do Estado.", "B": "Compete ao Município prestar serviços de saúde, vedada a cooperação técnica e financeira dos demais entes.", "C": "Compete ao Município cuidar da saúde com exclusividade, vedada a atuação comum da União e dos Estados.", "D": "Compete ao Município legislar privativamente sobre seguridade social, por se tratar de assunto de interesse local.", "E": "Compete ao Município legislar concorrentemente com a União sobre previdência social e proteção e defesa da saúde."}, "gabarito": "A", "comentario_correta": "Art. 30, VII: compete aos Municípios prestar, com a cooperação técnica e financeira da União e do Estado, serviços de atendimento à saúde da população. Art. 23, II: competência comum para cuidar da saúde. Art. 24, XII: competência concorrente (União, Estados e DF) sobre previdência social e proteção e defesa da saúde.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "O art. 30, VII, prevê justamente essa cooperação.", "C": "Cuidar da saúde é competência comum (art. 23, II).", "D": "Seguridade social é competência privativa da União (art. 22, XXIII).", "E": "O art. 24 atribui a competência concorrente à União, Estados e DF; o Município suplementa no que couber (art. 30, II)."}, "fundamento": "CF/88, arts. 22, XXIII; 23, II; 24, XII; 30, II e VII", "pegadinha": "Incluir o Município na competência concorrente do art. 24.", "prob_tema": 0.08, "verificar": false}, {"id": "CON-011", "disciplina": "Constitucional", "tema": "Processo legislativo", "subtema": "Emenda constitucional", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o processo de emenda à Constituição previsto no art. 60 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "A proposta é discutida e votada em sessão unicameral do Congresso, em turno único, aprovada por maioria absoluta.", "B": "A proposta é discutida e votada em cada Casa, em dois turnos, e depois submetida à sanção do Presidente da República.", "C": "A proposta é discutida e votada em cada Casa, em dois turnos, e aprovada se obtiver três quintos dos votos dos membros.", "D": "A proposta é discutida e votada em cada Casa, em dois turnos, podendo tramitar durante intervenção federal.", "E": "A proposta é discutida e votada em cada Casa, em dois turnos, aprovada se obtiver dois terços dos votos dos membros."}, "gabarito": "C", "comentario_correta": "Art. 60, § 2º: a proposta será discutida e votada em cada Casa do Congresso Nacional, em dois turnos, considerando-se aprovada se obtiver, em ambos, três quintos dos votos dos respectivos membros. § 3º: promulgada pelas Mesas. § 1º: limites circunstanciais.", "por_que_cada_errada": {"A": "A votação é em cada Casa, em dois turnos, com 3/5.", "B": "Emenda constitucional não se submete a sanção; é promulgada pelas Mesas.", "C": "Esta é a alternativa a ser marcada.", "D": "Não pode ser emendada na vigência de intervenção federal, estado de defesa ou de sítio.", "E": "O quórum é de três quintos."}, "fundamento": "CF/88, art. 60, §§ 1º a 3º", "pegadinha": "Troca de quórum (3/5 × 2/3) e sanção inexistente.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-012", "disciplina": "Constitucional", "tema": "Poder constituinte", "subtema": "Cláusulas pétreas", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando as limitações materiais ao poder de reforma da Constituição (cláusulas pétreas), assinale a afirmativa CORRETA.", "alternativas": {"A": "Não será objeto de deliberação proposta de emenda tendente a abolir a forma republicana de governo e o voto obrigatório.", "B": "Não será objeto de deliberação proposta de emenda tendente a abolir o voto direto, secreto, universal e obrigatório.", "C": "Não será objeto de deliberação proposta de emenda que modifique a organização do sistema tributário nacional.", "D": "Não será objeto de deliberação proposta de emenda tendente a abolir a forma federativa e a separação dos Poderes.", "E": "Não será objeto de deliberação proposta de emenda que altere qualquer dispositivo relativo aos direitos sociais."}, "gabarito": "D", "comentario_correta": "Art. 60, § 4º: não será objeto de deliberação a proposta de emenda tendente a abolir: I – a forma federativa de Estado; II – o voto direto, secreto, universal e periódico; III – a separação dos Poderes; IV – os direitos e garantias individuais.", "por_que_cada_errada": {"A": "A forma republicana e a obrigatoriedade do voto não estão no § 4º.", "B": "O texto fala em voto direto, secreto, universal e PERIÓDICO.", "C": "Sistema tributário não é cláusula pétrea.", "D": "Esta é a alternativa a ser marcada.", "E": "O § 4º menciona direitos e garantias individuais; e veda apenas a tendência a abolir."}, "fundamento": "CF/88, art. 60, § 4º", "pegadinha": "Trocar 'periódico' por 'obrigatório'; incluir forma republicana.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-013", "disciplina": "Constitucional", "tema": "Controle de constitucionalidade", "subtema": "Legitimados da ADI", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando os legitimados para propor ação direta de inconstitucionalidade perante o STF, conforme o art. 103 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "Podem propor a ação, entre outros, o sindicato de âmbito municipal e a federação sindical estadual.", "B": "Podem propor a ação, entre outros, o Conselho Federal da OAB e confederação sindical de âmbito nacional.", "C": "Podem propor a ação, entre outros, qualquer cidadão no pleno exercício de seus direitos políticos.", "D": "Podem propor a ação, entre outros, qualquer partido político registrado, ainda que sem representação no Congresso.", "E": "Podem propor a ação, entre outros, o Prefeito Municipal e a Mesa da Câmara de Vereadores."}, "gabarito": "B", "comentario_correta": "Art. 103: Presidente da República; Mesas do Senado, da Câmara, de Assembleia Legislativa ou da Câmara Legislativa do DF; Governador; PGR; Conselho Federal da OAB; partido político com representação no Congresso; confederação sindical ou entidade de classe de âmbito nacional.", "por_que_cada_errada": {"A": "Apenas confederação sindical (âmbito nacional).", "B": "Esta é a alternativa a ser marcada.", "C": "O cidadão não é legitimado para ADI.", "D": "Exige-se representação no Congresso Nacional.", "E": "Prefeitos e Câmaras Municipais não são legitimados."}, "fundamento": "CF/88, art. 103", "pegadinha": "Incluir entes municipais e cidadão.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-014", "disciplina": "Constitucional", "tema": "Aplicabilidade e interpretação das normas", "subtema": "Eficácia das normas", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Segundo a classificação de José Afonso da Silva quanto à aplicabilidade das normas constitucionais, assinale a afirmativa CORRETA.", "alternativas": {"A": "Normas de eficácia contida têm aplicabilidade imediata, mas podem ter seu alcance restringido por lei.", "B": "Normas de eficácia limitada têm aplicabilidade imediata e integral, sendo vedada sua regulamentação por lei.", "C": "Normas de eficácia contida dependem de lei para produzir qualquer efeito, não tendo aplicabilidade imediata.", "D": "Normas de eficácia plena dependem de regulamentação para produzir efeitos, podendo ser restringidas por lei.", "E": "Normas de eficácia contida não admitem restrição por lei, pois sua aplicabilidade é integral e imutável."}, "gabarito": "A", "comentario_correta": "Eficácia plena: aplicabilidade direta, imediata e integral. Contida: aplicabilidade direta e imediata, mas possivelmente não integral, restringível por lei (ex.: art. 5º, XIII). Limitada: aplicabilidade mediata, depende de lei.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Eficácia limitada depende de lei para produzir plenos efeitos.", "C": "Essa é a característica das normas de eficácia limitada.", "D": "Eficácia plena: aplicabilidade direta, imediata e integral.", "E": "Admitem restrição por lei; daí o nome 'contida' (ou restringível)."}, "fundamento": "Doutrina – José Afonso da Silva", "pegadinha": "Troca de conceito vizinho (contida × limitada).", "prob_tema": 0.08, "verificar": false}, {"id": "CON-015", "disciplina": "Constitucional", "tema": "Segurança pública na Constituição", "subtema": "Guardas municipais", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o art. 144 da Constituição Federal, que trata da segurança pública, assinale a afirmativa CORRETA.", "alternativas": {"A": "Os Municípios poderão constituir polícias militares municipais, subordinadas diretamente ao prefeito.", "B": "Os Municípios poderão constituir guardas municipais para proteção de seus bens, serviços e instalações.", "C": "Os Municípios poderão constituir guardas municipais, com competência exclusiva para o policiamento ostensivo.", "D": "Os Municípios poderão constituir guardas municipais, vinculadas ao comando da Polícia Federal.", "E": "Os Municípios deverão obrigatoriamente constituir guardas municipais, com atribuição de polícia judiciária local."}, "gabarito": "B", "comentario_correta": "Art. 144, § 8º: os Municípios poderão constituir guardas municipais destinadas à proteção de seus bens, serviços e instalações, conforme dispuser a lei.", "por_que_cada_errada": {"A": "Polícias militares são estaduais.", "B": "Esta é a alternativa a ser marcada.", "C": "Policiamento ostensivo é atribuição das polícias militares.", "D": "Não há essa vinculação.", "E": "A criação é facultativa; polícia judiciária cabe às polícias civis e à PF."}, "fundamento": "CF/88, art. 144, § 8º", "pegadinha": "'Obrigatoriamente' e atribuições de outras forças.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-016", "disciplina": "Constitucional", "tema": "Sistema tributário nacional", "subtema": "Espécies tributárias", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "O município pretende cobrar pela coleta domiciliar de lixo e pelo licenciamento sanitário de estabelecimentos. Considerando o art. 145 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "Os municípios podem instituir impostos vinculados ao custeio específico da coleta de lixo e do licenciamento sanitário.", "B": "Os municípios não podem instituir taxas, pois essa espécie tributária é de competência exclusiva da União.", "C": "Os municípios podem instituir contribuição de melhoria para custear a coleta de lixo e o licenciamento sanitário.", "D": "Os municípios podem instituir taxas pelo poder de polícia ou por serviços públicos específicos e divisíveis.", "E": "Os municípios podem instituir taxas com base de cálculo idêntica à de impostos, como o valor venal do imóvel."}, "gabarito": "D", "comentario_correta": "Art. 145: União, Estados, DF e Municípios poderão instituir: I – impostos; II – taxas, em razão do exercício do poder de polícia ou pela utilização, efetiva ou potencial, de serviços públicos específicos e divisíveis; III – contribuição de melhoria, decorrente de obras públicas. § 2º: taxas não poderão ter base de cálculo própria de impostos.", "por_que_cada_errada": {"A": "A vinculação de receita de impostos a despesa é, em regra, vedada; o caso é de taxa.", "B": "Taxas são de competência comum dos entes (art. 145, II).", "C": "Contribuição de melhoria decorre de obra pública que valoriza imóvel.", "D": "Esta é a alternativa a ser marcada.", "E": "O art. 145, § 2º, veda que taxas tenham base de cálculo própria de impostos."}, "fundamento": "CF/88, art. 145", "pegadinha": "Troca entre espécies tributárias.", "prob_tema": 0.04, "verificar": false}, {"id": "CON-017", "disciplina": "Constitucional", "tema": "Organização dos Poderes", "subtema": "Medidas provisórias", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o regime das medidas provisórias previsto no art. 62 da Constituição Federal, assinale a afirmativa CORRETA.", "alternativas": {"A": "É permitida a edição de medida provisória sobre nacionalidade, cidadania e direitos políticos, em caso de urgência.", "B": "É permitida a edição de medida provisória sobre matéria reservada a lei complementar, em caso de urgência.", "C": "É vedada a edição de medida provisória sobre direito penal, processual penal e processual civil.", "D": "É vedada a edição de medida provisória por prazo superior a trinta dias, improrrogáveis.", "E": "É vedada a edição de medida provisória sobre qualquer matéria tributária, inclusive impostos."}, "gabarito": "C", "comentario_correta": "Art. 62, § 1º, I, 'b': é vedada a edição de MP sobre direito penal, processual penal e processual civil. III: matéria reservada a lei complementar. § 3º: perdem eficácia se não convertidas em 60 dias, prorrogável uma vez por igual período.", "por_que_cada_errada": {"A": "O art. 62, § 1º, I, 'a', veda MP sobre essas matérias.", "B": "É vedada sobre matéria reservada a lei complementar.", "C": "Esta é a alternativa a ser marcada.", "D": "A vigência é de 60 dias, prorrogável uma vez por igual período.", "E": "MP pode tratar de impostos, observada a anterioridade (art. 62, § 2º)."}, "fundamento": "CF/88, art. 62, §§ 1º a 3º", "pegadinha": "Ressalvas inexistentes e troca de prazo.", "prob_tema": 0.12, "verificar": false}, {"id": "INF-001", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Referência absoluta", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "No Excel, a célula B1 contém o valor da diária (R$ 150). Em A2:A10 há a quantidade de dias de cada servidor, e a fórmula de B2 será copiada até B10 para calcular o total de cada um. Assinale a afirmativa CORRETA.", "alternativas": {"A": "A fórmula adequada em B2 é =A2*B1, pois o Excel ajusta B1 automaticamente para o valor correto em cada linha.", "B": "A fórmula adequada em B2 é =A2*$B$1, pois a referência absoluta mantém fixa a célula da diária ao copiar.", "C": "A fórmula adequada em B2 é =A2*#B#1, pois o símbolo # fixa linha e coluna da célula referenciada.", "D": "A fórmula adequada em B2 é =SOMA(A2:B1), pois a função soma multiplica a quantidade pelo valor da diária.", "E": "A fórmula adequada em B2 é =$A$2*B1, pois a referência absoluta deve recair sobre a quantidade de dias."}, "gabarito": "B", "comentario_correta": "O $ antes da coluna e da linha ($B$1) torna a referência absoluta: ao copiar a fórmula, A2 se ajusta (A3, A4…) e $B$1 permanece fixo.", "por_que_cada_errada": {"A": "Copiada, B1 viraria B2, B3… e o cálculo ficaria errado.", "B": "Esta é a alternativa a ser marcada.", "C": "O símbolo de referência absoluta no Excel é $.", "D": "SOMA adiciona valores; não multiplica.", "E": "A célula que deve ficar fixa é a da diária, não a quantidade."}, "fundamento": "Microsoft Excel – referências relativas e absolutas", "pegadinha": "Fixar a célula errada ou usar símbolo errado.", "prob_tema": 0.1795, "verificar": false}, {"id": "INF-002", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Função SE", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em uma planilha do Excel em português, a coluna C traz a nota da prova objetiva de cada candidato. Deseja-se exibir em D2 'Aprovado' se a nota em C2 for maior ou igual a 70 e 'Eliminado' caso contrário. Assinale a afirmativa CORRETA.", "alternativas": {"A": "A fórmula adequada é =SE(C2>=70;\"Aprovado\";\"Eliminado\"), com ponto e vírgula separando os argumentos.", "B": "A fórmula adequada é =SE(\"Aprovado\";C2>=70;\"Eliminado\"), pois o primeiro argumento é o valor verdadeiro.", "C": "A fórmula adequada é =SE(C2>=70;Aprovado;Eliminado), pois textos dispensam aspas em funções lógicas.", "D": "A fórmula adequada é =SE(C2>70;\"Aprovado\";\"Eliminado\"), pois o operador > inclui a nota 70.", "E": "A fórmula adequada é =CONT.SE(C2>=70;\"Aprovado\";\"Eliminado\"), pois a função conta os aprovados."}, "gabarito": "A", "comentario_correta": "Sintaxe em PT-BR: =SE(teste_lógico;valor_se_verdadeiro;valor_se_falso). Textos entre aspas; >= inclui o valor limite.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "O primeiro argumento é o teste lógico.", "C": "Textos devem estar entre aspas.", "D": "O operador > exclui o 70; o correto é >=.", "E": "CONT.SE conta células que atendem a critério; não retorna textos condicionais."}, "fundamento": "Microsoft Excel – função SE", "pegadinha": "Operador > × >= e ordem dos argumentos.", "prob_tema": 0.1795, "verificar": false}, {"id": "INF-003", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "CONT.SE e MÉDIA", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Em planilha do Excel, o intervalo A1:A20 contém os valores 'Apto' ou 'Inapto' de laudos periciais. Assinale a afirmativa CORRETA sobre a função que conta quantos laudos são 'Apto'.", "alternativas": {"A": "A fórmula =SOMA(A1:A20;\"Apto\") retorna o número de células do intervalo cujo conteúdo é 'Apto'.", "B": "A fórmula =CONT.VALORES(\"Apto\";A1:A20) retorna o número de células do intervalo cujo conteúdo é 'Apto'.", "C": "A fórmula =CONT.NÚM(A1:A20;\"Apto\") retorna o número de células do intervalo cujo conteúdo é 'Apto'.", "D": "A fórmula =MÉDIA(A1:A20;\"Apto\") retorna o número de células do intervalo cujo conteúdo é 'Apto'.", "E": "A fórmula =CONT.SE(A1:A20;\"Apto\") retorna o número de células do intervalo cujo conteúdo é 'Apto'."}, "gabarito": "E", "comentario_correta": "CONT.SE(intervalo;critério) conta as células que atendem ao critério. CONT.VALORES conta não vazias; CONT.NÚM conta números.", "por_que_cada_errada": {"A": "SOMA adiciona números; não conta textos por critério.", "B": "CONT.VALORES conta células não vazias, sem critério.", "C": "CONT.NÚM conta células com números e não aceita critério.", "D": "MÉDIA calcula média aritmética de números.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Microsoft Excel – funções de contagem", "pegadinha": "Funções de contagem parecidas.", "prob_tema": 0.1795, "verificar": false}, {"id": "INF-004", "disciplina": "Informática", "tema": "Aplicativos de escritório", "subtema": "Atalhos do Word em PT-BR", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "No Microsoft Word em português do Brasil, com configuração padrão, assinale a afirmativa CORRETA sobre teclas de atalho.", "alternativas": {"A": "O atalho Ctrl+N aplica negrito ao texto selecionado, e Ctrl+B salva o documento.", "B": "O atalho Ctrl+S aplica negrito ao texto selecionado, e Ctrl+B salva o documento.", "C": "O atalho Ctrl+N cria um novo documento em branco, e Ctrl+B salva o documento.", "D": "O atalho Ctrl+B aplica negrito ao texto selecionado, e Ctrl+N salva o documento.", "E": "O atalho Ctrl+I aplica negrito ao texto selecionado, e Ctrl+S salva o documento."}, "gabarito": "A", "comentario_correta": "Word PT-BR: Ctrl+N negrito; Ctrl+I itálico; Ctrl+S sublinhado; Ctrl+B salvar; Ctrl+O novo; Ctrl+A abrir; Ctrl+P imprimir; Ctrl+T selecionar tudo; Ctrl+E centralizar; Ctrl+J justificar.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Ctrl+S é sublinhado no Word PT-BR.", "C": "Ctrl+N é negrito; novo documento é Ctrl+O.", "D": "Inversão: na versão PT-BR, Ctrl+N é negrito e Ctrl+B é salvar.", "E": "Ctrl+I é itálico; Ctrl+S é sublinhado."}, "fundamento": "Microsoft Word – atalhos (versão em português)", "pegadinha": "Confusão com os atalhos da versão em inglês (Ctrl+B = bold).", "prob_tema": 0.1282, "verificar": true}, {"id": "INF-005", "disciplina": "Informática", "tema": "Conceitos de sistemas operacionais", "subtema": "Atalhos do Windows", "dificuldade": 1, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "No Windows 10/11, com configuração padrão, assinale a afirmativa CORRETA sobre teclas de atalho.", "alternativas": {"A": "A combinação Windows+L abre o Explorador de Arquivos, exibindo as unidades e pastas do computador.", "B": "A combinação Windows+L bloqueia a sessão, exigindo nova autenticação para retomar o uso.", "C": "A combinação Windows+L minimiza todas as janelas e exibe a área de trabalho do usuário.", "D": "A combinação Windows+L abre o Gerenciador de Tarefas, permitindo encerrar programas travados.", "E": "A combinação Windows+L abre as Configurações do sistema, permitindo alterar preferências."}, "gabarito": "B", "comentario_correta": "Windows+L bloqueia; Windows+E abre o Explorador; Windows+D mostra a área de trabalho; Windows+I abre Configurações; Ctrl+Shift+Esc abre o Gerenciador de Tarefas.", "por_que_cada_errada": {"A": "O Explorador é Windows+E.", "B": "Esta é a alternativa a ser marcada.", "C": "Exibir a área de trabalho é Windows+D.", "D": "Gerenciador de Tarefas é Ctrl+Shift+Esc.", "E": "Configurações é Windows+I."}, "fundamento": "Microsoft Windows – atalhos de teclado", "pegadinha": "Atalhos com a tecla Windows confundíveis.", "prob_tema": 0.0513, "verificar": false}, {"id": "INF-006", "disciplina": "Informática", "tema": "Conceitos sobre armazenamento e gerenciamento de arquivos", "subtema": "Exclusão permanente", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Servidora selecionou no Explorador de Arquivos do Windows um arquivo com dados de periciandos, em disco local, e pressionou Shift+Delete, confirmando a ação. Assinale a afirmativa CORRETA.", "alternativas": {"A": "O arquivo é enviado à Lixeira, podendo ser restaurado à pasta original a qualquer momento.", "B": "O arquivo é ocultado, permanecendo no disco, mas invisível no Explorador até nova configuração.", "C": "O arquivo é excluído sem passar pela Lixeira, não podendo ser restaurado por ela.", "D": "O arquivo é renomeado, recebendo a extensão .bak para indicar que se trata de cópia de segurança.", "E": "O arquivo é copiado para a área de transferência, sendo excluído apenas após ser colado em outro local."}, "gabarito": "C", "comentario_correta": "Delete envia à Lixeira (em discos locais); Shift+Delete exclui permanentemente, sem passar pela Lixeira.", "por_que_cada_errada": {"A": "Shift+Delete ignora a Lixeira.", "B": "Ocultar é atributo de propriedades.", "C": "Esta é a alternativa a ser marcada.", "D": "Renomear é F2.", "E": "Isso descreve recortar (Ctrl+X)."}, "fundamento": "Microsoft Windows – gerenciamento de arquivos", "pegadinha": "Confundir com recortar/ocultar.", "prob_tema": 0.0256, "verificar": false}, {"id": "INF-007", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Malwares", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando os tipos de códigos maliciosos, assinale a afirmativa CORRETA.", "alternativas": {"A": "O ransomware disfarça-se de programa legítimo para instalar funções maliciosas sem o conhecimento do usuário.", "B": "O ransomware torna os dados inacessíveis, geralmente por criptografia, e exige resgate para liberá-los.", "C": "O ransomware registra as teclas digitadas pelo usuário para capturar senhas e enviá-las a terceiros.", "D": "O ransomware mantém acesso remoto oculto ao equipamento, permitindo o retorno do invasor posteriormente.", "E": "O ransomware propaga-se automaticamente pela rede sem precisar de arquivo hospedeiro, explorando vulnerabilidades."}, "gabarito": "B", "comentario_correta": "Ransomware: sequestra dados (criptografa) e exige resgate. Worm: se propaga sozinho. Trojan: disfarça-se de programa legítimo. Keylogger: captura teclas. Backdoor: acesso remoto oculto.", "por_que_cada_errada": {"A": "Isso é cavalo de troia (trojan).", "B": "Esta é a alternativa a ser marcada.", "C": "Isso é keylogger (tipo de spyware).", "D": "Isso é backdoor.", "E": "Isso é worm."}, "fundamento": "Cartilha de Segurança para Internet (CERT.br)", "pegadinha": "Troca entre malwares.", "prob_tema": 0.2564, "verificar": false}, {"id": "INF-008", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Phishing", "dificuldade": 1, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Servidor recebeu e-mail com logotipo do banco solicitando que clicasse em link para 'atualizar dados cadastrais' em até 24 horas, sob pena de bloqueio da conta. Assinale a afirmativa CORRETA.", "alternativas": {"A": "Trata-se de ataque de negação de serviço, que torna indisponível o servidor de e-mail institucional.", "B": "Trata-se de tentativa de phishing, golpe que só ocorre por e-mail, sendo impossível por SMS ou aplicativo.", "C": "Trata-se de backup automático, procedimento do banco para resguardar os dados do correntista.", "D": "Trata-se de spam legítimo, comunicação comercial autorizada que não oferece risco ao usuário.", "E": "Trata-se de tentativa de phishing, golpe que usa mensagens falsas para obter dados pessoais."}, "gabarito": "E", "comentario_correta": "Phishing: tentativa de obter dados pessoais/financeiros por mensagens que se passam por instituições conhecidas, frequentemente com senso de urgência.", "por_que_cada_errada": {"A": "Negação de serviço (DoS) sobrecarrega serviços; não é o caso.", "B": "Phishing ocorre por vários canais (smishing, mensagens etc.).", "C": "Backup não exige que o usuário clique em links.", "D": "A mensagem induz a fornecer dados sob ameaça: phishing.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Cartilha de Segurança para Internet (CERT.br)", "pegadinha": "Absoluto ('só ocorre por e-mail').", "prob_tema": 0.2564, "verificar": false}, {"id": "INF-009", "disciplina": "Informática", "tema": "Ferramentas de backup e recuperação de dados", "subtema": "Backup incremental × diferencial", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando os tipos de backup, assinale a afirmativa CORRETA.", "alternativas": {"A": "O backup diferencial copia apenas os arquivos alterados desde o último backup de qualquer tipo, sendo o mais rápido de restaurar.", "B": "O backup incremental copia todos os arquivos alterados desde o último backup completo, exigindo, na restauração, apenas o último incremental.", "C": "O backup incremental copia só o que mudou desde o último backup de qualquer tipo, exigindo o completo e todos os incrementais.", "D": "O backup incremental copia todos os arquivos do sistema a cada execução, independentemente de alteração.", "E": "O backup completo copia apenas os arquivos alterados, sendo dispensável para restaurar os backups incrementais."}, "gabarito": "C", "comentario_correta": "Completo: copia tudo. Incremental: alterados desde o último backup (completo ou incremental) — backup rápido, restauração mais trabalhosa. Diferencial: alterados desde o último completo — restauração exige o completo + o último diferencial.", "por_que_cada_errada": {"A": "Diferencial copia o alterado desde o último COMPLETO.", "B": "Isso descreve o diferencial (e o diferencial exige o completo + o último diferencial).", "C": "Esta é a alternativa a ser marcada.", "D": "Isso é o backup completo (full).", "E": "O completo copia tudo e é a base da restauração."}, "fundamento": "Segurança da informação – políticas de backup", "pegadinha": "Troca incremental × diferencial.", "prob_tema": 0.0513, "verificar": false}, {"id": "INF-010", "disciplina": "Informática", "tema": "Conceitos sobre protocolos de comunicação na internet", "subtema": "Protocolos de e-mail", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando os protocolos utilizados no serviço de correio eletrônico, assinale a afirmativa CORRETA.", "alternativas": {"A": "O SMTP é usado no envio de mensagens, enquanto o IMAP permite acessar e sincronizar as mensagens mantidas no servidor.", "B": "O SMTP é usado no recebimento de mensagens, enquanto o POP3 sincroniza pastas entre vários dispositivos.", "C": "O HTTP é usado no envio de mensagens, enquanto o FTP permite acessar e sincronizar as mensagens mantidas no servidor.", "D": "O POP3 é usado no envio de mensagens, enquanto o DNS permite acessar e sincronizar as mensagens mantidas no servidor.", "E": "O IMAP é usado no envio de mensagens, enquanto o SMTP permite acessar e sincronizar as mensagens no servidor."}, "gabarito": "A", "comentario_correta": "SMTP: envio. POP3: recebimento, geralmente baixando as mensagens para o dispositivo. IMAP: acesso às mensagens no servidor, sincronizando entre dispositivos.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "SMTP envia; POP3 tende a baixar mensagens, sem sincronizar pastas.", "C": "HTTP é para páginas web; FTP para transferência de arquivos.", "D": "POP3 recebe; DNS resolve nomes.", "E": "Inversão: SMTP envia; IMAP acessa/sincroniza."}, "fundamento": "Redes de computadores – protocolos de aplicação", "pegadinha": "Inversão de funções entre protocolos.", "prob_tema": 0.0513, "verificar": false}, {"id": "INF-011", "disciplina": "Informática", "tema": "E-mail e comunicação eletrônica no ambiente corporativo", "subtema": "Cópia oculta (CCO)", "dificuldade": 1, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "A coordenação da perícia vai enviar convocação por e-mail a 40 periciandos e não deseja que um destinatário veja o endereço dos demais. Assinale a afirmativa CORRETA.", "alternativas": {"A": "Os endereços devem ser incluídos no campo CCO, que, porém, os revela a quem responde a todos.", "B": "Os endereços devem ser incluídos no campo CC (com cópia), que impede a visualização dos demais destinatários.", "C": "Os endereços devem ser incluídos no campo Para, que oculta automaticamente os destinatários após o envio.", "D": "Os endereços devem ser incluídos no campo CCO (cópia oculta), que impede a visualização dos demais destinatários.", "E": "Os endereços devem ser incluídos no campo Assunto, separados por ponto e vírgula, para manter o sigilo."}, "gabarito": "D", "comentario_correta": "CCO (Cco/Bcc): os destinatários não aparecem para os demais. CC: cópia visível.", "por_que_cada_errada": {"A": "Destinatários em CCO não são revelados a quem responde a todos.", "B": "No campo CC os endereços ficam visíveis a todos.", "C": "O campo Para exibe os destinatários.", "D": "Esta é a alternativa a ser marcada.", "E": "O campo Assunto não é campo de destinatário."}, "fundamento": "Correio eletrônico – campos de endereçamento", "pegadinha": "Troca CC × CCO.", "prob_tema": 0.0513, "verificar": false}, {"id": "INF-012", "disciplina": "Informática", "tema": "Noções de computação em nuvem", "subtema": "Modelos de serviço", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando os modelos de serviço de computação em nuvem, assinale a afirmativa CORRETA.", "alternativas": {"A": "No modelo IaaS, o usuário utiliza o software pronto pela internet, sem gerenciar a infraestrutura em que ele roda.", "B": "No modelo SaaS, o usuário contrata servidores virtuais e gerencia o sistema operacional e as aplicações instaladas.", "C": "No modelo PaaS, o usuário recebe apenas o hardware físico, devendo instalá-lo em suas próprias dependências.", "D": "No modelo SaaS, o usuário utiliza o software pronto pela internet, sem gerenciar a infraestrutura subjacente.", "E": "No modelo SaaS, o usuário é responsável pela manutenção física dos servidores do provedor de nuvem."}, "gabarito": "D", "comentario_correta": "IaaS: infraestrutura (máquinas virtuais, armazenamento). PaaS: plataforma de desenvolvimento/execução. SaaS: software pronto acessado pela internet (ex.: webmail, suítes online).", "por_que_cada_errada": {"A": "Isso descreve SaaS.", "B": "Isso descreve IaaS.", "C": "PaaS oferece plataforma para desenvolver e implantar aplicações.", "D": "Esta é a alternativa a ser marcada.", "E": "A infraestrutura é responsabilidade do provedor."}, "fundamento": "Computação em nuvem – NIST SP 800-145", "pegadinha": "Troca entre IaaS, PaaS e SaaS.", "prob_tema": 0.0256, "verificar": false}, {"id": "INF-013", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "LGPD – dado sensível", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "O setor de perícia mantém planilhas com nome, CPF e diagnósticos (CID) dos servidores avaliados. Considerando a Lei Geral de Proteção de Dados (Lei nº 13.709/2018), assinale a afirmativa CORRETA.", "alternativas": {"A": "Dados referentes à saúde são dados pessoais sensíveis, cujo tratamento depende sempre do consentimento do titular.", "B": "Dados referentes à saúde são dados pessoais comuns, equiparados ao nome e ao endereço para fins de proteção legal.", "C": "Dados referentes à saúde são dados pessoais sensíveis, cujo tratamento exige hipóteses legais específicas.", "D": "Dados referentes à saúde podem ser compartilhados livremente entre setores, desde que anonimizados apenas pelo CPF.", "E": "Dados referentes à saúde ficam fora do alcance da LGPD quando tratados pelo poder público em suas atividades."}, "gabarito": "C", "comentario_correta": "Art. 5º, II, da LGPD: dado pessoal sensível inclui dado referente à saúde. Art. 11: hipóteses de tratamento de dados sensíveis, com e sem consentimento.", "por_que_cada_errada": {"A": "O art. 11 prevê hipóteses sem consentimento (ex.: cumprimento de obrigação legal, tutela da saúde).", "B": "A LGPD classifica dado de saúde como sensível (art. 5º, II).", "C": "Esta é a alternativa a ser marcada.", "D": "Retirar só o CPF não anonimiza; o compartilhamento exige base legal.", "E": "O poder público também se submete à LGPD, com regras próprias."}, "fundamento": "Lei 13.709/2018 (LGPD), arts. 5º, II, e 11", "pegadinha": "'Sempre do consentimento' e exclusão indevida do poder público.", "prob_tema": 0.2564, "verificar": false}, {"id": "PER-001", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "DID, DII e carência", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Segurado com primeira filiação ao RGPS em março de 2025 requer auxílio por incapacidade temporária em agosto de 2025. Documentos mostram lombalgia desde 2023 (DID); em julho de 2025 surgiu hérnia discal extrusa com déficit motor, fixada como DII. Não há acidente nem doença isenta de carência. Considerando a Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "O ponto decisivo é o agravamento: comprovada a progressão da doença, fica dispensada a carência de doze contribuições mensais.", "B": "O ponto decisivo é a DID: fixada a doença em 2023, o perito deve indeferir por preexistência, sendo irrelevante a data da incapacidade.", "C": "O ponto decisivo é a preexistência: a doença anterior à filiação impede sempre o benefício, mesmo que a incapacidade decorra de agravamento.", "D": "O ponto decisivo é a DER: a incapacidade deve ser fixada na data do requerimento, momento em que a carência já teria sido cumprida.", "E": "O ponto decisivo é a carência: sem doze contribuições e fora das hipóteses de isenção, o agravamento não basta para o benefício."}, "gabarito": "E", "comentario_correta": "Auxílio por incapacidade temporária exige, em regra, carência de 12 contribuições (art. 25, I). A preexistência só não é óbice quando a incapacidade decorre de progressão ou agravamento (art. 59, § 1º), mas isso não supre a carência. Lombalgia/hérnia não está no rol de isenção.", "por_que_cada_errada": {"A": "Agravamento afasta a vedação da preexistência, mas não dispensa a carência.", "B": "O que define o direito é a DII; a DID isolada não basta.", "C": "O art. 59, § 1º, ressalva a incapacidade que sobrevém por progressão ou agravamento.", "D": "A DII é fixada pela evidência médica, não pela DER; e a carência não estaria cumprida.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Lei 8.213/1991, arts. 25, I; 26, II; 59, § 1º; 151", "pegadinha": "Misturar preexistência e carência: o agravamento resolve uma, não a outra.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-002", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "Isenção de carência", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Segurada filiada ao RGPS há quatro meses recebe diagnóstico de carcinoma de mama, iniciado após a filiação, e fica incapacitada durante a quimioterapia. Considerando a Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "A neoplasia maligna dispensa a carência apenas quando a incapacidade for permanente, exigindo-se doze contribuições para benefício temporário.", "B": "A neoplasia maligna dispensa a carência mesmo quando já existente antes da filiação ao RGPS, sem qualquer ressalva legal.", "C": "A neoplasia maligna não integra o rol de doenças que dispensam carência, exigindo-se doze contribuições na data da incapacidade.", "D": "A neoplasia maligna acometida após a filiação dispensa a carência, sendo devido o benefício se presente a incapacidade.", "E": "A neoplasia maligna dispensa a carência, sendo devido o benefício independentemente da constatação de incapacidade laboral."}, "gabarito": "D", "comentario_correta": "Art. 26, II: independe de carência o auxílio por incapacidade temporária e a aposentadoria por incapacidade permanente ao segurado que, após filiar-se ao RGPS, for acometido de alguma das doenças do art. 151 (entre elas, neoplasia maligna).", "por_que_cada_errada": {"A": "A isenção vale para auxílio por incapacidade temporária e aposentadoria por incapacidade permanente.", "B": "A isenção exige que o segurado seja acometido após filiar-se (art. 26, II).", "C": "Neoplasia maligna integra o rol do art. 151.", "D": "Esta é a alternativa a ser marcada.", "E": "A isenção afasta a carência, não a exigência de incapacidade."}, "fundamento": "Lei 8.213/1991, arts. 26, II, e 151", "pegadinha": "Isenção de carência ≠ dispensa de incapacidade; exige acometimento após a filiação.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-003", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "Auxílio-acidente – segurados", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Motorista de aplicativo, contribuinte individual, sofreu acidente doméstico com amputação da falange distal do indicador dominante. Após consolidação, há redução da capacidade para a atividade habitual, sem incapacidade total. Considerando a Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "O segurado não faz jus ao auxílio-acidente, pois o benefício só é devido quando o acidente tem natureza ocupacional.", "B": "O segurado faz jus ao auxílio-acidente, desde que tenha cumprido carência de doze contribuições mensais antes do acidente.", "C": "O segurado não faz jus ao auxílio-acidente, pois a amputação de falange não configura sequela consolidada indenizável.", "D": "O segurado não faz jus ao auxílio-acidente, pois o benefício não alcança o contribuinte individual, embora dispense carência.", "E": "O segurado faz jus ao auxílio-acidente, pois o benefício alcança todos os segurados do RGPS que sofram acidente de qualquer natureza."}, "gabarito": "D", "comentario_correta": "O auxílio-acidente é devido, como indenização, após consolidação das lesões decorrentes de acidente de qualquer natureza que resultem em sequela redutora da capacidade (art. 86), independe de carência (art. 26, I) e só é concedido a empregado, empregado doméstico, trabalhador avulso e segurado especial (art. 18, § 1º).", "por_que_cada_errada": {"A": "O auxílio-acidente é devido por acidente de qualquer natureza; o óbice é a categoria de segurado.", "B": "O auxílio-acidente independe de carência e não alcança o contribuinte individual.", "C": "A sequela descrita reduz a capacidade; o óbice é a categoria de segurado.", "D": "Esta é a alternativa a ser marcada.", "E": "O art. 18, § 1º, restringe o auxílio-acidente a empregado, doméstico, avulso e segurado especial."}, "fundamento": "Lei 8.213/1991, arts. 18, § 1º; 26, I; 86", "pegadinha": "Atribuir o óbice ao motivo errado (natureza do acidente ou carência).", "prob_tema": 0.04, "verificar": false}, {"id": "PER-004", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "Auxílio-acidente – natureza", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o auxílio-acidente disciplinado no art. 86 da Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "O benefício tem natureza indenizatória, é concedido após a consolidação das lesões e permite ao segurado continuar trabalhando.", "B": "O benefício tem natureza indenizatória, mas só é concedido quando a sequela gera incapacidade total para o trabalho.", "C": "O benefício tem natureza indenizatória, é concedido após a consolidação e corresponde a 100% do salário de benefício.", "D": "O benefício tem natureza assistencial, é concedido independentemente de filiação e cessa quando o segurado volta a trabalhar.", "E": "O benefício tem natureza substitutiva da renda, é concedido durante o tratamento e impede o retorno do segurado ao trabalho."}, "gabarito": "A", "comentario_correta": "Art. 86: auxílio-acidente concedido como indenização quando, após consolidação das lesões decorrentes de acidente de qualquer natureza, resultarem sequelas que impliquem redução da capacidade para o trabalho habitual. § 1º: 50% do salário de benefício.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Exige redução da capacidade, não incapacidade total.", "C": "Corresponde a 50% do salário de benefício.", "D": "É previdenciário, exige qualidade de segurado e não cessa pelo retorno ao trabalho.", "E": "É indenizatório, posterior à consolidação, e compatível com o trabalho."}, "fundamento": "Lei 8.213/1991, art. 86", "pegadinha": "Confundir com benefício por incapacidade (substitutivo de renda).", "prob_tema": 0.04, "verificar": false}, {"id": "PER-005", "disciplina": "Perícia", "tema": "Avaliação de invalidez e incapacidade permanente", "subtema": "Acréscimo de 25%", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Aposentado por incapacidade permanente após AVC evoluiu com hemiplegia e afasia, necessitando de ajuda de terceiros para alimentação e higiene. O valor de sua aposentadoria já está no teto do RGPS. Considerando a Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "Necessitando de assistência permanente de outra pessoa, faz jus ao acréscimo de 25%, limitado, porém, ao teto do RGPS.", "B": "Necessitando de assistência de terceiros, faz jus ao acréscimo de 50%, devido a qualquer aposentado do RGPS em igual situação.", "C": "Necessitando de assistência permanente de outra pessoa, faz jus ao acréscimo de 25%, que se incorpora à pensão por morte.", "D": "Necessitando de assistência permanente de outra pessoa, faz jus ao acréscimo de 25%, devido ainda que o valor ultrapasse o teto.", "E": "Necessitando de assistência de terceiros, não faz jus a acréscimo, pois a dependência funcional já integra a incapacidade permanente."}, "gabarito": "D", "comentario_correta": "Art. 45: o valor da aposentadoria por incapacidade permanente do segurado que necessitar da assistência permanente de outra pessoa será acrescido de 25%. Parágrafo único: devido ainda que o valor atinja o limite máximo legal; recalculado com o benefício; cessa com a morte, não se incorporando à pensão.", "por_que_cada_errada": {"A": "O art. 45, parágrafo único, 'a', admite superar o teto.", "B": "O percentual é 25% e a lei o prevê para a aposentadoria por incapacidade permanente.", "C": "O acréscimo cessa com a morte e não se incorpora à pensão (art. 45, parágrafo único, 'c').", "D": "Esta é a alternativa a ser marcada.", "E": "O acréscimo existe justamente para a dependência de terceiros."}, "fundamento": "Lei 8.213/1991, art. 45; Decreto 3.048/1999, Anexo I", "pegadinha": "'Limitado ao teto' e 'incorpora à pensão'.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-006", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "Art. 101 – tratamento facultativo", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em revisão de auxílio por incapacidade temporária, segurado com hérnia discal recusa a cirurgia indicada pelo assistente, mas mantém fisioterapia. O perito cogita cessar o benefício pela recusa. Considerando a Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "A recusa à cirurgia não autoriza a cessação, mas obriga a conversão automática em aposentadoria por incapacidade permanente.", "B": "A recusa à cirurgia não autoriza a cessação, e o segurado fica também dispensado de comparecer aos exames periciais periódicos.", "C": "A recusa à cirurgia autoriza a cessação, pois o segurado é obrigado a submeter-se a todo tratamento prescrito pelo médico assistente.", "D": "A recusa à cirurgia não autoriza a cessação, pois o tratamento cirúrgico e a transfusão de sangue são facultativos ao segurado.", "E": "A recusa à cirurgia autoriza a cessação imediata, salvo se o segurado apresentar segunda opinião médica contrária à indicação."}, "gabarito": "D", "comentario_correta": "Art. 101: o segurado em gozo de benefício por incapacidade está obrigado a submeter-se a exame médico, a processo de reabilitação profissional e a tratamento gratuito, exceto o cirúrgico e a transfusão de sangue, que são facultativos.", "por_que_cada_errada": {"A": "Não há conversão automática; mantém-se a avaliação da incapacidade.", "B": "O comparecimento ao exame médico continua obrigatório.", "C": "O art. 101 excetua o tratamento cirúrgico e a transfusão, que são facultativos.", "D": "Esta é a alternativa a ser marcada.", "E": "A cirurgia é facultativa independentemente de segunda opinião."}, "fundamento": "Lei 8.213/1991, art. 101", "pegadinha": "Generalizar a obrigação de tratamento.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-007", "disciplina": "Perícia", "tema": "Incapacidade temporária / permanente", "subtema": "DCB e prazo estimado", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando as regras da Lei nº 8.213/1991 sobre a duração do auxílio por incapacidade temporária, assinale a afirmativa CORRETA.", "alternativas": {"A": "Sempre que possível, o ato de concessão fixa prazo estimado; na ausência, o benefício é mantido até nova perícia.", "B": "Sempre que possível, o ato de concessão fixa prazo estimado, que não pode ser prorrogado ainda que persista a incapacidade.", "C": "Em nenhuma hipótese o ato de concessão fixa prazo, cabendo ao segurado solicitar a cessação quando recuperar a capacidade.", "D": "Sempre que possível, o ato de concessão fixa prazo estimado; na ausência, o benefício cessa após 60 dias, vedada a prorrogação.", "E": "Sempre que possível, o ato de concessão fixa prazo estimado; na ausência, o benefício cessa após 120 dias, salvo pedido de prorrogação."}, "gabarito": "E", "comentario_correta": "Art. 60, § 8º: sempre que possível, o ato de concessão ou reativação judicial ou administrativa deverá fixar o prazo estimado para a duração do benefício. § 9º: na ausência de fixação, o benefício cessará após 120 dias, exceto se o segurado requerer a prorrogação.", "por_que_cada_errada": {"A": "Sem prazo fixado, cessa após 120 dias, ressalvada a prorrogação.", "B": "O segurado pode requerer prorrogação.", "C": "A lei manda fixar prazo estimado sempre que possível.", "D": "O prazo supletivo é de 120 dias e a prorrogação é admitida.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Lei 8.213/1991, art. 60, §§ 8º e 9º", "pegadinha": "Troca do prazo supletivo e vedação inexistente de prorrogação.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-008", "disciplina": "Perícia", "tema": "Avaliação da capacidade laborativa", "subtema": "Incapacidade uniprofissional", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Pedreiro de 38 anos com ruptura completa do manguito rotador do ombro dominante, em pós-operatório, está incapaz para elevar o membro acima da cabeça e carregar peso; o ortopedista prevê recuperação em seis meses. Considerando a avaliação da capacidade laborativa, assinale a afirmativa CORRETA.", "alternativas": {"A": "Há capacidade preservada, pois o segurado pode exercer outra atividade compatível, ainda que não a habitual.", "B": "Há incapacidade total e temporária, devendo o segurado ser encaminhado de imediato à reabilitação para nova profissão.", "C": "Há incapacidade parcial e permanente, devendo ser concedido desde logo o auxílio-acidente pela redução da capacidade.", "D": "Há incapacidade total e temporária para a atividade habitual, com prognóstico de recuperação em alguns meses.", "E": "Há incapacidade total e permanente para qualquer atividade, pois a lesão no membro dominante inviabiliza o trabalho manual."}, "gabarito": "D", "comentario_correta": "A incapacidade é avaliada em relação à atividade habitual (art. 59). Com prognóstico definido de recuperação, a incapacidade é temporária; a reabilitação (art. 62) é indicada quando o segurado é insuscetível de recuperação para a atividade habitual.", "por_que_cada_errada": {"A": "O auxílio por incapacidade temporária considera a atividade habitual (art. 59).", "B": "Com prognóstico de retorno à atividade habitual, reabilitação não é indicada agora.", "C": "Auxílio-acidente exige consolidação das lesões; ainda há tratamento em curso.", "D": "Esta é a alternativa a ser marcada.", "E": "O prognóstico é de recuperação em 6 meses: temporária e restrita à atividade habitual."}, "fundamento": "Lei 8.213/1991, arts. 59, 62 e 86", "pegadinha": "Antecipar consolidação ou reabilitação; confundir atividade habitual com qualquer atividade.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-009", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "Reabilitação profissional", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Motorista de caminhão com epilepsia refratária e crises mensais, apesar de tratamento otimizado, tem 38 anos, ensino médio e boa capacidade cognitiva. Considerando a Lei nº 8.213/1991 e a avaliação pericial, assinale a afirmativa CORRETA.", "alternativas": {"A": "Há incapacidade apenas para dirigir veículos leves, mantendo-se a aptidão para veículos de carga com acompanhante.", "B": "Há incapacidade total e permanente para qualquer atividade, devendo ser concedida desde logo a aposentadoria.", "C": "Há capacidade plena para a atividade habitual, pois a epilepsia controlada parcialmente não impede a direção profissional.", "D": "Há incapacidade para a atividade habitual sem perspectiva de retorno, sendo indicada reabilitação profissional para atividade sem risco.", "E": "Há incapacidade temporária para a atividade habitual, devendo o benefício ser mantido até o controle total das crises."}, "gabarito": "D", "comentario_correta": "Art. 62: o segurado em gozo de auxílio por incapacidade temporária, insuscetível de recuperação para sua atividade habitual, deverá submeter-se a processo de reabilitação profissional para outra atividade. A aposentadoria (art. 42) pressupõe impossibilidade de reabilitação para atividade que garanta a subsistência.", "por_que_cada_errada": {"A": "O risco é maior na direção de veículos de carga.", "B": "Jovem, escolarizado e sem déficit cognitivo: é suscetível de reabilitação para atividade sem risco.", "C": "Crises mensais refratárias contraindicam direção profissional.", "D": "Esta é a alternativa a ser marcada.", "E": "Refratariedade com tratamento otimizado afasta a perspectiva de retorno à direção."}, "fundamento": "Lei 8.213/1991, arts. 42 e 62", "pegadinha": "Saltar da incapacidade para a atividade habitual direto para a aposentadoria.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-010", "disciplina": "Perícia", "tema": "Doenças ocupacionais e relacionadas ao trabalho", "subtema": "Art. 20, § 1º – exclusões", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Trabalhador rural de 61 anos, com gonartrose bilateral, requer reconhecimento de doença do trabalho. Não há registro de exposição específica que tenha contribuído diretamente para o agravo. Considerando a Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "A doença degenerativa ou inerente a grupo etário não é doença do trabalho, salvo prova de contribuição direta do trabalho.", "B": "A doença degenerativa é considerada doença profissional, por ser peculiar à atividade rural segundo o regulamento.", "C": "A doença degenerativa é considerada doença do trabalho quando gera incapacidade, independentemente de nexo com a atividade.", "D": "A doença degenerativa é sempre considerada doença do trabalho quando o segurado exerce atividade que exige esforço físico.", "E": "A doença degenerativa nunca pode ter relação com o trabalho, sendo vedada a análise de concausa pelo perito."}, "gabarito": "A", "comentario_correta": "Art. 20, § 1º: não são consideradas doença do trabalho a degenerativa, a inerente a grupo etário, a que não produza incapacidade laborativa e a endêmica (salvo exposição pela natureza do trabalho). O art. 21, I, equipara a acidente o agravo para o qual o trabalho contribuiu diretamente, ainda que não seja causa única (concausa).", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Gonartrose não é doença profissional típica da atividade rural.", "C": "Incapacidade não substitui o nexo.", "D": "O art. 20, § 1º, 'a' e 'b', exclui degenerativas e inerentes ao grupo etário.", "E": "A concausa (art. 21, I) pode ser analisada quando o trabalho contribui diretamente."}, "fundamento": "Lei 8.213/1991, arts. 20, § 1º, e 21, I", "pegadinha": "Absolutos opostos: 'sempre' × 'nunca'.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-011", "disciplina": "Perícia", "tema": "Doenças ocupacionais e relacionadas ao trabalho", "subtema": "Doença endêmica", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Agente de combate às endemias que realizava busca ativa em área de mata contraiu leishmaniose tegumentar, doença endêmica na região. Considerando o art. 20 da Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "A doença endêmica é considerada doença do trabalho desde que o trabalhador resida fora da área endêmica.", "B": "A doença endêmica só é considerada doença do trabalho se constar da lista de doenças profissionais da CLT.", "C": "A doença endêmica pode ser doença do trabalho quando decorre de exposição determinada pela natureza do trabalho.", "D": "A doença endêmica é sempre considerada doença do trabalho para servidores públicos que atuam na região.", "E": "A doença endêmica nunca é considerada doença do trabalho, por ser adquirida por qualquer habitante da região."}, "gabarito": "C", "comentario_correta": "Art. 20, § 1º, 'd': não é considerada doença do trabalho a doença endêmica adquirida por segurado habitante de região em que ela se desenvolva, salvo comprovação de que resultou de exposição ou contato direto determinado pela natureza do trabalho.", "por_que_cada_errada": {"A": "O local de residência não é o critério.", "B": "A ressalva legal independe dessa lista.", "C": "Esta é a alternativa a ser marcada.", "D": "O critério é a exposição pela natureza do trabalho, não o vínculo público.", "E": "A lei ressalva a exposição ou contato direto determinado pela natureza do trabalho."}, "fundamento": "Lei 8.213/1991, art. 20, § 1º, 'd'", "pegadinha": "Regra geral apresentada sem a exceção legal.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-012", "disciplina": "Perícia", "tema": "Nexo técnico epidemiológico", "subtema": "NTEP – presunção e contestação", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Bancária afastada por transtorno depressivo teve o benefício caracterizado como acidentário pelo NTEP, embora a empresa não tenha emitido CAT. A empresa discorda. Considerando o art. 21-A da Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "O NTEP depende da emissão prévia da CAT pela empresa, sem a qual a perícia não pode caracterizar a natureza acidentária.", "B": "O NTEP gera presunção relativa, a partir do cruzamento CNAE × CID, que a empresa pode contestar com efeito suspensivo.", "C": "O NTEP decorre da avaliação individual do posto de trabalho pelo perito, dispensando dados estatísticos de adoecimento.", "D": "O NTEP gera presunção relativa, mas o requerimento de não aplicação pela empresa não tem efeito suspensivo.", "E": "O NTEP gera presunção absoluta a partir da relação entre a atividade da empresa e o CID, sendo vedada qualquer contestação pela empresa."}, "gabarito": "B", "comentario_correta": "Art. 21-A: a perícia médica do INSS considerará caracterizada a natureza acidentária quando constatar nexo técnico epidemiológico entre o trabalho e o agravo, decorrente da relação entre a atividade da empresa e a entidade mórbida (CID). § 1º: deixa de aplicar quando demonstrada a inexistência. § 2º: a empresa pode requerer a não aplicação, com efeito suspensivo, cabendo recurso ao CRPS.", "por_que_cada_errada": {"A": "O NTEP independe de CAT; decorre do cruzamento CNAE × CID.", "B": "Esta é a alternativa a ser marcada.", "C": "É nexo epidemiológico, fundado em dados estatísticos (CNAE × CID); a perícia pode afastá-lo no caso concreto.", "D": "O § 2º prevê efeito suspensivo.", "E": "A presunção é relativa; a empresa pode requerer a não aplicação (§ 2º)."}, "fundamento": "Lei 8.213/1991, art. 21-A; Decreto 3.048/1999, art. 337 e Anexo II, Lista C", "pegadinha": "Absoluta × relativa; vincular NTEP à CAT.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-013", "disciplina": "Perícia", "tema": "Doenças ocupacionais e relacionadas ao trabalho", "subtema": "CAT – prazos e legitimados", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Operário sofreu queda de andaime numa sexta-feira à tarde, sem óbito. A empresa não emitiu a CAT, e o médico que o atendeu no pronto-socorro pretende emiti-la. Considerando o art. 22 da Lei nº 8.213/1991, assinale a afirmativa CORRETA.", "alternativas": {"A": "A empresa deveria comunicar até o primeiro dia útil seguinte; na sua falta, o sindicato pode emitir a CAT em até 48 horas.", "B": "A empresa deveria comunicar até o primeiro dia útil seguinte; na falta, o médico assistente pode emitir a CAT, sem prazo.", "C": "A empresa deveria comunicar em até quinze dias; na sua falta, apenas o próprio acidentado pode emitir a CAT, observado igual prazo.", "D": "A empresa deveria comunicar até o primeiro dia útil seguinte; na sua falta, a CAT só pode ser emitida por ordem judicial.", "E": "A empresa deveria comunicar de imediato; na sua falta, o médico assistente fica impedido de emitir a CAT por sigilo profissional."}, "gabarito": "B", "comentario_correta": "Art. 22: a empresa comunicará o acidente à Previdência até o 1º dia útil seguinte ao da ocorrência e, em caso de morte, de imediato. § 2º: na falta, podem formalizá-la o acidentado, seus dependentes, a entidade sindical, o médico que o assistiu ou qualquer autoridade pública, não prevalecendo o prazo.", "por_que_cada_errada": {"A": "Os demais legitimados não estão sujeitos a esse prazo.", "B": "Esta é a alternativa a ser marcada.", "C": "O prazo é o primeiro dia útil seguinte; vários legitimados podem emitir, sem prazo.", "D": "O § 2º legitima acidentado, dependentes, sindicato, médico e autoridade pública.", "E": "Imediata é a comunicação em caso de morte; o médico assistente é legitimado."}, "fundamento": "Lei 8.213/1991, art. 22", "pegadinha": "Troca de prazos e de legitimados.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-014", "disciplina": "Perícia", "tema": "Avaliação de dano corporal e nexo causal", "subtema": "Critérios de nexo causal", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em perícia judicial cível, o autor atribui lombociatalgia crônica a colisão traseira de baixa energia ocorrida há dois anos; exames anteriores ao evento já mostravam discopatia multinível. Considerando os critérios médico-legais de nexo causal, assinale a afirmativa CORRETA.", "alternativas": {"A": "O nexo é estabelecido pelo relato do periciando, cabendo ao perito apenas quantificar o dano decorrente do evento.", "B": "O nexo é presumido sempre que o periciando apresenta exame de imagem alterado após o evento traumático alegado.", "C": "O nexo exige apenas a relação cronológica entre o evento e o início dos sintomas, sendo dispensável a análise do estado anterior.", "D": "O nexo exige adequação entre trauma e lesão, coerência topográfica e cronológica e exclusão de causa estranha.", "E": "O nexo exige adequação entre trauma e lesão, sendo a existência de doença prévia suficiente, por si só, para afastá-lo."}, "gabarito": "D", "comentario_correta": "Critérios clássicos (Simonin / Muller-Cordonnier): natureza adequada do traumatismo e da lesão, adequação entre sede do trauma e da lesão, encadeamento anatomoclínico, adequação temporal, exclusão de causa estranha e consideração do estado anterior.", "por_que_cada_errada": {"A": "O nexo é conclusão técnica do perito, não do relato.", "B": "Alteração posterior pode ser preexistente/degenerativa.", "C": "Cronologia isolada não basta; o estado anterior é central.", "D": "Esta é a alternativa a ser marcada.", "E": "Estado anterior pode configurar concausa ou agravamento; não afasta automaticamente."}, "fundamento": "Medicina Legal – avaliação do dano corporal (critérios de nexo de causalidade)", "pegadinha": "'Por si só' e 'apenas' em critérios cumulativos.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-015", "disciplina": "Perícia", "tema": "Avaliação de dano corporal e nexo causal", "subtema": "Concausas", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Na avaliação do dano corporal, o perito frequentemente identifica fatores que concorrem com o evento principal para o resultado. Assinale a afirmativa CORRETA sobre as concausas.", "alternativas": {"A": "As concausas são sempre preexistentes ao evento e, quando presentes, afastam o nexo entre o evento e o resultado.", "B": "As concausas são sempre supervenientes ao evento e transferem integralmente a responsabilidade pelo resultado a terceiros.", "C": "As concausas podem ser preexistentes, concomitantes ou supervenientes, sem afastar necessariamente o nexo com o evento.", "D": "As concausas restringem-se a fatores patológicos do periciando, excluídos fatores externos como infecção hospitalar.", "E": "As concausas só são relevantes no âmbito penal, sendo desconsideradas na perícia previdenciária e trabalhista."}, "gabarito": "C", "comentario_correta": "Concausa é fator que, somado à causa principal, concorre para o resultado; classifica-se em preexistente, concomitante ou superveniente. Na Lei 8.213 (art. 21, I), o trabalho que contribuiu diretamente, sem ser causa única, caracteriza acidente.", "por_que_cada_errada": {"A": "Podem ser preexistentes, concomitantes ou supervenientes, e não afastam necessariamente o nexo.", "B": "Não são só supervenientes nem transferem automaticamente a responsabilidade.", "C": "Esta é a alternativa a ser marcada.", "D": "Fatores externos supervenientes (ex.: infecção) podem ser concausas.", "E": "No acidentário, o art. 21, I, da Lei 8.213 trata da concausalidade."}, "fundamento": "Medicina Legal; Lei 8.213/1991, art. 21, I", "pegadinha": "'Sempre' e 'restringem-se'.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-016", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "BPC – deficiência × incapacidade", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Criança de 6 anos com transtorno do espectro autista, com necessidade de suporte substancial na comunicação e nas atividades diárias, tem pedido de BPC. Considerando a Lei nº 8.742/1993 (LOAS), assinale a afirmativa CORRETA.", "alternativas": {"A": "A avaliação verifica incapacidade para o trabalho e para a vida independente, sendo inviável o benefício a menores de 16 anos.", "B": "A avaliação verifica impedimento de curto prazo, bastando a duração mínima de seis meses para a concessão do benefício.", "C": "A avaliação verifica impedimento de longo prazo em interação com barreiras, sem exigir incapacidade para o trabalho.", "D": "A avaliação verifica impedimento de longo prazo, sendo realizada exclusivamente pela perícia médica, sem avaliação social.", "E": "A avaliação verifica impedimento de longo prazo, dispensando-se a análise da renda familiar quando o diagnóstico é confirmado."}, "gabarito": "C", "comentario_correta": "Art. 20, § 2º: pessoa com deficiência é aquela com impedimento de longo prazo de natureza física, mental, intelectual ou sensorial que, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade. § 10: longo prazo = mínimo de 2 anos. § 6º: avaliação médica e social.", "por_que_cada_errada": {"A": "O conceito vigente é de impedimento de longo prazo em interação com barreiras; crianças podem receber.", "B": "Longo prazo é de no mínimo dois anos (art. 20, § 10).", "C": "Esta é a alternativa a ser marcada.", "D": "A avaliação é médica e social (art. 20, § 6º).", "E": "O critério de renda continua exigido."}, "fundamento": "Lei 8.742/1993, art. 20, §§ 2º, 6º e 10", "pegadinha": "Confundir incapacidade laboral (RGPS) com deficiência (BPC).", "prob_tema": 0.04, "verificar": false}, {"id": "PER-017", "disciplina": "Perícia", "tema": "Perícia médica previdenciária", "subtema": "BPC – requisitos", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o Benefício de Prestação Continuada previsto no art. 20 da Lei nº 8.742/1993, assinale a afirmativa CORRETA.", "alternativas": {"A": "O benefício garante um salário mínimo à pessoa com deficiência e ao idoso com 60 anos ou mais, exigida contribuição prévia ao RGPS.", "B": "O benefício garante meio salário mínimo à pessoa com deficiência e ao idoso com 65 anos ou mais, cumulável com aposentadoria.", "C": "O benefício garante um salário mínimo à pessoa com deficiência, desde que comprovada incapacidade total para os atos da vida civil.", "D": "O benefício garante um salário mínimo ao idoso com 65 anos ou mais, sendo a pessoa com deficiência atendida pelo RGPS.", "E": "O benefício garante um salário mínimo à pessoa com deficiência e ao idoso de 65 anos ou mais sem meios de se manter."}, "gabarito": "E", "comentario_correta": "Art. 20: o BPC é a garantia de um salário mínimo mensal à pessoa com deficiência e ao idoso com 65 anos ou mais que comprovem não possuir meios de prover a própria manutenção nem de tê-la provida por sua família.", "por_que_cada_errada": {"A": "A idade é 65 anos e não há exigência de contribuição (benefício assistencial).", "B": "O valor é de um salário mínimo e, em regra, não é cumulável com outro benefício da seguridade.", "C": "Não se exige incapacidade civil; exige-se impedimento de longo prazo.", "D": "A pessoa com deficiência é destinatária do BPC.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Lei 8.742/1993, art. 20", "pegadinha": "Troca de idade (60 × 65) e exigência de contribuição.", "prob_tema": 0.04, "verificar": false}, {"id": "PER-018", "disciplina": "Perícia", "tema": "Bioética aplicada à perícia médica", "subtema": "CEM – perito do próprio paciente", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Perita médica do município é designada para avaliar servidor que ela acompanhou como psiquiatra assistente no ano anterior. Considerando o Código de Ética Médica (Res. CFM nº 2.217/2018), assinale a afirmativa CORRETA.", "alternativas": {"A": "É permitido ao médico ser perito de seu próprio paciente, pois o conhecimento prévio do caso aumenta a precisão do laudo.", "B": "É vedado ao médico ser perito de seu próprio paciente, devendo a perita declarar-se impedida para a avaliação.", "C": "É permitido ao médico ser perito de seu próprio paciente, desde que o periciando concorde por escrito com a avaliação.", "D": "É vedado ao médico ser perito de seu próprio paciente apenas na perícia judicial, sendo permitido na perícia administrativa.", "E": "É vedado ao médico ser perito de seu próprio paciente apenas enquanto mantido o tratamento, cessando a vedação após a alta."}, "gabarito": "B", "comentario_correta": "Art. 93: é vedado ao médico ser perito ou auditor do próprio paciente, de pessoa de sua família ou de qualquer outra com a qual tenha relações capazes de influir em seu trabalho ou de empresa em que atue ou tenha atuado.", "por_que_cada_errada": {"A": "O art. 93 veda expressamente.", "B": "Esta é a alternativa a ser marcada.", "C": "A concordância do periciando não afasta a vedação.", "D": "A vedação ética alcança qualquer função pericial.", "E": "A relação assistencial prévia compromete a isenção; o caso exige declarar-se impedida."}, "fund

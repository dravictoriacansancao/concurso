al", "comando": "CORRETA", "texto": null, "enunciado": "Ao elaborar a programação anual, a gestora municipal utilizou dados de mortalidade e morbidade para definir prioridades e distribuir recursos entre as unidades. Considerando os princípios do art. 7º da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "A conduta concretiza o princípio da participação da comunidade, já que dados de morbidade substituem a deliberação do Conselho.", "B": "A conduta concretiza o princípio da utilização da epidemiologia, que se restringe à vigilância e não orienta a alocação de recursos.", "C": "A conduta concretiza o princípio da universalidade, pois o uso de dados epidemiológicos assegura acesso a todos os níveis de atenção.", "D": "A conduta viola o princípio da igualdade da assistência, pois priorizar territórios por dados epidemiológicos cria privilégios.", "E": "A conduta concretiza o princípio da utilização da epidemiologia para definir prioridades, alocar recursos e orientar a programação."}, "gabarito": "E", "comentario_correta": "Art. 7º, VII: utilização da epidemiologia para o estabelecimento de prioridades, a alocação de recursos e a orientação programática.", "por_que_cada_errada": {"A": "Dados não substituem a deliberação do Conselho; o caso é do inciso VII.", "B": "O inciso VII inclui expressamente a alocação de recursos.", "C": "Universalidade é acesso em todos os níveis (inciso I); o caso descreve o inciso VII.", "D": "Priorizar por critério epidemiológico é princípio legal, não privilégio.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Lei 8.080/1990, art. 7º, VII", "pegadinha": "'Restringe-se' tira parte do conteúdo do princípio.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-014", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Art. 9º – direção única", "dificuldade": 1, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Conforme o art. 9º da Lei nº 8.080/1990, a direção do SUS é única e exercida, em cada esfera de governo, por órgão específico. Assinale a afirmativa CORRETA quanto ao âmbito municipal.", "alternativas": {"A": "No âmbito dos municípios, a direção do SUS é exercida pela respectiva Secretaria de Saúde ou órgão equivalente.", "B": "No âmbito dos municípios, a direção do SUS é exercida pelo Conselho Municipal de Saúde, em caráter permanente e deliberativo.", "C": "No âmbito dos municípios, a direção do SUS é exercida pela Comissão Intergestores Bipartite, em conjunto com o prefeito.", "D": "No âmbito dos municípios, a direção do SUS é exercida pela Secretaria Estadual de Saúde, por meio de suas regionais.", "E": "No âmbito dos municípios, a direção do SUS é exercida pelo Ministério da Saúde, mediante delegação ao prefeito municipal."}, "gabarito": "A", "comentario_correta": "Art. 9º: a direção do SUS é exercida, no âmbito da União, pelo Ministério da Saúde; nos Estados e DF, pela Secretaria de Saúde ou órgão equivalente; nos Municípios, pela Secretaria de Saúde ou órgão equivalente.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "O Conselho delibera e fiscaliza, mas a DIREÇÃO é da Secretaria de Saúde.", "C": "A CIB é foro de pactuação entre gestores, não órgão de direção.", "D": "Cada esfera tem sua direção própria.", "E": "O Ministério da Saúde dirige o SUS no âmbito da União."}, "fundamento": "Lei 8.080/1990, art. 9º, III", "pegadinha": "Confundir instância de controle social (Conselho) ou de pactuação (CIB) com direção.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-015", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Art. 18 – competências municipais", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "A Lei nº 8.080/1990 distribui competências entre as direções nacional, estadual e municipal do SUS. Assinale a afirmativa CORRETA quanto a competência da direção MUNICIPAL.", "alternativas": {"A": "Compete à direção municipal definir e coordenar os sistemas de redes integradas de assistência de alta complexidade em âmbito nacional.", "B": "Compete à direção municipal formular, avaliar e apoiar as políticas de alimentação e nutrição em âmbito nacional.", "C": "Compete à direção municipal executar os serviços de vigilância epidemiológica e sanitária e de saúde do trabalhador.", "D": "Compete à direção municipal estabelecer normas e executar a vigilância sanitária de portos, aeroportos e fronteiras do país.", "E": "Compete à direção municipal promover a descentralização para os municípios dos serviços e das ações de saúde do estado."}, "gabarito": "C", "comentario_correta": "Art. 18, IV: compete à direção municipal executar serviços de vigilância epidemiológica, vigilância sanitária, alimentação e nutrição, saneamento básico e saúde do trabalhador.", "por_que_cada_errada": {"A": "Competência da direção NACIONAL (art. 16, III).", "B": "Competência da direção NACIONAL (art. 16, I).", "C": "Esta é a alternativa a ser marcada.", "D": "Competência da direção NACIONAL (art. 16, VII); o município apenas colabora (art. 18, IX).", "E": "Competência da direção ESTADUAL (art. 17, I)."}, "fundamento": "Lei 8.080/1990, arts. 16, 17 e 18, IV", "pegadinha": "Inversão de competência entre União, Estado e Município.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-016", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Art. 18 – contratos com prestadores", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "O município pretende ampliar a oferta de fisioterapia contratando clínicas privadas e precisa definir quem celebra os contratos e acompanha sua execução. Considerando a Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "Compete à direção estadual celebrar contratos com prestadores privados situados no município, cabendo a este apenas indicar a demanda.", "B": "Compete ao Ministério da Saúde celebrar contratos com prestadores privados, por ser a direção nacional responsável pela remuneração.", "C": "Compete à direção municipal celebrar contratos com prestadores privados, ficando o controle da execução a cargo do Conselho de Saúde.", "D": "Compete à direção municipal celebrar contratos com prestadores privados, desde que estes renunciem à fiscalização municipal.", "E": "Compete à direção municipal celebrar contratos e convênios com prestadores privados, bem como controlar e avaliar sua execução."}, "gabarito": "E", "comentario_correta": "Art. 18, X: celebrar contratos e convênios com entidades prestadoras de serviços privados de saúde, bem como controlar e avaliar sua execução; XI: controlar e fiscalizar os procedimentos dos serviços privados de saúde.", "por_que_cada_errada": {"A": "O art. 18, X, atribui a celebração e o controle à direção municipal.", "B": "O MS define critérios e valores de remuneração (art. 26), mas não celebra os contratos locais.", "C": "O controle e a avaliação da execução também cabem à direção municipal (art. 18, X).", "D": "O art. 18, XI, atribui ao município controlar e fiscalizar os serviços privados.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Lei 8.080/1990, art. 18, X e XI", "pegadinha": "Atribuir parte da competência (o controle) a outro ator.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-017", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Art. 17 – direção estadual", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando as competências da direção ESTADUAL do SUS previstas no art. 17 da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "Compete à direção estadual prestar apoio técnico e financeiro aos municípios e executar supletivamente ações de saúde.", "B": "Compete à direção estadual executar diretamente a atenção primária em todos os municípios, substituindo a gestão local.", "C": "Compete à direção estadual celebrar contratos com prestadores privados de cada município, controlando sua execução.", "D": "Compete à direção estadual prestar apoio técnico aos municípios, sendo-lhe vedado o apoio financeiro às gestões locais.", "E": "Compete à direção estadual definir, em caráter exclusivo, as normas nacionais de vigilância sanitária de portos e aeroportos."}, "gabarito": "A", "comentario_correta": "Art. 17, III: prestar apoio técnico e financeiro aos Municípios e executar supletivamente ações e serviços de saúde. O inciso I prevê promover a descentralização para os Municípios.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "A atenção primária é de execução municipal; o Estado atua supletivamente.", "C": "Competência municipal (art. 18, X).", "D": "O art. 17, III, prevê apoio técnico E financeiro.", "E": "Competência da direção nacional (art. 16, VII)."}, "fundamento": "Lei 8.080/1990, art. 17, I e III", "pegadinha": "'Vedado' e 'em caráter exclusivo' em competências compartilhadas.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-018", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Art. 14-A – CIT e CIB", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "A Lei nº 8.080/1990, com redação da Lei nº 12.466/2011, reconhece as Comissões Intergestores Bipartite e Tripartite. Assinale a afirmativa CORRETA sobre essas comissões.", "alternativas": {"A": "As comissões intergestores são foros de negociação e pactuação entre gestores quanto aos aspectos operacionais do SUS.", "B": "As comissões intergestores são foros de pactuação entre gestores, cujas decisões dependem de homologação pelo Poder Legislativo.", "C": "As comissões intergestores são foros de fiscalização dos prestadores privados, com poder de aplicar sanções contratuais.", "D": "As comissões intergestores são órgãos de direção do SUS, substituindo as secretarias de saúde nas decisões executivas.", "E": "As comissões intergestores são instâncias de controle social, com participação paritária de usuários e prestadores de serviço."}, "gabarito": "A", "comentario_correta": "Art. 14-A: as Comissões Intergestores Bipartite e Tripartite são reconhecidas como foros de negociação e pactuação entre gestores, quanto aos aspectos operacionais do SUS.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Não há essa exigência de homologação legislativa.", "C": "Fiscalizar prestadores é atribuição da direção do SUS na respectiva esfera.", "D": "A direção é única em cada esfera e cabe às secretarias.", "E": "Controle social é exercido por Conselhos e Conferências; as comissões reúnem gestores."}, "fundamento": "Lei 8.080/1990, art. 14-A", "pegadinha": "Confundir pactuação entre gestores com controle social.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-019", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Arts. 24 a 26 – participação complementar", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Diante de filas para cirurgias eletivas, o município decidiu contratar serviços privados. Duas entidades se apresentaram: uma filantrópica e uma empresa com fins lucrativos. Considerando os arts. 24 a 26 da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "A contratação é possível independentemente da capacidade da rede pública, com preferência à proposta de menor preço.", "B": "A contratação é possível quando a rede for insuficiente, dispensando os contratados de observar os princípios do SUS.", "C": "A contratação é vedada à empresa com fins lucrativos, que não pode participar do SUS sob nenhuma forma.", "D": "A contratação é possível quando a rede for insuficiente, cabendo ao município fixar livremente os valores de remuneração.", "E": "A contratação é possível se a rede for insuficiente, com preferência às entidades filantrópicas e sem fins lucrativos."}, "gabarito": "E", "comentario_correta": "Art. 24: quando as disponibilidades forem insuficientes, o SUS poderá recorrer aos serviços da iniciativa privada. Art. 25: preferência às filantrópicas e sem fins lucrativos. Art. 26: critérios e valores de remuneração estabelecidos pela direção nacional e aprovados no CNS.", "por_que_cada_errada": {"A": "O art. 24 condiciona a complementaridade à insuficiência da rede para garantir a cobertura.", "B": "Os contratados submetem-se às normas técnicas, administrativas e aos princípios do SUS (art. 26, § 2º).", "C": "Ela pode participar complementarmente; o que se veda é subvenção (CF, art. 199, § 2º).", "D": "Critérios e valores são estabelecidos pela direção nacional e aprovados no Conselho Nacional de Saúde (art. 26).", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Lei 8.080/1990, arts. 24, 25 e 26", "pegadinha": "Condicionais falsas ('independentemente', 'livremente', 'dispensando').", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-020", "disciplina": "SUS", "tema": "Financiamento", "subtema": "Art. 33 – conta especial e fiscalização", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando a gestão financeira prevista na Lei nº 8.080/1990, assinale a afirmativa CORRETA sobre a movimentação dos recursos financeiros do SUS.", "alternativas": {"A": "Os recursos são depositados na conta única do Tesouro municipal, sendo movimentados livremente pelo prefeito.", "B": "Os recursos são depositados em conta especial em cada esfera e movimentados sob fiscalização dos Conselhos de Saúde.", "C": "Os recursos são depositados em conta especial e movimentados sob fiscalização exclusiva do Tribunal de Contas da União.", "D": "Os recursos são depositados em conta especial, cabendo ao Conselho de Saúde executá-los diretamente em substituição ao gestor.", "E": "Os recursos são depositados em conta especial apenas na esfera federal, sendo transferidos aos municípios sem vinculação."}, "gabarito": "B", "comentario_correta": "Art. 33: os recursos financeiros do SUS serão depositados em conta especial, em cada esfera de sua atuação, e movimentados sob fiscalização dos respectivos Conselhos de Saúde.", "por_que_cada_errada": {"A": "A lei exige conta especial e fiscalização do Conselho.", "B": "Esta é a alternativa a ser marcada.", "C": "A fiscalização prevista no art. 33 é a dos respectivos Conselhos de Saúde (sem prejuízo do controle externo).", "D": "O Conselho fiscaliza; a execução é do gestor.", "E": "A conta especial existe em cada esfera de atuação e os recursos são vinculados à saúde."}, "fundamento": "Lei 8.080/1990, art. 33", "pegadinha": "Trocar o fiscal (Conselho) por outro órgão ou dar ao Conselho papel executivo.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-021", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Art. 36 – planejamento ascendente", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o processo de planejamento e orçamento do SUS previsto no art. 36 da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "O planejamento é ascendente, mas restrito ao nível estadual, ao qual cabe consolidar e aprovar os planos municipais.", "B": "O planejamento é descendente, do nível federal até o local, cabendo aos municípios executar as metas definidas pela União.", "C": "O planejamento é ascendente, desconsiderando a disponibilidade de recursos para não limitar as necessidades da população.", "D": "O planejamento é ascendente, do nível local ao federal, ouvidos os órgãos deliberativos e compatibilizado com os recursos.", "E": "O planejamento é ascendente, do nível local até o federal, dispensada a oitiva dos conselhos quando houver urgência orçamentária."}, "gabarito": "D", "comentario_correta": "Art. 36: o processo de planejamento e orçamento do SUS será ascendente, do nível local até o federal, ouvidos seus órgãos deliberativos, compatibilizando-se as necessidades da política de saúde com a disponibilidade de recursos em planos de saúde dos Municípios, Estados, DF e União.", "por_que_cada_errada": {"A": "O processo vai do nível local até o federal.", "B": "A lei define processo ASCENDENTE.", "C": "O art. 36 manda compatibilizar necessidades e disponibilidade de recursos.", "D": "Esta é a alternativa a ser marcada.", "E": "A oitiva dos órgãos deliberativos integra o processo; não há essa dispensa."}, "fundamento": "Lei 8.080/1990, art. 36", "pegadinha": "Ascendente × descendente; 'dispensada a oitiva'.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-022", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Art. 19-J – acompanhante no parto", "dificuldade": 1, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em maternidade conveniada ao SUS, a equipe impediu a entrada do companheiro de uma parturiente durante o trabalho de parto, alegando que o acompanhante só seria permitido após o nascimento. Considerando a Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "A parturiente tem direito a um acompanhante apenas no pós-parto imediato, a critério da equipe assistencial do serviço.", "B": "A parturiente tem direito a um acompanhante durante o parto, desde que seja parente de primeiro grau indicado pela equipe.", "C": "A parturiente tem direito a acompanhante somente em serviços próprios do SUS, não alcançando a rede conveniada.", "D": "A parturiente tem direito a um acompanhante de sua escolha durante o trabalho de parto, o parto e o pós-parto imediato.", "E": "A parturiente tem direito a um acompanhante durante o trabalho de parto, sendo-lhe vedada a presença na sala de parto."}, "gabarito": "D", "comentario_correta": "Art. 19-J: os serviços de saúde do SUS, da rede própria ou conveniada, ficam obrigados a permitir a presença, junto à parturiente, de 1 acompanhante durante todo o período de trabalho de parto, parto e pós-parto imediato, indicado pela parturiente.", "por_que_cada_errada": {"A": "O direito abrange todo o período: trabalho de parto, parto e pós-parto imediato.", "B": "O acompanhante é de livre indicação da parturiente.", "C": "A regra vale para serviços do SUS, da rede própria ou conveniada.", "D": "Esta é a alternativa a ser marcada.", "E": "O direito inclui o parto."}, "fundamento": "Lei 8.080/1990, art. 19-J (Lei 11.108/2005)", "pegadinha": "Restrição temporal ('apenas', 'somente') e de quem indica.", "prob_tema": 0.2667, "verificar": false}, {"id": "SUS-023", "disciplina": "SUS", "tema": "Lei nº 8.080/1990", "subtema": "Arts. 19-Q e 19-R – incorporação de tecnologias", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Uma sociedade médica solicitou a incorporação de um novo medicamento ao SUS. Considerando os arts. 19-Q e 19-R da Lei nº 8.080/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "A incorporação é atribuição do Ministério da Saúde, sendo dispensado o registro prévio do medicamento na ANVISA.", "B": "A incorporação é atribuição do Ministério da Saúde, assessorado pela CONITEC, devendo o processo ser concluído em até 90 dias, improrrogáveis.", "C": "A incorporação é atribuição de cada Secretaria Estadual, assessorada pela CONITEC, conforme a necessidade regional apurada.", "D": "A incorporação cabe ao Ministério da Saúde, assessorado pela CONITEC, em processo de até 180 dias, prorrogáveis por 90.", "E": "A incorporação é atribuição da ANVISA, assessorada pela CONITEC, devendo o processo ser concluído em até 180 dias, prorrogáveis por 90."}, "gabarito": "D", "comentario_correta": "Art. 19-Q: a incorporação, exclusão ou alteração de medicamentos, produtos e procedimentos são atribuições do Ministério da Saúde, assessorado pela CONITEC. Art. 19-R: processo concluído em até 180 dias, prorrogáveis por 90 dias.", "por_que_cada_errada": {"A": "O registro na ANVISA é requisito; o art. 19-T veda o fornecimento de medicamento sem registro.", "B": "O prazo é de 180 dias, prorrogáveis por mais 90.", "C": "A incorporação ao SUS é decisão do Ministério da Saúde.", "D": "Esta é a alternativa a ser marcada.", "E": "A atribuição é do Ministério da Saúde; a ANVISA cuida do registro sanitário."}, "fundamento": "Lei 8.080/1990, arts. 19-Q, 19-R e 19-T (Lei 12.401/2011)", "pegadinha": "Troca de órgão (MS × ANVISA) e troca de prazo.", "prob_tema": 0.2667, "verificar": true}, {"id": "SUS-024", "disciplina": "SUS", "tema": "Controle social", "subtema": "Conferência de Saúde", "dificuldade": 1, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "A Lei nº 8.142/1990 institui instâncias colegiadas em cada esfera de governo. Assinale a afirmativa CORRETA sobre a Conferência de Saúde.", "alternativas": {"A": "A Conferência de Saúde reúne-se a cada quatro anos, sendo convocada exclusivamente pelo Conselho de Saúde da respectiva esfera.", "B": "A Conferência de Saúde reúne-se a cada quatro anos, com representação dos segmentos sociais, para avaliar a situação de saúde.", "C": "A Conferência de Saúde reúne-se a cada dois anos, com representação dos vários segmentos sociais, para avaliar a situação de saúde e propor diretrizes.", "D": "A Conferência de Saúde reúne-se a cada quatro anos, com participação restrita a gestores e prestadores de serviços de saúde.", "E": "A Conferência de Saúde reúne-se em caráter permanente, com função deliberativa sobre a execução orçamentária mensal do fundo."}, "gabarito": "B", "comentario_correta": "Art. 1º, § 1º: a Conferência de Saúde reunir-se-á a cada quatro anos com a representação dos vários segmentos sociais, para avaliar a situação de saúde e propor as diretrizes para a formulação da política de saúde, convocada pelo Poder Executivo ou, extraordinariamente, por esta ou pelo Conselho de Saúde.", "por_que_cada_errada": {"A": "É convocada pelo Poder Executivo ou, extraordinariamente, pela própria Conferência ou pelo Conselho.", "B": "Esta é a alternativa a ser marcada.", "C": "A periodicidade legal é de quatro anos.", "D": "Há representação dos vários segmentos sociais, com paridade de usuários.", "E": "Caráter permanente e deliberativo é característica do Conselho."}, "fundamento": "Lei 8.142/1990, art. 1º, § 1º", "pegadinha": "Troca de prazo (4 × 2 anos) e troca de características Conferência × Conselho.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-025", "disciplina": "SUS", "tema": "Controle social", "subtema": "Conselho de Saúde – natureza", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "O Conselho Municipal de Saúde aprovou resolução sobre a reorganização da rede de atenção, mas o secretário afirmou que o colegiado seria apenas consultivo. Considerando a Lei nº 8.142/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "O Conselho tem caráter permanente e consultivo, atuando apenas na formulação de estratégias, sem controlar a execução.", "B": "O Conselho tem caráter temporário e consultivo, e suas decisões dependem de referendo da Conferência Municipal de Saúde.", "C": "O Conselho tem caráter permanente e deliberativo, e suas decisões são homologadas pelo chefe do poder em cada esfera.", "D": "O Conselho tem caráter permanente e deliberativo, e suas decisões produzem efeitos imediatos, dispensada a homologação.", "E": "O Conselho tem caráter deliberativo, mas sua atuação exclui os aspectos econômicos e financeiros da política de saúde."}, "gabarito": "C", "comentario_correta": "Art. 1º, § 2º: o Conselho de Saúde, em caráter permanente e deliberativo, atua na formulação de estratégias e no controle da execução da política de saúde, inclusive nos aspectos econômicos e financeiros, cujas decisões serão homologadas pelo chefe do poder legalmente constituído em cada esfera do governo.", "por_que_cada_errada": {"A": "Atua na formulação de estratégias E no controle da execução, inclusive nos aspectos econômicos e financeiros.", "B": "É permanente e deliberativo; não há referendo da Conferência.", "C": "Esta é a alternativa a ser marcada.", "D": "A lei prevê homologação pelo chefe do poder legalmente constituído.", "E": "O § 2º inclui expressamente os aspectos econômicos e financeiros."}, "fundamento": "Lei 8.142/1990, art. 1º, § 2º", "pegadinha": "Consultivo × deliberativo; 'dispensada a homologação'.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-026", "disciplina": "SUS", "tema": "Controle social", "subtema": "Conselho de Saúde – paridade", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "O Conselho Municipal de Saúde de um município alagoano terá 24 conselheiros titulares. Considerando a Lei nº 8.142/1990 e a Resolução CNS nº 453/2012, assinale a afirmativa CORRETA sobre sua composição.", "alternativas": {"A": "Devem ser 6 representantes de usuários, cabendo a maioria aos trabalhadores, por deterem conhecimento técnico.", "B": "Devem ser 8 representantes de usuários, 8 de trabalhadores e 8 de gestores e prestadores, em divisão igualitária por terços.", "C": "Devem ser 12 representantes de usuários e 12 dos demais segmentos (trabalhadores, gestores e prestadores).", "D": "Devem ser 12 representantes de usuários, sendo admitida a indicação de servidores da secretaria nessa vaga.", "E": "Devem ser 12 representantes de gestores, em razão de sua responsabilidade legal pela execução da política."}, "gabarito": "C", "comentario_correta": "Art. 1º, § 4º: a representação dos usuários será paritária em relação ao conjunto dos demais segmentos. A Resolução CNS 453/2012 orienta: 50% usuários, 25% trabalhadores da saúde e 25% gestores/prestadores.", "por_que_cada_errada": {"A": "Os usuários devem ser 50% do total.", "B": "A paridade é dos usuários em relação ao CONJUNTO dos demais segmentos (50%).", "C": "Esta é a alternativa a ser marcada.", "D": "Servidor com vínculo de gestão não representa usuários; a representação deve ser autônoma.", "E": "Gestores e prestadores somam 25% pela Resolução CNS 453/2012."}, "fundamento": "Lei 8.142/1990, art. 1º, § 4º; Res. CNS 453/2012", "pegadinha": "Ler 'paridade' como divisão igual por terços.", "prob_tema": 0.0667, "verificar": true}, {"id": "SUS-027", "disciplina": "SUS", "tema": "Financiamento", "subtema": "Lei 8.142 – requisitos para receber recursos", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Auditoria constatou que um município não instituiu Conselho de Saúde nem Fundo de Saúde, embora recebesse transferências federais. Considerando o art. 4º da Lei nº 8.142/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "O não atendimento dos requisitos legais implica que os recursos do município passem a ser administrados pelo respectivo Estado.", "B": "O não atendimento dos requisitos legais é suprido pela apresentação do plano de saúde, que dispensa o Fundo e o Conselho.", "C": "O não atendimento dos requisitos legais implica que os recursos passem a ser administrados diretamente pelo Conselho Nacional de Saúde.", "D": "O não atendimento dos requisitos legais implica a suspensão definitiva dos repasses, sem possibilidade de regularização.", "E": "O não atendimento dos requisitos legais implica que os recursos sejam administrados pela União, por meio do Ministério da Saúde."}, "gabarito": "A", "comentario_correta": "Art. 4º: para receber recursos, Municípios, Estados e DF devem contar com Fundo de Saúde, Conselho de Saúde paritário, plano de saúde, relatórios de gestão, contrapartida no orçamento e comissão de PCCS. Parágrafo único: o não atendimento implica a administração dos recursos pelos Estados ou pela União, respectivamente.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Os requisitos são cumulativos: Fundo, Conselho, plano, relatório de gestão, contrapartida e comissão de PCCS.", "C": "No caso de município, quem administra é o Estado.", "D": "A consequência legal é a administração dos recursos pelo Estado, não a suspensão definitiva.", "E": "União administra quando o inadimplente é o Estado; para o município, administra o Estado."}, "fundamento": "Lei 8.142/1990, art. 4º e parágrafo único", "pegadinha": "Trocar quem administra (Estado × União) e 'definitiva'.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-028", "disciplina": "SUS", "tema": "Financiamento", "subtema": "Lei 8.142 – rateio aos municípios", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando o art. 3º da Lei nº 8.142/1990, que trata do repasse dos recursos do Fundo Nacional de Saúde para a cobertura das ações e serviços de saúde, assinale a afirmativa CORRETA.", "alternativas": {"A": "Os recursos são repassados de forma regular e automática, sendo ao menos 50% aos municípios e o restante aos estados.", "B": "Os recursos são repassados mediante convênio, sendo pelo menos 70% destinados aos estados e o restante aos municípios.", "C": "Os recursos são repassados de forma regular e automática, vedada a formação de consórcios municipais para sua execução.", "D": "Os recursos são repassados de forma regular e automática, sendo pelo menos 70% destinados aos municípios e o restante aos estados.", "E": "Os recursos são repassados de forma eventual, conforme a disponibilidade de caixa da União em cada exercício financeiro."}, "gabarito": "D", "comentario_correta": "Art. 3º: os recursos serão repassados de forma regular e automática para Municípios, Estados e DF. § 2º: os recursos serão destinados, pelo menos 70%, aos Municípios, afetando-se o restante aos Estados. § 3º: municípios podem estabelecer consórcio.", "por_que_cada_errada": {"A": "O percentual mínimo é de 70% aos municípios.", "B": "O repasse é regular e automático e a maior parte (≥ 70%) vai aos municípios.", "C": "O § 3º admite consórcio entre municípios.", "D": "Esta é a alternativa a ser marcada.", "E": "O repasse é regular e automático."}, "fundamento": "Lei 8.142/1990, art. 3º, §§ 2º e 3º", "pegadinha": "Inverter destinatário do percentual e trocar 70% por 50%.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-029", "disciplina": "SUS", "tema": "Financiamento", "subtema": "LC 141/2012 – despesas não computáveis", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Para atingir o mínimo constitucional, a prefeitura pretendia computar como gasto em saúde o pagamento de aposentadorias de ex-servidores da saúde e a pavimentação da rua de acesso a uma UBS. Considerando a LC nº 141/2012, assinale a afirmativa CORRETA.", "alternativas": {"A": "Ambas as despesas podem ser computadas, desde que aprovadas pelo Conselho Municipal de Saúde no relatório anual.", "B": "Apenas as aposentadorias podem ser computadas, por se referirem a servidores que atuaram em ações de saúde.", "C": "Apenas a pavimentação pode ser computada, por beneficiar diretamente o acesso dos usuários à unidade de saúde.", "D": "Ambas as despesas podem ser computadas, pois se vinculam a servidores e a equipamentos que integram a rede municipal de saúde.", "E": "Nenhuma das despesas pode ser computada, pois a lei exclui expressamente aposentadorias e obras de infraestrutura."}, "gabarito": "E", "comentario_correta": "Art. 4º da LC 141/2012: não constituem despesas com ações e serviços públicos de saúde, entre outras, o pagamento de aposentadorias e pensões, inclusive dos servidores da saúde (I), e obras de infraestrutura, ainda que realizadas para beneficiar direta ou indiretamente a rede de saúde (IX).", "por_que_cada_errada": {"A": "Aprovação do Conselho não transforma em ASPS despesa excluída pela lei.", "B": "Aposentadorias e pensões, inclusive dos servidores da saúde, são excluídas (art. 4º, I).", "C": "Obras de infraestrutura, ainda que beneficiem a rede, são excluídas (art. 4º, IX).", "D": "O art. 4º exclui as duas hipóteses expressamente.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "LC 141/2012, art. 4º, I e IX", "pegadinha": "Justificativa 'beneficia a saúde' para despesa excluída; condicionante falsa 'desde que aprovadas'.", "prob_tema": 0.0667, "verificar": true}, {"id": "SUS-030", "disciplina": "SUS", "tema": "Indicadores e monitoramento", "subtema": "LC 141/2012 – prestação de contas", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "A LC nº 141/2012 estabelece instrumentos de transparência e prestação de contas da gestão do SUS. Assinale a afirmativa CORRETA.", "alternativas": {"A": "O gestor apresenta, até o fim de fevereiro, maio e setembro, relatório do quadrimestre anterior em audiência na Casa Legislativa.", "B": "O gestor apresenta, até o fim de março, maio e julho, relatório detalhado do trimestre anterior em sessão do Tribunal de Contas.", "C": "O gestor apresenta, anualmente, relatório de gestão diretamente ao Ministério da Saúde, dispensada a audiência pública.", "D": "O gestor apresenta, até o fim de fevereiro, maio e setembro, relatório resumido sem detalhamento, vedada a discussão pública.", "E": "O gestor apresenta, até o fim de cada mês, relatório detalhado do mês anterior em audiência pública perante o Conselho de Saúde."}, "gabarito": "A", "comentario_correta": "Art. 36, § 5º, da LC 141/2012: o gestor do SUS apresentará, até o final dos meses de maio, setembro e fevereiro, em audiência pública na Casa Legislativa do respectivo ente, o Relatório detalhado do quadrimestre anterior (RDQA).", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "Os prazos são fevereiro, maio e setembro; o período é quadrimestral; a audiência é na Casa Legislativa.", "C": "A audiência pública quadrimestral é obrigatória.", "D": "O relatório é detalhado e discutido em audiência pública.", "E": "O relatório é quadrimestral e apresentado na Casa Legislativa."}, "fundamento": "LC 141/2012, art. 36, § 5º", "pegadinha": "Troca de periodicidade (mês/trimestre) e de local (Conselho/TCE).", "prob_tema": 0.0667, "verificar": true}, {"id": "SUS-031", "disciplina": "SUS", "tema": "Gestão municipal do SUS", "subtema": "Instrumentos de planejamento", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "A nova gestão municipal precisa elaborar seus instrumentos de planejamento em saúde para o quadriênio. Considerando a legislação do SUS sobre planejamento, assinale a afirmativa CORRETA.", "alternativas": {"A": "O Plano de Saúde tem vigência quadrienal, sendo elaborado pelo Estado e apenas executado pelo município em seu território.", "B": "O Plano de Saúde tem vigência quadrienal, mas sua elaboração é facultativa para municípios com menos de 50 mil habitantes.", "C": "O Plano de Saúde tem vigência anual, dispensa a apreciação do Conselho de Saúde e é operacionalizado pelo Relatório de Gestão.", "D": "O Plano de Saúde tem vigência quadrienal, passa pelo Conselho de Saúde e é operacionalizado pelas Programações Anuais.", "E": "O Plano de Saúde tem vigência quadrienal e é aprovado pela Câmara Municipal, cabendo ao Conselho apenas tomar ciência."}, "gabarito": "D", "comentario_correta": "O Plano de Saúde, base das atividades e programações de cada nível, tem vigência de quatro anos, é submetido ao Conselho de Saúde e operacionalizado anualmente pela Programação Anual de Saúde; o Relatório Anual de Gestão apresenta os resultados.", "por_que_cada_errada": {"A": "Cada ente elabora seu plano; o processo é ascendente (Lei 8.080, art. 36).", "B": "O plano é obrigatório e requisito para recebimento de recursos (Lei 8.142, art. 4º, III).", "C": "O plano é quadrienal e passa pelo Conselho; o Relatório de Gestão presta contas, não operacionaliza.", "D": "Esta é a alternativa a ser marcada.", "E": "A aprovação do plano compete ao Conselho de Saúde (Lei 8.142, art. 1º, § 2º, e LC 141)."}, "fundamento": "Lei 8.080/1990, art. 36; Lei 8.142/1990, art. 4º, III; LC 141/2012, art. 36; Portaria de Consolidação GM/MS 1/2017", "pegadinha": "Trocar o papel de cada instrumento (Plano × PAS × RAG).", "prob_tema": 0.2667, "verificar": true}, {"id": "SUS-032", "disciplina": "SUS", "tema": "APS e ESF", "subtema": "Atributos da APS – longitudinalidade", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Na UBS, uma mesma equipe acompanha há anos a família de uma idosa hipertensa, conhecendo sua história e mantendo o vínculo ao longo do tempo, independentemente da presença de doença. Considerando os atributos da Atenção Primária, assinale a afirmativa CORRETA.", "alternativas": {"A": "A situação expressa a longitudinalidade, que se limita ao acompanhamento durante episódios agudos de doença.", "B": "A situação expressa o acesso de primeiro contato, que se caracteriza pela relação duradoura entre equipe e usuário.", "C": "A situação expressa a longitudinalidade, que pressupõe continuidade da relação de cuidado e vínculo ao longo do tempo.", "D": "A situação expressa a integralidade, que pressupõe que a mesma equipe execute todos os procedimentos de que o usuário necessite.", "E": "A situação expressa a coordenação do cuidado, que pressupõe continuidade da relação de cuidado e vínculo ao longo do tempo."}, "gabarito": "C", "comentario_correta": "Longitudinalidade: continuidade da relação de cuidado, com construção de vínculo e responsabilização entre profissionais e usuários ao longo do tempo e de modo permanente.", "por_que_cada_errada": {"A": "A longitudinalidade independe da presença de doença.", "B": "Primeiro contato é a porta de entrada preferencial a cada novo problema.", "C": "Esta é a alternativa a ser marcada.", "D": "Integralidade não exige que uma equipe execute tudo; e o caso descreve vínculo no tempo.", "E": "Coordenação é integrar e organizar o fluxo entre pontos da rede; a descrição é de longitudinalidade."}, "fundamento": "PNAB – Portaria de Consolidação GM/MS 2/2017, Anexo XXII (Portaria 2.436/2017)", "pegadinha": "Troca entre atributos vizinhos (longitudinalidade × coordenação × primeiro contato).", "prob_tema": 0.1333, "verificar": false}, {"id": "SUS-033", "disciplina": "SUS", "tema": "APS e ESF", "subtema": "ESF – população adscrita", "dificuldade": 2, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "Considerando a Política Nacional de Atenção Básica (PNAB/2017), assinale a afirmativa CORRETA quanto à população adscrita recomendada por equipe de Saúde da Família.", "alternativas": {"A": "Recomenda-se população adscrita de 1.000 a 1.500 pessoas por equipe, vedada adscrição maior em áreas urbanas.", "B": "Recomenda-se população adscrita de 2.000 a 3.500 famílias por equipe, sendo o cadastro feito por domicílio, não por pessoa.", "C": "Recomenda-se população adscrita de 2.000 a 3.500 pessoas por equipe, ajustável conforme vulnerabilidade e risco.", "D": "Recomenda-se população adscrita de 4.000 a 5.000 pessoas por equipe, independentemente da vulnerabilidade do território.", "E": "Recomenda-se população adscrita de 2.000 a 3.500 pessoas por equipe, vedado qualquer ajuste por critérios de vulnerabilidade."}, "gabarito": "C", "comentario_correta": "A PNAB/2017 recomenda população adscrita por equipe de Atenção Básica e de Saúde da Família de 2.000 a 3.500 pessoas, podendo haver parâmetros diferentes conforme especificidades, vulnerabilidade e riscos do território.", "por_que_cada_errada": {"A": "O intervalo está errado e não há essa vedação.", "B": "A referência é pessoas, não famílias.", "C": "Esta é a alternativa a ser marcada.", "D": "O intervalo recomendado é 2.000 a 3.500, ajustável conforme vulnerabilidade.", "E": "A PNAB admite parâmetros diferentes conforme risco e vulnerabilidade."}, "fundamento": "PNAB – Portaria de Consolidação GM/MS 2/2017, Anexo XXII", "pegadinha": "Trocar 'pessoas' por 'famílias' e absolutos ('vedado').", "prob_tema": 0.1333, "verificar": true}, {"id": "SUS-034", "disciplina": "SUS", "tema": "APS e ESF", "subtema": "Decreto 7.508/2011 – portas de entrada", "dificuldade": 3, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Usuária procurou diretamente o ambulatório de cardiologia de um hospital regional, sem encaminhamento, e foi orientada a buscar a UBS. Considerando o Decreto nº 7.508/2011, assinale a afirmativa CORRETA.", "alternativas": {"A": "São portas de entrada a atenção primária, a urgência e emergência, a atenção psicossocial e os serviços especiais de acesso aberto.", "B": "São portas de entrada às ações e serviços nas Redes de Atenção todos os serviços do SUS, inclusive os ambulatórios especializados.", "C": "São portas de entrada às ações e serviços nas Redes de Atenção a atenção primária e os hospitais, excluída a atenção psicossocial.", "D": "São portas de entrada às ações e serviços nas Redes de Atenção os serviços definidos livremente por cada prestador contratado.", "E": "São portas de entrada às ações e serviços nas Redes de Atenção apenas os serviços de atenção primária, vedado outro acesso direto."}, "gabarito": "A", "comentario_correta": "Art. 9º do Decreto 7.508/2011: são Portas de Entrada às ações e serviços de saúde nas Redes de Atenção à Saúde: I – de atenção primária; II – de atenção de urgência e emergência; III – de atenção psicossocial; IV – especiais de acesso aberto.", "por_que_cada_errada": {"A": "Esta é a alternativa a ser marcada.", "B": "A atenção ambulatorial especializada é referenciada pelas portas de entrada (art. 10).", "C": "A atenção psicossocial é porta de entrada expressa (art. 9º, III).", "D": "As portas de entrada são definidas no decreto, não pelo prestador.", "E": "Urgência/emergência, atenção psicossocial e serviços especiais de acesso aberto também são portas de entrada."}, "fundamento": "Decreto 7.508/2011, arts. 9º e 10", "pegadinha": "'Apenas' a atenção primária; incluir ambulatório especializado como porta de entrada.", "prob_tema": 0.1333, "verificar": false}, {"id": "SUS-035", "disciplina": "SUS", "tema": "APS e ESF", "subtema": "Decreto 7.508/2011 – Região de Saúde", "dificuldade": 3, "tipo_enunciado": "direto", "comando": "CORRETA", "texto": null, "enunciado": "O Decreto nº 7.508/2011 regulamenta a organização do SUS e estabelece requisitos mínimos para a instituição de uma Região de Saúde. Assinale a afirmativa CORRETA.", "alternativas": {"A": "A Região de Saúde deve conter, no mínimo, hospital de alta complexidade em cada município que a integra.", "B": "A Região de Saúde deve conter, no mínimo, ações e serviços de atenção primária e vigilância em saúde, sendo facultativos os demais.", "C": "A Região de Saúde deve conter, no mínimo, os serviços definidos pelo Ministério da Saúde, sem participação dos estados e municípios.", "D": "A Região de Saúde deve conter, no mínimo, atenção primária, urgência, psicossocial, especializada e hospitalar, e vigilância em saúde.", "E": "A Região de Saúde deve conter, no mínimo, ações e serviços de atenção primária, urgência e emergência e atenção hospitalar, excluída a vigilância."}, "gabarito": "D", "comentario_correta": "Art. 5º: para ser instituída, a Região de Saúde deve conter, no mínimo, ações e serviços de: I – atenção primária; II – urgência e emergência; III – atenção psicossocial; IV – atenção ambulatorial especializada e hospitalar; V – vigilância em saúde.", "por_que_cada_errada": {"A": "Não há essa exigência; a lógica é regional.", "B": "O art. 5º exige cinco grupos de ações e serviços, não apenas dois.", "C": "As regiões são instituídas pelo Estado, em articulação com os municípios (art. 4º).", "D": "Esta é a alternativa a ser marcada.", "E": "A vigilância em saúde é exigida (art. 5º, V)."}, "fundamento": "Decreto 7.508/2011, arts. 4º e 5º", "pegadinha": "Lista incompleta apresentada como suficiente.", "prob_tema": 0.1333, "verificar": false}, {"id": "SUS-036", "disciplina": "SUS", "tema": "Indicadores e monitoramento", "subtema": "Mortalidade infantil – cálculo", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em determinado ano, um município registrou 1.500 nascidos vivos e 12 óbitos de menores de um ano. Considerando o cálculo do coeficiente de mortalidade infantil, assinale a afirmativa CORRETA.", "alternativas": {"A": "O coeficiente é de 125 nascidos vivos por óbito, obtido pela razão entre nascidos vivos e óbitos de menores de um ano.", "B": "O coeficiente é de 8 óbitos por mil habitantes, obtido pela razão entre óbitos de menores de um ano e a população total do município.", "C": "O coeficiente é de 8 óbitos por mil nascidos vivos, obtido pela razão entre óbitos de menores de um ano e nascidos vivos, multiplicada por mil.", "D": "O coeficiente é de 0,8 óbito por mil nascidos vivos, obtido pela razão entre óbitos de menores de um ano e nascidos vivos, vezes cem.", "E": "O coeficiente é de 8 óbitos por mil nascidos vivos, obtido pela razão entre óbitos de menores de cinco anos e nascidos vivos."}, "gabarito": "C", "comentario_correta": "Mortalidade infantil = (óbitos de menores de 1 ano ÷ nascidos vivos) × 1.000 = 12 ÷ 1.500 × 1.000 = 8 por mil nascidos vivos.", "por_que_cada_errada": {"A": "A razão está invertida e não expressa o indicador.", "B": "O denominador é o número de nascidos vivos, não a população total.", "C": "Esta é a alternativa a ser marcada.", "D": "Multiplica-se por 1.000: 12/1.500 × 1.000 = 8.", "E": "Mortalidade infantil considera menores de um ano; menores de cinco é mortalidade na infância."}, "fundamento": "Indicadores básicos de saúde (RIPSA)", "pegadinha": "Troca de denominador e de faixa etária (< 1 ano × < 5 anos).", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-037", "disciplina": "SUS", "tema": "Indicadores e monitoramento", "subtema": "Eficácia, eficiência e efetividade", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Uma campanha de vacinação atingiu a meta de cobertura com custo menor que o previsto e, nos anos seguintes, reduziu as internações pela doença na população. Considerando os conceitos de avaliação em saúde, assinale a afirmativa CORRETA.", "alternativas": {"A": "A redução das internações expressa a eficiência, isto é, o impacto da intervenção nas condições de saúde da população em situação real.", "B": "A redução das internações expressa a efetividade, que se mede apenas pelo número de doses aplicadas na campanha.", "C": "A redução das internações expressa a eficiência, que dispensa a comparação entre os recursos empregados e os resultados obtidos.", "D": "A redução das internações expressa a eficácia, isto é, o alcance da meta de cobertura com custo menor que o previsto.", "E": "A redução das internações expressa a efetividade, isto é, o impacto real da intervenção na saúde da população."}, "gabarito": "E", "comentario_correta": "Eficácia: efeito em condições ideais ou alcance dos objetivos; eficiência: relação entre resultados e recursos/custos; efetividade: impacto real nas condições de saúde da população.", "por_que_cada_errada": {"A": "Eficiência relaciona resultados e custos; o impacto em condições reais é efetividade.", "B": "Doses aplicadas medem processo/cobertura, não impacto.", "C": "Eficiência é justamente essa comparação.", "D": "Custo menor relaciona-se à eficiência; eficácia é o efeito em condições ideais/alcance de objetivos.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Avaliação em saúde (Donabedian; conceitos de eficácia, eficiência e efetividade)", "pegadinha": "Troca de conceito vizinho (eficácia × eficiência × efetividade).", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-038", "disciplina": "SUS", "tema": "Indicadores e monitoramento", "subtema": "Incidência × prevalência", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "Em 2025, um município com 20.000 habitantes registrou 40 casos novos de tuberculose; ao fim do ano, havia 70 pessoas em tratamento. Considerando as medidas de frequência de doenças, assinale a afirmativa CORRETA.", "alternativas": {"A": "A incidência no ano foi de 200 casos por 100 mil habitantes, e a prevalência tende a ser menor que a incidência em doenças crônicas.", "B": "A incidência no ano foi de 200 casos por 100 mil habitantes, pois considera apenas os casos novos no período.", "C": "A prevalência no ano foi de 200 casos por 100 mil habitantes, pois considera apenas os casos novos no período.", "D": "A incidência no ano foi de 2 casos por 100 mil habitantes, pois se divide o número de casos novos pela população total.", "E": "A incidência no ano foi de 350 casos por 100 mil habitantes, pois considera todos os casos existentes no período."}, "gabarito": "B", "comentario_correta": "Incidência = casos novos ÷ população em risco × 100.000 = 40 ÷ 20.000 × 100.000 = 200. Prevalência pontual = 70 ÷ 20.000 × 100.000 = 350.", "por_que_cada_errada": {"A": "Em doenças de longa duração, a prevalência tende a superar a incidência.", "B": "Esta é a alternativa a ser marcada.", "C": "Casos novos definem incidência, não prevalência.", "D": "40 ÷ 20.000 × 100.000 = 200.", "E": "350/100 mil corresponde aos 70 casos existentes (prevalência)."}, "fundamento": "Epidemiologia descritiva – medidas de frequência", "pegadinha": "Troca incidência × prevalência e erro de escala.", "prob_tema": 0.0667, "verificar": false}, {"id": "SUS-039", "disciplina": "SUS", "tema": "Controle social", "subtema": "Convocação da Conferência", "dificuldade": 2, "tipo_enunciado": "situacional", "comando": "CORRETA", "texto": null, "enunciado": "O prefeito não convocou a Conferência Municipal de Saúde no prazo legal, e o Conselho Municipal de Saúde decidiu convocá-la. Considerando a Lei nº 8.142/1990, assinale a afirmativa CORRETA.", "alternativas": {"A": "A Conferência pode ser convocada pelo Poder Legislativo, a quem cabe suprir a omissão do prefeito na matéria.", "B": "A Conferência pode ser convocada pelo Conselho de Saúde, desde que a periodicidade seja reduzida para dois anos.", "C": "A Conferência pode ser convocada exclusivamente pelo Poder Executivo, sendo nula a convocação pelo Conselho.", "D": "A Conferência pode ser convocada pelo Conselho apenas com autorização prévia do Ministério Público estadual.", "E": "A Conferência pode ser convocada pelo Poder Executivo ou, extraordinariamente, por ela própria ou pelo Conselho de Saúde."}, "gabarito": "E", "comentario_correta": "Art. 1º, § 1º, da Lei 8.142/1990: a Conferência será convocada pelo Poder Executivo ou, extraordinariamente, por esta ou pelo Conselho de Saúde.", "por_que_cada_errada": {"A": "A lei não prevê convocação pelo Legislativo.", "B": "A periodicidade é de quatro anos e não muda com a forma de convocação.", "C": "A lei admite convocação extraordinária pelo Conselho.", "D": "Não há exigência de autorização do Ministério Público.", "E": "Esta é a alternativa a ser marcada."}, "fundamento": "Lei 8.142/1990, art. 1º, § 1º", "pegadinha": "'Exclusivamente' e condicionantes inexistentes.", "prob_tema": 0.0667, "verificar": false}], "reais": [{"id": "R114-01", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 1", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A inteligência artificial (IA), os carros autônomos e as fontes de energia verde deixam de ser exceções para se tornarem o padrão em escala global. A inovação avança em ritmo sem precedentes, e novas invenções, registradas em patentes, surgem continuamente em países e cidades de todos os continentes. De acordo com as regras de concordância verbal, é CORRETO afirmar que:", "alternativas": {"A": "o verbo \"deixam\" encontra-se no plural porque tem como núcleo do sujeito uma enumeração composta por três elementos coordenados — \"inteligência artificial\", \"carros autônomos\" e \"fontes de energia verde\" —, o que exige a concordância verbal na forma plural. Essa construção reforça o caráter cumulativo do sujeito composto, unindo diferentes fenômenos tecnológicos.", "B": "o verbo \"avança\" concorda com o termo \"ritmo\", que funciona como adjunto adverbial de intensidade, reforçando a velocidade do processo de inovação e justificando a permanência do verbo na forma singular, já que o sujeito é composto e se encontra posposto no enunciado, exigindo flexão verbal invariável.", "C": "o verbo \"surgem\" concorda com o termo \"patentes\", núcleo do sujeito, que aparece no plural e indica uma relação de subordinação com o verbo \"registradas\", de modo que ambos os vocábulos mantêm dependência sintática e flexão idêntica para garantir coesão entre as ideias de aparecimento e registro das invenções.", "D": "o verbo \"tornarem\" encontra-se no plural porque se refere a um sujeito oracional introduzido por preposição, e, nesse caso, o verbo deve flexionar-se para concordar com o termo principal que se segue, o substantivo \"padrão\", estabelecendo uma concordância ideológica com o predicativo."}, "gabarito": "A", "verificar": false}, {"id": "R114-02", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 2", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O texto evidencia que o avanço tecnológico nas cidades mais inovadoras do mundo não é apenas um fenômeno técnico, mas também uma experiência vivida pelos cidadãos. As descrições de moradores como Jamie River, Dana Yao e Ritesh Patel revelam que o contato direto com a tecnologia redefine a forma de perceber o espaço urbano, o trabalho e as relações sociais, aproximando o cotidiano daquilo que antes era considerado futurista. De acordo com o texto, é CORRETO afirmar que:", "alternativas": {"A": "a percepção dos moradores das cidades citadas demonstra que a inovação tecnológica está profundamente incorporada à experiência humana, influenciando o modo como as pessoas consomem, se locomovem e interagem, mas sem eliminar os vínculos sociais e culturais.", "B": "os depoimentos dos moradores indicam que a vida nas cidades inovadoras é marcada pelo isolamento e pela dependência excessiva das máquinas, o que provoca o afastamento das pessoas e a perda do senso comunitário, uma vez que a automação substitui os encontros sociais e reduz a interação humana a relações mediadas por dispositivos tecnológicos.", "C": "o relato sobre os moradores e visitantes das cidades inovadoras tem caráter predominantemente crítico, pois revela a insatisfação generalizada com a automatização e com o uso de inteligência artificial, sugerindo que as promessas de eficiência não se concretizaram e que o avanço técnico resultou em perda de qualidade de vida nas grandes metrópoles.", "D": "o texto descreve a experiência dos entrevistados como exemplo de resistência ao uso da tecnologia, destacando a dificuldade dos cidadãos em aceitar as inovações e o temor de que o avanço técnico represente uma ameaça à autonomia humana e à preservação dos valores tradicionais."}, "gabarito": "A", "verificar": false}, {"id": "R114-03", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 3", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A quarta posição pertence a Pequim, que lidera em número de publicações científicas e se destaca por combinar alta tecnologia e tradição. A futurista Elle Farrell-Kingsley descreve a cidade como um ambiente em que inovação, cultura e qualidade de vida coexistem. De acordo com as regras de concordância nominal, é CORRETO afirmar que:", "alternativas": {"A": "o adjetivo \"inovação\" exerce função adjetiva em relação a \"ambiente\", conferindo-lhe valor qualificativo e de intensidade, motivo pelo qual poderia variar para \"inovacionais\" se o sujeito fosse plural.", "B": "o adjetivo \"alta\" concorda com o substantivo \"tecnologia\", mas também se estende semanticamente a \"tradição\", configurando um caso de concordância atrativa, na qual o adjetivo no singular se refere a dois núcleos de gêneros diferentes unidos pela conjunção \"e\".", "C": "o adjetivo \"científicas\" concorda em gênero e número com o substantivo \"publicações\", núcleo do termo \"número de publicações científicas\", mantendo com ele a relação de subordinação característica dos adjetivos restritivos que especificam o substantivo determinado.", "D": "o adjetivo \"futurista\" concorda em gênero e número com o substantivo \"Elle Farrell-Kingsley\", funcionando como predicativo e podendo, portanto, variar para \"futurísticos\" caso houvesse referência a vários profissionais."}, "gabarito": "C", "verificar": false}, {"id": "R114-04", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 4", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Em quinto lugar, Seul, na Coreia do Sul, responde por 5,4% dos pedidos de patentes globais e é líder asiática em investimentos de capital de risco. O morador Chris Oberman afirma que a busca pela inovação vem da escassez de recursos naturais: \"Há um impulso coletivo para crescer e não ficar para trás.\" De acordo com as regras de concordância nominal, é CORRETO afirmar que:", "alternativas": {"A": "o adjetivo \"coletivo\" concorda com o substantivo \"crescer\", uma vez que este expressa a ideia de ação conjunta e retoma o valor semântico do adjetivo, formando uma relação de equivalência que justifica a flexão de gênero e número.", "B": "o adjetivo \"naturais\" concorda com o substantivo \"escassez\", ao qual se refere diretamente, configurando um caso de concordância atrativa, pois o adjetivo plural acompanha o sentido coletivo da palavra singular.", "C": "o adjetivo \"globais\" concorda com o substantivo \"pedidos\", núcleo do termo \"pedidos de patentes globais\", já que ambos estão no plural, e o adjetivo qualifica diretamente o substantivo que o antecede, expressando a abrangência dos registros em escala mundial.", "D": "o adjetivo \"asiática\" concorda em gênero e número com o substantivo \"líder\", núcleo do predicativo do sujeito, e mantém com ele a relação típica de concordância nominal entre adjetivo e substantivo, expressando o valor de origem geográfica atribuído ao termo."}, "gabarito": "D", "verificar": false}, {"id": "R114-05", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 5", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O texto apresenta uma análise comparativa entre diferentes polos de inovação no mundo, mostrando como fatores históricos, econômicos e culturais influenciam o modo como cada cidade se desenvolve tecnologicamente. Embora o avanço da inteligência artificial, da automação e da energia limpa seja global, a distribuição desses benefícios não ocorre de forma uniforme. De acordo com o texto, é CORRETO afirmar que:", "alternativas": {"A": "o relatório da OMPI demonstra que a inovação tecnológica é um fenômeno concentrado, pois os cem maiores polos de inovação respondem pela maior parte das patentes e do capital de risco mundiais, revelando que o progresso científico e digital tende a se consolidar nas regiões com maior estrutura econômica, educacional e institucional.", "B": "o relatório da OMPI indica que o ritmo de inovação é homogêneo entre os continentes, e que as cidades analisadas apresentam níveis semelhantes de investimento, infraestrutura e resultados científicos, evidenciando uma uniformização dos processos tecnológicos em escala mundial.", "C": "o texto afirma que as regiões mais inovadoras do planeta são aquelas que conseguiram eliminar completamente as desigualdades sociais e econômicas, utilizando a tecnologia como instrumento de equilíbrio global, capaz de assegurar condições homogêneas de acesso à ciência e aos serviços digitais em todas as partes do mundo.", "D": "a presença de cidades latino-americanas no ranking da OMPI demonstra que o continente já ocupa posição de protagonismo mundial na produção de tecnologia e inovação, ultrapassando inclusive centros tradicionais da Europa e da Ásia em volume de patentes e investimentos em pesquisa científica e tecnológica."}, "gabarito": "A", "verificar": false}, {"id": "R114-06", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 6", "disciplina": "Português", "tema": "Fonologia", "subtema": "Fonologia", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Em segundo lugar está o polo Tóquio−Yokohama, no Japão, responsável por mais de 10% das patentes internacionais. Para a moradora Dana Yao, o avanço tecnológico japonês é discreto, prático e profundamente humano. De acordo com as regras de acentuação, é CORRETO afirmar que:", "alternativas": {"A": "há dois vocábulos acentuados por serem paroxítonos, porém com terminações diferentes, o que demonstra a aplicação de regras variadas dentro da mesma categoria de tonicidade. O vocábulo \"Tóquio\" apresenta acento por terminar em ditongo crescente, e o termo \"responsável\" recebe acento por terminar em \"L\".", "B": "há três vocábulos acentuados por serem proparoxítonos legítimos, em que a sílaba tônica se localiza na antepenúltima posição, caracterizando a forma mais estável e uniforme de acentuação gráfica da língua portuguesa. Essa classe de palavras abrange, no trecho, vocábulos que denotam tecnicidade e abstração.", "C": "há um vocábulo que recebe acento por ser oxítono terminado em \"o\", correspondendo à regra geral de acentuação das palavras que finalizam em \"a(s)\", \"e(s)\" e \"o(s)\", as quais, em sua maioria, são grafadas com acento agudo na vogal final para indicar maior intensidade sonora. O termo acentuado segue, portanto, o padrão fonético de tonicidade máxima.", "D": "os vocábulos \"está\" e \"é\" são acentuados por serem oxítonos terminados em \"a\" e \"e\", respectivamente, constituindo exemplos clássicos da mesma regra de acentuação das palavras cuja sílaba tônica recai sobre a última posição e que finalizam em vogal aberta."}, "gabarito": "A", "verificar": false}, {"id": "R114-07", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 7", "disciplina": "Português", "tema": "Sintaxe", "subtema": "Sintaxe", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Para compreender como a tecnologia influencia a vida cotidiana, a BBC conversou com moradores dos cinco principais polos de inovação do mundo, explorando de que forma esses ambientes transformam o cotidiano de quem vive neles e oferecem aos visitantes experiências futurísticas antes mesmo que elas cheguem a outras regiões. De acordo com as regras de concordância verbal, é CORRETO afirmar que:", "alternativas": {"A": "o verbo \"oferecem\" apresenta flexão plural em concordância com o termo \"de quem vive neles\", expressão que retoma o conjunto dos moradores mencionados anteriormente e sugere a ideia de pluralidade implícita no pronome \"quem\", que, embora invariável, faz referência a vários indivíduos. A forma verbal plural reforçaria essa noção de multiplicidade associada aos sujeitos do enunciado.", "B": "o verbo \"influencia\" concorda com o sujeito composto \"tecnologia e vida cotidiana\", expressando a relação de reciprocidade entre ambos os termos e, por isso, permanece no singular para preservar a coerência do período e a harmonia semântica entre causa e consequência.", "C": "o verbo \"conversou\" encontra-se no singular porque tem como sujeito o substantivo próprio \"BBC\", núcleo singular e explícito da oração, o que determina a flexão verbal nessa forma. A estrutura evidencia um sujeito simples, em que a entidade jornalística exerce a ação de dialogar com os moradores mencionados, configurando uma concordância direta e obrigatória entre verbo e sujeito.", "D": "o verbo \"cheguem\" flexiona-se no plural porque concorda com o sujeito oracional composto \"elas\", pronome que retoma o termo \"experiências futurísticas\", e indica uma ação hipotética, expressa no modo subjuntivo, representando eventos que ainda não ocorreram, mas são esperados."}, "gabarito": "C", "verificar": false}, {"id": "R114-08", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 8", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O texto analisa como a inovação tecnológica deixou de ser um fenômeno isolado para se tornar um elemento estruturante das relações econômicas e sociais contemporâneas. Ao citar exemplos de cidades como Shenzhen, Tóquio, São Francisco e Seul, o autor revela que a tecnologia atua não apenas como motor econômico, mas também como mecanismo de reorganização das dinâmicas urbanas e da interação entre cidadãos e governos. De acordo com o texto, é CORRETO afirmar que:", "alternativas": {"A": "as cidades mais inovadoras mencionadas no texto compartilham um modelo homogêneo de progresso, no qual o crescimento tecnológico segue a mesma trajetória em todos os continentes, demonstrando que a globalização eliminou as especificidades regionais e culturais no desenvolvimento urbano.", "B": "a inovação tecnológica é tratada como processo espontâneo e desarticulado, sem ligação com o planejamento estatal, com as instituições científicas ou com o ambiente social das cidades, sendo impulsionada apenas pela iniciativa privada e pelos investimentos diretos de empresas multinacionais.", "C": "o Índice de Inovação Global evidencia que o desenvolvimento tecnológico mundial está vinculado a fatores econômicos, científicos e sociais interdependentes, de modo que as cidades mais inovadoras concentram não só investimentos e capital de risco, mas também políticas públicas e práticas culturais.", "D": "as transformações descritas no texto indicam que o crescimento econômico global é consequência exclusiva da automação e da substituição de mão de obra humana por sistemas de inteligência artificial, o que reforça a redução do papel social das pessoas nas novas estruturas produtivas."}, "gabarito": "C", "verificar": false}, {"id": "R114-09", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 9", "disciplina": "Português", "tema": "Fonologia", "subtema": "Fonologia", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Entre as experiências recomendadas estão o Henn Na Hotel, em que o check-in é automatizado e o serviço realizado por robôs, o trem autônomo da linha Yurikamome, com vista panorâmica da baía. De acordo com as regras de acentuação, é CORRETO afirmar que:", "alternativas": {"A": "há um vocábulo que perdeu o acento diferencial após a vigência do novo Acordo Ortográfico, o que reflete a simplificação promovida pela reforma nas grafias que apresentavam distinções baseadas apenas em timbre ou tonicidade vocálica. Essa mudança buscou uniformizar o uso dos acentos gráficos.", "B": "há dois vocábulos acentuados por serem paroxítonos terminados em ditongo, o que representa um dos casos mais recorrentes de acentuação gráfica da língua portuguesa. Nesses casos, a penúltima sílaba recebe a tonicidade e a presença do ditongo final justifica a marca gráfica.", "C": "há três vocábulos acentuados por serem proparoxítonos, ou seja, por apresentarem a tonicidade na antepenúltima sílaba, conforme a regra geral que determina o uso obrigatório do acento gráfico em todas as palavras dessa categoria.", "D": "o vocábulo \"baía\" é acentuado pela regra do \"i\" tônico que forma hiato e aparece isolado na separação silábica, o que exige o uso do acento gráfico para indicar o rompimento de sílaba e a presença de duas vogais em sílabas distintas."}, "gabarito": "D", "verificar": false}, {"id": "R114-10", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 10", "disciplina": "Português", "tema": "Interpretação e Análise Textual", "subtema": "Interpretação e Análise Textual", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O texto aborda a transformação das grandes cidades em polos de inovação e tecnologia, destacando como o avanço científico e a automação se entrelaçam com os aspectos sociais, econômicos e culturais. De acordo com o texto, é CORRETO afirmar que:", "alternativas": {"A": "o desenvolvimento tecnológico relatado se limita à esfera econômica, sendo descrito como um fenômeno restrito à expansão do capital de risco e à criação de startups, sem interferir no cotidiano dos cidadãos, o que reforça o caráter puramente financeiro das inovações e o distanciamento entre a economia e a vida social das cidades mais avançadas.", "B": "o texto apresenta a inovação como um movimento essencialmente ocidental, centrado em polos tecnológicos dos Estados Unidos e da Europa, reforçando a ideia de que o avanço científico continua a depender das potências tradicionais e que as regiões asiáticas ainda não possuem protagonismo relevante no cenário global contemporâneo.", "C": "a narrativa enfatiza que o avanço tecnológico substitui completamente os valores culturais tradicionais, criando uma ruptura definitiva entre o passado e o presente, já que o foco das cidades inovadoras é eliminar costumes antigos e promover a uniformização global do modo de vida urbano, sem espaço para manifestações culturais regionais.", "D": "o avanço tecnológico retratado representa uma síntese entre tradição e modernidade, na qual o desenvolvimento científico e a incorporação de novas tecnologias convivem com elementos culturais locais, demonstrando que a inovação não elimina as identidades regionais, mas as transforma em parte do processo de evolução urbana e social."}, "gabarito": "D", "verificar": false}, {"id": "R114-11", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 11", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Utilização de planilhas eletrônicas", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A ferramenta de Validação de Dados é amplamente utilizada para manter a integridade das informações inseridas em planilhas, permitindo restringir, controlar e orientar o preenchimento das células. Acerca deste recurso e seu funcionamento no Excel, julgue as afirmativas abaixo: I. É possível limitar a entrada de valores em uma célula apenas a números inteiros dentro de um intervalo definido, como entre 1 e 100, utilizando critérios configurados no tipo \"Número inteiro\". II. O uso de mensagens de entrada na validação de dados serve apenas para exibir alertas de erro, não sendo possível inserir instruções ou orientações para o usuário. III. A criação de uma lista suspensa pode ser feita informando manualmente os itens separados por ponto e vírgula ou referenciando um intervalo de células com os valores permitidos. IV. É possível combinar a validação de dados com fórmulas personalizadas, que avaliam condições específicas e retornam verdadeiro ou falso, determinando se a entrada será aceita. Assinale a alternativa correta:", "alternativas": {"A": "Apenas as afirmativas I, III e IV são verdadeiras.", "B": "Apenas as afirmativas II, III e IV são verdadeiras.", "C": "As afirmativas I, II, III e IV são verdadeiras.", "D": "Apenas as afirmativas II e IV são verdadeiras."}, "gabarito": "A", "verificar": false}, {"id": "R114-12", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 12", "disciplina": "Informática", "tema": "Aplicativos de escritório", "subtema": "Aplicativos de escritório", "dificuldade": 0, "comando": "V/F ou sequência", "texto": null, "enunciado": "As funções de marcadores e numeração do Microsoft Word são utilizadas para organizar informações, estruturar ideias e facilitar a leitura de tópicos nos documentos. A função permite criar listas simples e níveis hierárquicos. Acerca dessas funcionalidades, analise as afirmativas a seguir e assinale V (verdadeiro) ou F (falso): (__) O usuário pode modificar listas já criadas no Word, trocando os marcadores originais por símbolos personalizados ou até por imagens, sem precisar refazer o texto existente. (__) O Word não permite criar listas com vários níveis de numeração; para isso, é necessário aplicar manualmente o número e o recuo de cada linha. (__) A ferramenta \"Lista numerada em vários níveis\" permite que diferentes estilos de numeração (como 1., 1.1, 1.1.1) sejam configurados de forma hierárquica e automática. (__) Quando se cria uma lista numerada vinculada a estilos de título, qualquer alteração de formato feita na lista não afeta a estrutura do sumário automático. (__) É possível salvar um estilo de lista personalizado, que inclui o tipo de marcador, o espaçamento e os níveis de recuo, para ser reutilizado em outros documentos. Marque a alternativa que apresenta a sequência correta do itens acima, de cima para baixo:", "alternativas": {"A": "F, F, V. F, V", "B": "V, F, V. F, F", "C": "V, V, V. F, V", "D": "V, F, V. F, V"}, "gabarito": "D", "verificar": false}, {"id": "R114-13", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 13", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "A proteção das informações digitais na internet não depende apenas de mecanismos de segurança ativos, mas também de estratégias de recuperação diante de falhas, perdas ou ataques cibernéticos. Dentre essas estratégias, o backup destaca-se como uma das práticas mais recomendadas para preservar a integridade e a disponibilidade dos dados em ambientes pessoais e corporativos. Considerando boas práticas relacionadas ao uso de backup, assinale a alternativa correta:", "alternativas": {"A": "Backups automáticos agendados são desnecessários, pois a recuperação de dados só é eficiente quando feita manualmente pelo usuário, evitando sobrescritas acidentais.", "B": "O armazenamento em nuvem elimina completamente a necessidade de backups locais, uma vez que os provedores de serviço asseguram proteção total contra falhas e perda de dados.", "C": "O modelo conhecido como \"3-2-1\" recomenda ter três cópias dos dados, armazenadas em pelo menos dois tipos de mídia diferentes, sendo uma delas mantida fora do local principal.", "D": "Manter apenas uma cópia de segurança em um dispositivo conectado permanentemente ao computador principal garante maior agilidade no processo de restauração, sem comprometer a segurança."}, "gabarito": "C", "verificar": false}, {"id": "R114-14", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 14", "disciplina": "Informática", "tema": "Conceitos de sistemas operacionais", "subtema": "Conceitos de sistemas operacionais", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "No ambiente do sistema operacional Windows, a utilização de teclas de atalho representa um importante recurso, permitindo acesso rápido a comandos, janelas e funções do sistema sem depender do uso do mouse. Acerca deste recurso, julgue as afirmativas a seguir: I. A combinação Alt + Tab possibilita alternar rapidamente entre as janelas abertas, apresentando uma visualização dos programas em execução. II. O atalho Ctrl + Shift + Esc abre diretamente o Gerenciador de Tarefas, dispensando o menu intermediário acessado por Ctrl + Alt + Del. III. A sequência Windows + D minimiza todas as janelas abertas e exibe a área de trabalho, permitindo retorno imediato ao pressioná-la novamente. IV. A combinação Alt + F4, quando usada em uma janela ativa, apenas minimiza o aplicativo atual, mantendo-o em execução em segundo plano. Assinale a alternativa correta:", "alternativas": {"A": "As afirmativas I, II, III e IV são verdadeiras.", "B": "Apenas as afirmativas I, II e IV são verdadeiras.", "C": "Apenas as afirmativas II, III e IV são verdadeiras.", "D": "Apenas as afirmativas I, II e III são verdadeiras."}, "gabarito": "D", "verificar": false}, {"id": "R114-15", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 15", "disciplina": "Informática", "tema": "Aplicativos de escritório", "subtema": "Aplicativos de escritório", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Os modelos do Microsoft Word constituem um recurso para padronizar documentos e otimizar o processo de formatação, garantindo consistência e economia de tempo em relatórios, ofícios, contratos e outros tipos de texto. Com base nas propriedades e no funcionamento dos modelos do Word, analise as afirmativas a seguir: I. Um modelo no Word é um arquivo base que armazena configurações de formatação, estilos de parágrafo, fontes, margens e demais elementos estruturais que servem como referência para novos documentos. II. Os modelos possuem a extensão padrão .dotx, e quando contêm macros associadas, utilizam a extensão .dotm, permitindo a execução automatizada de tarefas no documento. III. Alterações feitas em um documento gerado a partir de um modelo modificam automaticamente o arquivo original do modelo, uma vez que ambos permanecem vinculados de forma permanente. IV. É possível criar modelos personalizados e defini-los como padrão para novos documentos, substituindo o modelo Normal.dotx que o Word utiliza por padrão. Assinale a alternativa correta:", "alternativas": {"A": "Apenas as afirmativas II e III são verdadeiras.", "B": "Apenas as afirmativas I, II e IV são verdadeiras.", "C": "Apenas as afirmativas I, III e IV são verdadeiras.", "D": "As afirmativas I, II, III e IV são verdadeiras."}, "gabarito": "B", "verificar": false}, {"id": "R114-16", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 16", "disciplina": "Informática", "tema": "Conceitos de segurança da informação e proteção de dados", "subtema": "Conceitos de segurança da informação e proteção de dados", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "O comportamento do usuário passou a ter um papel determinante na manutenção da segurança das informações com o aumento das atividades digitais, mesmo utilizando antivírus e firewalls, o fator humano continua sendo o ponto mais vulnerável nas redes. Considerando práticas seguras de navegação e uso da Internet, assinale a alternativa correta:", "alternativas": {"A": "É seguro inserir dados bancários em sites de comércio eletrônico mesmo sem o protocolo HTTPS, desde que o site seja amplamente conhecido pelos usuários.", "B": "Senhas complexas, compostas por letras maiúsculas, minúsculas, números e símbolos, reduzem significativamente o risco de acesso indevido às contas pessoais e corporativas.", "C": "Desativar o firewall do sistema operacional ao utilizar redes públicas pode aumentar o desempenho da conexão sem comprometer a segurança, desde que o antivírus esteja atualizado.", "D": "O uso de redes Wi-Fi abertas é recomendado para o envio de documentos sigilosos, pois facilita a transmissão sem interferências."}, "gabarito": "B", "verificar": false}, {"id": "R114-17", "real": true, "origem": "Sao Jose Serido/RN 2025, questão 17", "disciplina": "Informática", "tema": "Utilização de planilhas eletrônicas", "subtema": "Utilização de planilhas eletrônicas", "dificuldade": 0, "comando": "CORRETA", "texto": null, "enunciado": "Matheus é assistente administrativo e precisa identificar rapidamente na planilha do Excel quais produtos tiveram vendas acima da média em uma tabela de 50 itens. Ele possui os valores das vendas na coluna C (de C2 até C51) e deseja destacar AUTOMATICAMENTE as células que superam a média geral dessa coluna, sem precisar comparar valor por valor. Considerando os recursos do Microsoft Excel, assinale a alternativa que apresenta corretamente o procedimento adequado para ele atingir esse objetivo:", "alternativas": {"A": "Usar o Classificar do menor para o maior e depois aplicar manualmente uma cor nas linhas de maior valor.", "B": "

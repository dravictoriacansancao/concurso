# Mantém o projeto Supabase (plano gratuito) acordado.
# O Supabase pausa projetos gratuitos após ~7 dias sem atividade;
# este workflow faz uma consulta a cada 3 dias.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       ex.: https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  a chave "anon public" do projeto
# Opcional:
#   SUPABASE_TABLE     nome de uma tabela para consultar (1 linha)

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 11 */3 * *" # a cada 3 dias, 08:17 em Maceió
  workflow_dispatch: # botão "Run workflow" para testar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          set -eu
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Cadastre os segredos SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/"
          if [ -n "${SUPABASE_TABLE:-}" ]; then
            url="${url}${SUPABASE_TABLE}?select=*&limit=1"
          fi
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$url")
          echo "HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase não respondeu (HTTP $code). O projeto pode estar pausado: abra o painel e clique em Restore project."
            exit 1
          fi
          echo "Supabase acordado ✔"
